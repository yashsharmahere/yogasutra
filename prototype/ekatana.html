nd virility.","vv":"By the establishment of continence energy is gained.","concepts":[]},{"id":"2.39","pada":2,"n":39,"group":20,"iast":"aparigrahasthairye janmakathaṃtāsaṃbodhaḥ","deva":"अपरिग्रहस्थैर्ये जन्मकथंतासंबोधः","en":"As soon as he is established in abstinence from acceptance of gifts, a thorough illumination upon the conditions of birth.","jn":"Where there is firm conquest of covetousness, he who has conquered it awakes to the how and why of life.","vv":"When he is fixed in non-receiving, he gets the memory of past life.","concepts":[]},{"id":"2.40","pada":2,"n":40,"group":20,"iast":"śaucāt svāṅgajugupsā parair asaṃsargaḥ","deva":"शौचात्स्वाङ्गजुगुप्सा परैरसंसर्गः","en":"As a result of cleanliness there is disgust at one's own body and no intercourse with others.","jn":"Through purity a withdrawal from one’s own bodily life, a ceasing from infatuation with the bodily life of others.","vv":"Internal and external cleanliness being established, there arises disgust for one's own body, and non-intercourse with others.","concepts":[]},{"id":"2.41","pada":2,"n":41,"group":20,"iast":"sattvaśuddhisaumanasyaikāgryendriyajayātmadarśanayogyatvāni ca","deva":"सत्त्वशुद्धिसौमनस्यैकाग्र्येन्द्रियजयात्मदर्शनयोग्यत्वानि च","en":"Purity of sattva and gentleness and singleness-of-intent and subjugation of the senses and fitness for the sight of the self.","jn":"To the pure of heart come also a quiet spirit, one-pointed thought, the victory over sensuality, and fitness to behold the Soul.","vv":"There also arises purification of the Sattva, cheerfulness of the mind, concentration, conquest of the organs, and fitness for the realisation of the Self.","concepts":["ekagrata"]},{"id":"2.42","pada":2,"n":42,"group":20,"iast":"saṃtoṣād anuttamaḥ sukhalābhaḥ","deva":"संतोषादनुत्तमः सुखलाभः","en":"As a result of contentment there is an acquisition of superlative pleasure.","jn":"From acceptance, the disciple gains happiness supreme.","vv":"From contentment comes superlative happiness.","concepts":[]},{"id":"2.43","pada":2,"n":43,"group":20,"iast":"kāyendriyasiddhir aśuddhikṣayāt tapasaḥ","deva":"कायेन्द्रियसिद्धिरशुद्धिक्षयात्तपसः","en":"Perfection in the body and in the organs after impurity has dwindled as a result of self-castigation.","jn":"The perfection of the powers of the bodily vesture comes through the wearing away of impurities, and through fervent aspiration.","vv":"The result of mortification is bringing powers to the organs and the body, by destroying the impurity.","concepts":["siddhi","tapas"]},{"id":"2.44","pada":2,"n":44,"group":20,"iast":"svādhyāyād iṣṭadevatāsaṃprayogaḥ","deva":"स्वाध्यायादिष्टदेवतासंप्रयोगः","en":"As a result of study there is communion with the chosen deity.","jn":"Through spiritual reading, the disciple gains communion with the divine Power on which his heart is set.","vv":"By the repetition of the Mantra comes the realisation of the intended deity.","concepts":["svadhyaya"]},{"id":"2.45","pada":2,"n":45,"group":20,"iast":"samādhisiddhir īśvarapraṇidhānāt","deva":"समाधिसिद्धिरीश्वरप्रणिधानात्","en":"Perfection of concentration as a result of devotion to the Içvara.","jn":"Soul-vision is perfected through perfect obedience to the Master.","vv":"By sacrificing all to Ishvara comes Samadhi.","concepts":["isvara","samadhi","siddhi"]},{"id":"2.46","pada":2,"n":46,"group":21,"iast":"sthirasukham āsanam","deva":"स्थिरसुखमासनम्","en":"Stable-and-easy posture.","jn":"Right poise must be firm and without strain.","vv":"Posture is that which is firm and pleasant.","concepts":["asana"]},{"id":"2.47","pada":2,"n":47,"group":21,"iast":"prayatnaśaithilyānantasamāpattibhyām","deva":"प्रयत्नशैथिल्यानन्तसमापत्तिभ्याम्","en":"By relaxation of effort or by a [mental] state-of-balance with reference to Ananta.","jn":"Right poise is to be gained by steady and temperate effort, and by setting the heart upon the everlasting.","vv":"By lessening the natural tendency (for restlessness) and meditating on the unlimited, posture becomes firm and pleasant.","concepts":["samapatti"]},{"id":"2.48","pada":2,"n":48,"group":21,"iast":"tato dvandvānabhighātaḥ","deva":"ततो द्वन्द्वानभिघातः","en":"Thereafter he is unassailed by extremes.","jn":"The fruit of right poise is the strength to resist the shocks of infatuation or sorrow.","vv":"Seat being conquered, the dualities do not obstruct.","concepts":[]},{"id":"2.49","pada":2,"n":49,"group":22,"iast":"tasmin sati śvāsapraśvāsayor gativicchedaḥ prāṇāyāmaḥ","deva":"तस्मिन्सति श्वासप्रश्वासयोर्गतिविच्छेदः प्राणायामः","en":"When there is [stability of posture], the restraint of breath, a cutting off of the flow of inspiration and expiration, follows.","jn":"When this is gained, there follows the right guidance of the life-currents, the control of the incoming and outgoing breath.","vv":"Controlling the motion of the exhalation and the inhalation follows after this.","concepts":["prana"]},{"id":"2.50","pada":2,"n":50,"group":22,"iast":"bāhyābhyantarastambhavṛttir deśakālasaṃkhyābhiḥ paridṛṣṭo dīrghasūkṣmaḥ","deva":"बाह्याभ्यन्तरस्तम्भवृत्तिर्देशकालसंख्याभिः परिदृष्टो दीर्घसूक्ष्मः","en":"[This is] external or internal or suppressed in fluctuation and is regulated by place and time and number and is protracted and subtile.","jn":"The life-current is either outward, or inward, or balanced; it is regulated according to place, time, number; it is prolonged and subtle.","vv":"Its modifications are either external or internal, or motionless, regulated by place, time, and number, either long or short.","concepts":["vrtti"]},{"id":"2.51","pada":2,"n":51,"group":22,"iast":"bāhyābhyantaraviṣayākṣepī caturthaḥ","deva":"बाह्याभ्यन्तरविषयाक्षेपी चतुर्थः","en":"The fourth [restraint of the breath] transcends the external and the internal object.","jn":"The fourth degree transcends external and internal objects.","vv":"The fourth is restraining the Prana by reflecting on external or internal object.","concepts":[]},{"id":"2.52","pada":2,"n":52,"group":22,"iast":"tataḥ kṣīyate prakāśāvaraṇam","deva":"ततः क्षीयते प्रकाशावरणम्","en":"As a result of this the covering of the light dwindles away.","jn":"Thereby is worn away the veil which covers up the light.","vv":"From that, the covering to the light of the Chitta is attenuated.","concepts":[]},{"id":"2.53","pada":2,"n":53,"group":23,"iast":"dhāraṇāsu ca yogyatā manasaḥ","deva":"धारणासु च योग्यता मनसः","en":"For fixed-attentions also the central organ becomes fit.","jn":"Thence comes the mind’s power to hold itself in the light.","vv":"The mind becomes fit for Dharana.","concepts":["manas","dharana"]},{"id":"2.54","pada":2,"n":54,"group":23,"iast":"svaviṣayāsaṃprayoge cittasvarūpānukāra ivendriyāṇāṃ pratyāhāraḥ","deva":"स्वविषयासंप्रयोगे चित्तस्वरूपानुकार इवेन्द्रियाणां प्रत्याहारः","en":"The withdrawal of the senses is as it were the imitation of the mind-stuff as it is in itself on the part of the organs by disjoining themselves from their object.","jn":"The right Withdrawal is the disengaging of the powers from entanglement in outer things, as the psychic nature has been withdrawn and stilled.","vv":"The drawing in of the organs is by their giving up their own objects and taking the form of the mind-stuff, as it were.","concepts":["citta","pratyahara"]},{"id":"2.55","pada":2,"n":55,"group":23,"iast":"tataḥ paramā vaśyatendriyāṇām","deva":"ततः परमा वश्यतेन्द्रियाणाम्","en":"As a result of this [withdrawal] there is a complete-mastery of the organs.","jn":"Thereupon follows perfect mastery over the powers.","vv":"Thence arises supreme control of the organs.","concepts":[]},{"id":"3.1","pada":3,"n":1,"group":24,"iast":"deśabandhaś cittasya dhāraṇā","deva":"देशबन्धश्चित्तस्य धारणा","en":"Binding the mind-stuff to a place is fixed-attention.","jn":"The binding of the perceiving consciousness to a certain region is attention (dharana).","vv":"Dhâranâ is holding the mind on to some particular object.","concepts":["citta","dharana"]},{"id":"3.2","pada":3,"n":2,"group":25,"iast":"tatra pratyayaikatānatā dhyānam","deva":"तत्र प्रत्ययैकतानता ध्यानम्","en":"Focusedness of the presented idea upon that [place] is contemplation.","jn":"A prolonged holding of the perceiving consciousness in that region is meditation (dhyana).","vv":"An unbroken flow of knowledge in that object is Dhyâna.","concepts":["pratyaya","dhyana"]},{"id":"3.3","pada":3,"n":3,"group":26,"iast":"tad evārthamātranirbhāsaṃ svarūpaśūnyam iva samādhiḥ","deva":"तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः","en":"This same [contemplation], shining forth [in consciousness] as the intended object and nothing more, and, as it were, emptied of itself, is concentration.","jn":"When the perceiving consciousness in this meditative is wholly given to illuminating the essential meaning of the object contemplated, and is freed from the sense of separateness and personality, this is contemplation (samadhi).","vv":"When that, giving up all forms, reflects only the meaning, it is Samâdhi.","jnote":"Gutenberg prints “in this meditative”; a word, probably “state”, appears to be missing.","concepts":["samadhi"]},{"id":"3.4","pada":3,"n":4,"group":27,"iast":"trayam ekatra saṃyamaḥ","deva":"त्रयमेकत्र संयमः","en":"The three in one are constraint.","jn":"When these three, Attention, Meditation Contemplation, are exercised at once, this is perfectly concentrated Meditation (sanyama).","vv":"(These) three (when practiced) in regard to one object is Samyama.","concepts":["samyama"]},{"id":"3.5","pada":3,"n":5,"group":27,"iast":"tajjayāt prajñālokaḥ","deva":"तज्जयात्प्रज्ञालोकः","en":"As a result of mastering this constraint, there follows the shining forth of insight.","jn":"By mastering this perfectly concentrated Meditation, there comes the illumination of perception.","vv":"By the conquest of that comes light of knowledge.","concepts":["prajna"]},{"id":"3.6","pada":3,"n":6,"group":27,"iast":"tasya bhūmiṣu viniyogaḥ","deva":"तस्य भूमिषु विनियोगः","en":"Its application is by stages.","jn":"This power is distributed in ascending degrees.","vv":"That should be employed in stages.","concepts":[]},{"id":"3.7","pada":3,"n":7,"group":27,"iast":"trayam antaraṅgaṃ pūrvebhyaḥ","deva":"त्रयमन्तरङ्गं पूर्वेभ्यः","en":"The three are direct aids in comparison with the previous [five].","jn":"This threefold power, of Attention, Meditation, Contemplation, is more interior than the means of growth previously described.","vv":"These three are more internal than those that precede.","concepts":[]},{"id":"3.8","pada":3,"n":8,"group":27,"iast":"tad api bahiraṅgaṃ nirbījasya","deva":"तदपि बहिरङ्गं निर्बीजस्य","en":"Even these [three] are indirect aids to seedless [concentration].","jn":"But this triad is still exterior to the soul vision which is unconditioned, free from the seed of mental analyses.","vv":"But even they are external to the seedless (Samadhi).","concepts":["bija"]},{"id":"3.9","pada":3,"n":9,"group":27,"iast":"vyutthānanirodhasaṃskārayor abhibhavaprādurbhāvau nirodhakṣaṇacittānvayo nirodhapariṇāmaḥ","deva":"व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भावौ निरोधक्षणचित्तान्वयो निरोधपरिणामः","en":"When there is a becoming invisible of the subliminal-impression of emergence and a becoming visible of the subliminal-impression of restriction, the mutation of restriction is inseparably connected with mind-stuff in its period of restriction.","jn":"One of the ascending degrees is the development of Control. First there is the overcoming of the mind-impress of excitation. Then comes the manifestation of the mind-impress of Control. Then the perceiving consciousness follows after the moment of Control.","vv":"By the suppression of the disturbed impressions of the mind, and by the rise of impressions of control, the mind, which persists in that moment of control, is said to attain the controlling modifications.","concepts":["citta","nirodha","samskara","parinama"]},{"id":"3.10","pada":3,"n":10,"group":27,"iast":"tasya praśāntavāhitā saṃskārāt","deva":"तस्य प्रशान्तवाहिता संस्कारात्","en":"This [mind-stuff] flows peacefully by reason of the subliminal-impression.","jn":"Through frequent repetition of this process, the mind becomes habituated to it, and there arises an equable flow of perceiving consciousness.","vv":"Its flow becomes steady by habit.","concepts":["samskara"]},{"id":"3.11","pada":3,"n":11,"group":28,"iast":"sarvārthataikāgratayoḥ kṣayodayau cittasya samādhipariṇāmaḥ","deva":"सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समाधिपरिणामः","en":"The mutation of concentration is the dwindling of dispersiveness and the uprisal of singleness-of-intent belonging to the mind-stuff.","jn":"The gradual conquest of the mind’s tendency to flit from one object to another, and the power of one-pointedness, make the development of Contemplation.","vv":"Taking in all sorts of objects, and concentrating upon one object, these two powers being destroyed and manifested respectively, the Chitta gets the modification called Samadhi.","concepts":["citta","ekagrata","samadhi","parinama"]},{"id":"3.12","pada":3,"n":12,"group":28,"iast":"tataḥ punaḥ śāntoditau tulyapratyayau cittasyaikāgratāpariṇāmaḥ","deva":"ततः पुनः शान्तोदितौ तुल्यप्रत्ययौ चित्तस्यैकाग्रतापरिणामः","en":"Then again when the quiescent and the uprisen presented-ideas are similar [in respect of having a single object], the mind-stuff has a mutation single-in-intent.","jn":"When, following this, the controlled manifold tendency and the aroused one-pointedness are equally balanced parts of the perceiving consciousness, his the development of one-pointedness.","vv":"The one-pointedness of the Chitta is when the impression that is past and that which is present are similar.","concepts":["citta","pratyaya","ekagrata","parinama"]},{"id":"3.13","pada":3,"n":13,"group":28,"iast":"etena bhūtendriyeṣu dharmalakṣaṇāvasthāpariṇāmā vyākhyātāḥ","deva":"एतेन भूतेन्द्रियेषु धर्मलक्षणावस्थापरिणामा व्याख्याताः","en":"Thus with regard to elements and to organs, mutations of external-aspect and of time-variation and of intensity have been enumerated.","jn":"Through this, the inherent character, distinctive marks and conditions of being and powers, according to their development, are made clear.","vv":"By this is explained the threefold transformation of form, time and state, in fine or gross matter and in the organs.","concepts":["parinama"]},{"id":"3.14","pada":3,"n":14,"group":28,"iast":"śāntoditāvyapadeśyadharmānupātī dharmī","deva":"शान्तोदिताव्यपदेश्यधर्मानुपाती धर्मी","en":"A substance conforms itself to quiescent and uprisen and indeterminable external-aspects.","jn":"Every object has its characteristics which are already quiescent, those which are active, and those which are not yet definable.","vv":"That which is acted upon by transformations, either past, present, or yet to be manifested is the qualified.","concepts":[]},{"id":"3.15","pada":3,"n":15,"group":28,"iast":"kramānyatvaṃ pariṇāmānyatve hetuḥ","deva":"क्रमान्यत्वं परिणामान्यत्वे हेतुः","en":"The order of the sequence is the reason for the order of the mutations.","jn":"Difference in stage is the cause of difference in development.","vv":"The succession of changes is the cause of manifold evolution.","concepts":["parinama"]},{"id":"3.16","pada":3,"n":16,"group":29,"iast":"pariṇāmatrayasaṃyamād atītānāgatajñānam","deva":"परिणामत्रयसंयमादतीतानागतज्ञानम्","en":"As a result of constraint upon the three mutations [there follows] the knowledge of the past and the future.","jn":"Through perfectly concentrated Meditation on the three stages of development comes a knowledge of past and future.","vv":"By making Samyama on the three sorts of changes comes the knowledge of past and future.","concepts":["parinama","samyama"]},{"id":"3.17","pada":3,"n":17,"group":29,"iast":"śabdārthapratyayānām itaretarādhyāsāt saṃkaras tatpravibhāgasaṃyamāt sarvabhūtarutajñānam","deva":"शब्दार्थप्रत्ययानामितरेतराध्यासात्संकरस्तत्प्रविभागसंयमात्सर्वभूतरुतज्ञानम्","en":"Word and intended-object and presented-idea are confused because they are erroneously identified with each other. By constraint upon the distinctions between them [there arises the intuitive] knowledge of the cries of all living beings.","jn":"The sound and the object and the thought called up by a word are confounded because they are all blurred together in the mind. By perfectly concentrated Meditation on the distinction between them, there comes an understanding of the sounds uttered by all beings.","vv":"By making Samyama on word, meaning and knowledge, which are ordinarily confused, comes the knowledge of all animal sounds.","concepts":["pratyaya","samyama"]},{"id":"3.18","pada":3,"n":18,"group":29,"iast":"saṃskārasākṣātkaraṇāt pūrvajātijñānam","deva":"संस्कारसाक्षात्करणात्पूर्वजातिज्ञानम्","en":"As a result of direct perception of subliminal-impressions there is [intuitive] knowledge of previous births.","jn":"When the mind-impressions become visible, there comes an understanding of previous births.","vv":"By perceiving the impressions, (comes) the knowledge of past life.","concepts":["samskara"]},{"id":"3.19","pada":3,"n":19,"group":29,"iast":"pratyayasya paracittajñānam","deva":"प्रत्ययस्य परचित्तज्ञानम्","en":"[As a result of constraint] upon a presented-idea [there arises intuitive] knowledge of the mind-stuff of another.","jn":"By perfectly concentrated Meditation on mind-images is gained the understanding of the thoughts of others.","vv":"By making Samyama on the signs in another's body, knowledge of his mind comes.","concepts":["citta","pratyaya"]},{"id":"3.20","pada":3,"n":20,"group":29,"iast":"na ca tat sālambanaṃ tasyāviṣayībhūtatvāt","deva":"न च तत्सालम्बनं तस्याविषयीभूतत्वात्","en":"But [the intuitive knowledge of the mind-stuff of another] does not have that [idea] together with that upon which it depends [as its object], since that [upon which it depends] is not-in-the-field [of consciousness].","jn":"But since that on which the thought in the mind of another rests is not objective to the thought-reader’s consciousness, he perceives the thought only, and not also that on which the thought rests.","vv":"But not its contents, that not being the object of the Samyama.","concepts":[]},{"id":"3.21","pada":3,"n":21,"group":29,"iast":"kāyarūpasaṃyamāt tadgrāhyaśaktistambhe cakṣuḥprakāśāsaṃprayoge 'ntardhānam","deva":"कायरूपसंयमात्तद्ग्राह्यशक्तिस्तम्भे चक्षुःप्रकाशासंप्रयोगे ऽन्तर्धानम्","en":"As a result of constraint upon the [outer] form of the body, when its power to be known is stopped, then as a consequence of the disjunction of the light and of the eye there follows indiscernibility [of the yogin's body].","jn":"By perfectly concentrated Meditation on the form of the body, by arresting the body’s perceptibility, and by inhibiting the eye’s power of sight, there comes the power to make the body invisible.","vv":"By making Samyama on the form of the body, the perceptibility of the form being obstructed and the power of manifestation in the eye being separated, the Yogi's body becomes unseen.","concepts":["samyama"]},{"id":"3.22","pada":3,"n":22,"group":29,"iast":"sopakramaṃ nirupakramaṃ ca karma tatsaṃyamād aparāntajñānam ariṣṭebhyo vā","deva":"सोपक्रमं निरुपक्रमं च कर्म तत्संयमादपरान्तज्ञानमरिष्टेभ्यो वा","en":"Advancing and not-advancing is karma; as a result of constraint upon this [twofold karma] or from the signs of death [there arises an intuitive] knowledge of the latter end.","jn":"The works which fill out the life-span may be either immediately or gradually operative. By perfectly concentrated Meditation on these comes a knowledge of the time of the end, as also through signs.","vv":"Karma is of two kinds — soon to be fructified and late to be fructified. By making Samyana on these, or by the signs called Arishta, portents, the Yogis know the exact time of separation from their bodies.","vvnote":"Printed 'Samyana'; kept as printed.","concepts":["karma","samyama"]},{"id":"3.23","pada":3,"n":23,"group":29,"iast":"maitryādiṣu balāni","deva":"मैत्र्यादिषु बलानि","en":"[As a result of constraint] upon friendliness and other [sentiments there arise] powers [of friendliness].","jn":"By perfectly concentrated Meditation on sympathy, compassion and kindness, is gained the power of interior union with others.","vv":"By making Samyama on friendship, mercy, etc. (I. 33 ), the Yogi excels in the respective qualities.","concepts":["maitri"]},{"id":"3.24","pada":3,"n":24,"group":29,"iast":"baleṣu hastibalādīni","deva":"बलेषु हस्तिबलादीनि","en":"[As a result of constraint] upon powers [there arise] powers like those of an elephant.","jn":"By perfectly concentrated Meditation on power, even such power as that of the elephant may be gained.","vv":"By making Samyama on the strength of the elephant and others, their respective strength comes to the Yogi.","concepts":[]},{"id":"3.25","pada":3,"n":25,"group":29,"iast":"pravṛttyālokanyāsāt sūkṣmavyavahitaviprakṛṣṭajñānam","deva":"प्रवृत्त्यालोकन्यासात्सूक्ष्मव्यवहितविप्रकृष्टज्ञानम्","en":"As a result of casting the light of a sense-activity [there arises the intuitive] knowledge of the subtile and the concealed and the obscure.","jn":"By bending upon them the awakened inner light, there comes a knowledge of things subtle, or concealed, or obscure.","vv":"By making Samyama on the Effulgent Light (I. 36 ), comes the knowledge of the fine, the obstructed, and the remote.","concepts":[]},{"id":"3.26","pada":3,"n":26,"group":29,"iast":"bhuvanajñānaṃ sūrye saṃyamāt","deva":"भुवनज्ञानं सूर्ये संयमात्","en":"As a result of constraint upon the sun [there arises the intuitive] knowledge of the cosmic-spaces.","jn":"By perfectly concentrated Meditation on the sun comes a knowledge of the worlds.","vv":"By making Samyama on the sun, (comes) the knowledge of the world.","concepts":["samyama"]},{"id":"3.27","pada":3,"n":27,"group":29,"iast":"candre tārāvyūhajñānam","deva":"चन्द्रे ताराव्यूहज्ञानम्","en":"[As a result of constraint] upon the moon [there arises the intuitive] knowledge of the arrangement of the stars.","jn":"By perfectly concentrated Meditation on the moon comes a knowledge of the lunar mansions.","vv":"On the moon, (comes) the knowledge of the cluster of stars.","concepts":[]},{"id":"3.28","pada":3,"n":28,"group":29,"iast":"dhruve tadgatijñānam","deva":"ध्रुवे तद्गतिज्ञानम्","en":"[As a result of constraint] upon the pole-star [there arises the intuitive] knowledge of their movements.","jn":"By perfectly concentrated Meditation on the fixed pole-star comes a knowledge of the motions of the stars.","vv":"On the pole-star, (comes) the knowledge of the motions of the stars.","concepts":[]},{"id":"3.29","pada":3,"n":29,"group":29,"iast":"nābhicakre kāyavyūhajñānam","deva":"नाभिचक्रे कायव्यूहज्ञानम्","en":"[As a result of constraint] upon the wheel of the navel [there arises the intuitive] knowledge of the arrangement of the body.","jn":"Perfectly concentrated Meditation on the centre of force in the lower trunk brings an understanding of the order of the bodily powers.","vv":"On the navel circle, (comes) the knowledge of the constitution of the body.","concepts":[]},{"id":"3.30","pada":3,"n":30,"group":29,"iast":"kaṇṭhakūpe kṣutpipāsānivṛttiḥ","deva":"कण्ठकूपे क्षुत्पिपासानिवृत्तिः","en":"[As a result of constraint] upon the well of the throat [there follows] the cessation of hunger and thirst.","jn":"By perfectly concentrated Meditation on the centre of force in the well of the throat, there comes the cessation of hunger and thirst.","vv":"On the hollow of the throat, (comes) cessation of hunger.","concepts":[]},{"id":"3.31","pada":3,"n":31,"group":29,"iast":"kūrmanāḍyāṃ sthairyam","deva":"कूर्मनाड्यां स्थैर्यम्","en":"[As a result of constraint] upon the tortoise-tube [there follows] motionlessness of the mind-stuff.","jn":"By perfectly concentrated Meditation on the centre of force in the channel called the “tortoise-formed,” comes steadfastness.","vv":"On the nerve called Kurma, (comes) fixity of the body.","concepts":[]},{"id":"3.32","pada":3,"n":32,"group":29,"iast":"mūrdhajyotiṣi siddhadarśanam","deva":"मूर्धज्योतिषि सिद्धदर्शनम्","en":"[As a result of constraint] upon the radiance in the head [there follows] the sight of the Siddhas.","jn":"Through perfectly concentrated Meditation on the light in the head comes the vision of the Masters who have attained.","vv":"On the light emanating from the top of the head, sight of the Siddhas.","concepts":[]},{"id":"3.33","pada":3,"n":33,"group":29,"iast":"prātibhād vā sarvam","deva":"प्रातिभाद्वा सर्वम्","en":"Or as a result of vividness the yogin discerns all.","jn":"Or through the divining power of tuition he knows all things.","vv":"Or by the power of Prâtibha, all knowledge.","concepts":[]},{"id":"3.34","pada":3,"n":34,"group":29,"iast":"hṛdaye cittasaṃvit","deva":"हृदये चित्तसंवित्","en":"[As a result of constraint] upon the heart [there arises] a consciousness of the mind-stuff.","jn":"By perfectly concentrated Meditation on the heart, the interior being, comes the knowledge of consciousness.","vv":"In the heart, knowledge of minds.","concepts":["citta"]},{"id":"3.35","pada":3,"n":35,"group":29,"iast":"sattvapuruṣayor atyantāsaṃkīrṇayoḥ pratyayāviśeṣo bhogaḥ parārthāt svārthasaṃyamāt puruṣajñānam","deva":"सत्त्वपुरुषयोरत्यन्तासंकीर्णयोः प्रत्ययाविशेषो भोगः परार्थात्स्वार्थसंयमात्पुरुषज्ञानम्","en":"Experience is a presented-idea which fails to distinguish the sattva and the Self, which are absolutely uncommingled [in the presented-idea]. Since the sattva exists as object for another, the [intuitive] knowledge of the Self arises as the result of constraint upon that which exists for its own sake.","jn":"The personal self seeks to feast on life, through a failure to perceive the distinction between the personal self and the spiritual man. All personal experience really exists for the sake of another: namely, the spiritual man. By perfectly concentrated Meditation on experience for the sake of the Self, comes a knowledge of the spiritual man.","vv":"Enjoyment comes from the non-discrimination of the soul and Sattva which are totally different because the latter's actions are for another. Samyama on the self-centred one gives knowledge of the Purusha.","concepts":["purusa","pratyaya","samyama"]},{"id":"3.36","pada":3,"n":36,"group":29,"iast":"tataḥ prātibhaśrāvaṇavedanādarśāsvādavārtā jāyante","deva":"ततः प्रातिभश्रावणवेदनादर्शास्वादवार्ता जायन्ते","en":"As a result of this [constraint upon that which exists for its own sake], there arise vividness and the organ-of-[supernal]-hearing and the organ-of-[supernal]-touch and the organ-of-[supernal]-sight and the organ-of-[supernal]-taste and the organ-of-[supernal]-smell.","jn":"Thereupon are born the divine power of intuition, and the hearing, the touch, the vision, the taste and the power of smell of the spiritual man.","vv":"From that arises the knowledge belonging to Pratibha and (supernatural) hearing, touching, seeing, tasting and smelling.","concepts":[]},{"id":"3.37","pada":3,"n":37,"group":29,"iast":"te samādhāv upasargā vyutthāne siddhayaḥ","deva":"ते समाधावुपसर्गा व्युत्थाने सिद्धयः","en":"In concentration these [supernal activities] are obstacles; in the emergent state they are perfections (siddhi).","jn":"These powers stand in contradistinction to the highest spiritual vision. In manifestation they are called magical powers.","vv":"These are obstacles to Samadhi; but they are powers in the worldly state.","concepts":["samadhi","siddhi"]},{"id":"3.38","pada":3,"n":38,"group":29,"iast":"bandhakāraṇaśaithilyāt pracārasaṃvedanāc ca cittasya paraśarīrāveśaḥ","deva":"बन्धकारणशैथिल्यात्प्रचारसंवेदनाच्च चित्तस्य परशरीरावेशः","en":"As a result of slackening the causes of bondage and as a result of the knowledge of the procedure [of the mind-stuff], the mind-stuff penetrates into the body of another.","jn":"Through the weakening of the causes of bondage, and by learning the method of sassing, the consciousness is transferred to the other body.","vv":"When the cause of bondage of the Chitta has become loosened, the Yogi, by his knowledge of its channels of activity (the nerves), enters another's body.","concepts":["citta"]},{"id":"3.39","pada":3,"n":39,"group":29,"iast":"udānajayāj jalapaṅkakaṇṭakādiṣv asaṅga utkrāntiś ca","deva":"उदानजयाज्जलपङ्ककण्टकादिष्वसङ्ग उत्क्रान्तिश्च","en":"As a result of mastering the Udāna there is no adhesion to water or mud or thorns or similar objects, and [at death] the upward flight.","jn":"Through mastery of the upward-life comes freedom from the dangers of water, morass, and thorny places, and the power of ascension is gained.","vv":"By conquering the current called Udâna the Yogi does not sink in water or in swamps, he can walk on thorns etc., and can, die at will.","concepts":[]},{"id":"3.40","pada":3,"n":40,"group":29,"iast":"samānajayāj jvalanam","deva":"समानजयाज्ज्वलनम्","en":"As a result of mastering the Samāna [there arises] a radiance.","jn":"By mastery of the binding-life comes radiance.","vv":"By the conquest of the current Samâna he is surrounded by a blaze of light.","concepts":[]},{"id":"3.41","pada":3,"n":41,"group":29,"iast":"śrotrākāśayoḥ saṃbandhasaṃyamād divyaṃ śrotram","deva":"श्रोत्राकाशयोः संबन्धसंयमाद्दिव्यं श्रोत्रम्","en":"As a result of constraint upon the relation between the organ-of-hearing and the air, [there arises] the supernal-organ-of-hearing.","jn":"From perfectly concentrated Meditation on the correlation of hearing and the ether, comes the power of spiritual hearing.","vv":"By making Samyama on the relation between the ear and the Akâsha comes divine hearing.","concepts":["samyama"]},{"id":"3.42","pada":3,"n":42,"group":29,"iast":"kāyākāśayoḥ saṃbandhasaṃyamāl laghutūlasamāpatteś cākāśagamanam","deva":"कायाकाशयोः संबन्धसंयमाल्लघुतूलसमापत्तेश्चाकाशगमनम्","en":"Either as a result of constraint upon the relation between the body and the air, or as a result of the balanced-state of lightness, such as that of cotton-fibre, there follows the passing through air.","jn":"By perfectly concentrated Meditation em the correlation of the body with the ether, and by thinking of it as light as thistle-down, will come the power to traverse the ether.","vv":"By making Samyama on the relation between the Akasha and the body and becoming light as cotton-wool etc., through meditation on them, the yogi goes through the skies.","concepts":["samapatti","samyama"]},{"id":"3.43","pada":3,"n":43,"group":29,"iast":"bahir akalpitā vṛttir mahāvidehā tataḥ prakāśāvaraṇakṣayaḥ","deva":"बहिरकल्पिता वृत्तिर्महाविदेहा ततः प्रकाशावरणक्षयः","en":"An outwardly unadjusted fluctuation is the Great Discarnate; as a result of this the dwindling of the covering to the brightness.","jn":"When that condition of consciousness is reached, which is far-reaching and not confined to the body, which is outside the body and not conditioned by it, then the veil which conceals the light is worn away.","vv":"By making Samyama on the \"real modifications\" of the mind, outside of the body, called great disembodiedness, comes disappearance of the covering to light.","concepts":["vrtti"]},{"id":"3.44","pada":3,"n":44,"group":29,"iast":"sthūlasvarūpasūkṣmānvayārthavattvasaṃyamād bhūtajayaḥ","deva":"स्थूलस्वरूपसूक्ष्मान्वयार्थवत्त्वसंयमाद्भूतजयः","en":"As a result of constraint upon the coarse and the essential-attribute and the subtile and the inherence and purposiveness, there is a mastery of the elements.","jn":"Mastery of the elements comes from perfectly concentrated Meditation on their five forms: the gross, the elemental, the subtle, the inherent, the purposive.","vv":"By making Samyama on the gross and fine forms of the elements, their essential traits, the inherence of the Gunas in them and on their contributing to the experience of the soul, comes mastery of the elements.","concepts":["samyama"]},{"id":"3.45","pada":3,"n":45,"group":29,"iast":"tato 'ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca","deva":"ततो ऽणिमादिप्रादुर्भावः कायसंपत्तद्धर्मानभिघातश्च","en":"As a result of this, atomization and the other [perfections] come about, [there is] perfection of body; and there is no obstruction by the properties of these [elements].","jn":"Thereupon will come the manifestation of the atomic and other powers, which are the endowment of the body, together with its unassailable force.","vv":"From that comes minuteness and the rest of the powers, \"glorification of the body,\" and indestructibleness of the bodily qualities.","concepts":[]},{"id":"3.46","pada":3,"n":46,"group":29,"iast":"rūpalāvaṇyabalavajrasaṃhananatvāni kāyasaṃpat","deva":"रूपलावण्यबलवज्रसंहननत्वानि कायसंपत्","en":"Beauty and grace and power and compactness of the thunderbolt, — [this is] perfection of body.","jn":"Shapeliness, beauty, force, the temper of the diamond: these are the endowments of that body.","vv":"The \"glorification of the body\" is beauty, complexion, strength, adamantine hardness.","concepts":[]},{"id":"3.47","pada":3,"n":47,"group":29,"iast":"grahaṇasvarūpāsmitānvayārthavattvasaṃyamād indriyajayaḥ","deva":"ग्रहणस्वरूपास्मितान्वयार्थवत्त्वसंयमादिन्द्रियजयः","en":"As a result of constraint upon the process-of-knowing and the essential-attribute and the feeling-of-personality and the inherence and the purposiveness, [there follows] the subjugation of the organs.","jn":"Mastery over the powers of perception and action comes through perfectly concentrated Meditation on their fivefold forms; namely, their power to grasp their distinctive nature, the element of self-consciousness in them, their inherence, and their purposiveness.","vv":"By making Samyama on the objectivity and power of illumination of the organs, on egoism, the inherence of the Gunas in them and on their contributing to the experience of the soul, comes the conquest of the organs.","concepts":["asmita","samyama"]},{"id":"3.48","pada":3,"n":48,"group":29,"iast":"tato manojavitvaṃ vikaraṇabhāvaḥ pradhānajayaś ca","deva":"ततो मनोजवित्वं विकरणभावः प्रधानजयश्च","en":"As a result of this [there follows] speed [great as that] of the central-organ, action of the instruments [of knowledge] disjunct [from the body], and the subjugation of the primary-cause.","jn":"Thence comes the power swift as thought, independent of instruments, and the mastery over matter.","vv":"From that comes to the body the power of rapid movement like the mind, power of the organs independently of the body, and conquest of nature.","concepts":["manas"]},{"id":"3.49","pada":3,"n":49,"group":29,"iast":"sattvapuruṣānyatākhyātimātrasya sarvabhāvādhiṣṭhātṛtvaṃ sarvajñātṛtvaṃ ca","deva":"सत्त्वपुरुषान्यताख्यातिमात्रस्य सर्वभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च","en":"He who has only the full discernment into the difference between the sattva and the Self is one who has authority over all states-of-existence and is one who knows all.","jn":"When the spiritual man is perfectly disentangled from the psychic body, he attains to mastery over all things and to a knowledge of all.","vv":"By making Samyama on the discrimination between the Sattva and the Purusha come omnipotence and omniscience.","concepts":["purusa"]},{"id":"3.50","pada":3,"n":50,"group":29,"iast":"tadvairāgyād api doṣabījakṣaye kaivalyam","deva":"तद्वैराग्यादपि दोषबीजक्षये कैवल्यम्","en":"As a result of passionlessness even with regard to these [perfections] there follows, after the dwindling of the seeds of the defects, Isolation.","jn":"By absence of all self-indulgence at this point, when the seeds of bondage to sorrow are destroyed, pure spiritual being is attained.","vv":"By giving up even these powers comes the destruction of the very seed of evil, which leads to Kaivalya.","concepts":["vairagya","bija","kaivalya"]},{"id":"3.51","pada":3,"n":51,"group":29,"iast":"sthānyupanimantraṇe saṅgasmayākaraṇaṃ punar aniṣṭaprasaṅgāt","deva":"स्थान्युपनिमन्त्रणे सङ्गस्मयाकरणं पुनरनिष्टप्रसङ्गात्","en":"In case of invitations from those-in-high-places, these should arouse no attachment or pride, for undesired consequences recur.","jn":"There should be complete overcoming of allurement or pride in the invitations of the different realms of life, lest attachment to things evil arise once more.","vv":"The Yogi should not feel allured or flattered by the overtures of celestial beings for fear of evil again.","concepts":[]},{"id":"3.52","pada":3,"n":52,"group":29,"iast":"kṣaṇatatkramayoḥ saṃyamād vivekajaṃ jñānam","deva":"क्षणतत्क्रमयोः संयमाद्विवेकजं ज्ञानम्","en":"As a result of constraint upon moments and their sequence [there arises the intuitive] knowledge proceeding from discrimination.","jn":"From perfectly concentrated Meditation on the divisions of time and their succession comes that wisdom which is born of discernment.","vv":"By making Samyama on a particle of time and its precession and succession comes discrimination.","concepts":["viveka","samyama"]},{"id":"3.53","pada":3,"n":53,"group":30,"iast":"jātilakṣaṇadeśair anyatānavacchedāt tulyayos tataḥ pratipattiḥ","deva":"जातिलक्षणदेशैरन्यतानवच्छेदात्तुल्ययोस्ततः प्रतिपत्तिः","en":"As a result of this there arises the deeper-knowledge of two equivalent things which cannot be distinctly qualified in species or characteristic-mark or point-of-space.","jn":"Hence comes discernment between things which are of like nature, not distinguished by difference of kind, character or position.","vv":"Those things which cannot be differentiated by species, sign, and place, even they will be discriminated by the above Samyama.","concepts":[]},{"id":"3.54","pada":3,"n":54,"group":30,"iast":"tārakaṃ sarvaviṣayaṃ sarvathāviṣayam akramaṃ ceti vivekajaṃ jñānam","deva":"तारकं सर्वविषयं सर्वथाविषयमक्रमं चेति विवेकजं ज्ञानम्","en":"The [intuitive] knowledge proceeding from discrimination is a deliverer, has all things as its object, and has all times for its object, and is an [inclusive whole] without sequence.","jn":"The wisdom which is born of discernment is starlike; it discerns all things, and all conditions of things, it discerns without succession: simultaneously.","vv":"The saving knowledge is that knowledge of discrimination which simultaneously covers all objects, in all their variations.","concepts":["viveka"]},{"id":"3.55","pada":3,"n":55,"group":30,"iast":"sattvapuruṣayoḥ śuddhisāmye kaivalyam iti","deva":"सत्त्वपुरुषयोः शुद्धिसाम्ये कैवल्यमिति","en":"When the purity of the sattva and of the Self are equal there is Isolation.","jn":"When the vesture and the spiritual man are alike pure, then perfect spiritual life is attained.","vv":"By the similarity of purity between the Sattva and the Purusha comes Kaivalya.","concepts":["purusa","kaivalya"]},{"id":"4.1","pada":4,"n":1,"group":31,"iast":"janmauṣadhimantratapaḥsamādhijāḥ siddhayaḥ","deva":"जन्मौषधिमन्त्रतपःसमाधिजाः सिद्धयः","en":"Perfections proceed from birth or from drugs or from spells or from self-castigation or from concentration.","jn":"Psychic and spiritual powers may be inborn, or they may be gained by the use of drugs, or by incantations, or by fervour, or by Meditation.","vv":"The Siddhis (powers) are attained by birth, chemical means, power of words, mortification, or concentration.","concepts":["samadhi","siddhi","tapas"]},{"id":"4.2","pada":4,"n":2,"group":31,"iast":"jātyantarapariṇāmaḥ prakṛtyāpūrāt","deva":"जात्यन्तरपरिणामः प्रकृत्यापूरात्","en":"The mutation into another birth is the result of the filling in of the evolving-cause.","jn":"The transfer of powers from one venture to another comes through the flow of the natural creative forces.","vv":"The change into another species is by the filling in of nature.","concepts":["prakrti","parinama"]},{"id":"4.3","pada":4,"n":3,"group":31,"iast":"nimittam aprayojakaṃ prakṛtīnāṃ varaṇabhedas tu tataḥ kṣetrikavat","deva":"निमित्तमप्रयोजकं प्रकृतीनां वरणभेदस्तु ततः क्षेत्रिकवत्","en":"The efficient cause gives no impulse to the evolving-causes but [the mutation] follows when the barrier [to the evolving-cause] is cut, as happens with the peasant.","jn":"The apparent, immediate cause is not the true cause of the creative nature-powers; but, like the husbandman in his field, it takes obstacles away.","vv":"Good and bad deeds are not the direct causes in the transformations of nature, but they act as breakers of obstacles to the evolutions of nature: as a farmer breaks the obstacles to the course of water, which then runs down by its own nature.","concepts":["prakrti"]},{"id":"4.4","pada":4,"n":4,"group":31,"iast":"nirmāṇacittāny asmitāmātrāt","deva":"निर्माणचित्तान्यस्मितामात्रात्","en":"Created mind-stuffs may result from the sense-of-personality and from this alone.","jn":"Vestures of consciousness are built up in conformity with the Boston of the feeling of selfhood.","vv":"From egoism alone proceed the created minds.","jnote":"Gutenberg prints “the Boston of the feeling of selfhood”, which looks like a transcription error. Not yet checked against the 1912 printing.","concepts":["citta","asmita"]},{"id":"4.5","pada":4,"n":5,"group":31,"iast":"pravṛttibhede prayojakaṃ cittam ekam anekeṣām","deva":"प्रवृत्तिभेदे प्रयोजकं चित्तमेकमनेकेषाम्","en":"While there is a variety of actions, the mind-stuff which impels the many is one.","jn":"In the different fields of manifestation, the Consciousness, though one, is the elective cause of many states of consciousness.","vv":"Though the activities of the different created minds are various, the one original mind is the controller of them all.","concepts":["citta"]},{"id":"4.6","pada":4,"n":6,"group":31,"iast":"tatra dhyānajam anāśayam","deva":"तत्र ध्यानजमनाशयम्","en":"Of these [five perfections] that which proceeds from contemplation leaves no latent-deposit.","jn":"Among states of consciousness, that which is born of Contemplation is free from the seed of future sorrow.","vv":"Among the various Chittas, that which is attained by Samadhi is desireless.","concepts":["dhyana"]},{"id":"4.7","pada":4,"n":7,"group":31,"iast":"karmāśuklākṛṣṇaṃ yoginas trividham itareṣām","deva":"कर्माशुक्लाकृष्णं योगिनस्त्रिविधमितरेषाम्","en":"The yogin's karma is neither-white-nor-black; [the karma] of others is of three kinds.","jn":"The works of followers after Union make neither for bright pleasure nor for dark pain The works of others make for pleasure or pain, or a mingling of these.","vv":"Works are neither black nor white for the Yogis; for others they are threefold — black, white, and mixed.","concepts":["karma"]},{"id":"4.8","pada":4,"n":8,"group":31,"iast":"tatas tadvipākānuguṇānām evābhivyaktir vāsanānām","deva":"ततस्तद्विपाकानुगुणानामेवाभिव्यक्तिर्वासनानाम्","en":"As a result of this there follows the manifestation of those subconscious-impressions only which correspond to the fruition of their [karma].","jn":"From the force inherent in works comes the manifestation of those dynamic mind images which are conformable to the ripening out of each of these works.","vv":"From these threefold works are manifested in each state only those desires (which are) fitting to that state alone. (The others are held in abeyance for the time being.)","concepts":["vasana","guna"]},{"id":"4.9","pada":4,"n":9,"group":31,"iast":"jātideśakālavyavahitānām apy ānantaryaṃ smṛtisaṃskārayor ekarūpatvāt","deva":"जातिदेशकालव्यवहितानामप्यानन्तर्यं स्मृतिसंस्कारयोरेकरूपत्वात्","en":"There is an uninterrupted-causal-relation [of subconscious-impressions], although remote in species and point-of-space and moment-of-time, by reason of the correspondence between memory and subliminal-impressions.","jn":"Works separated by different nature, or place, or time, are brought together by the correspondence between memory and dynamic impression.","vv":"There is consecutiveness in desires, even though separated by species, space, and time, there being identification of memory and impressions.","concepts":["samskara","smrti"]},{"id":"4.10","pada":4,"n":10,"group":31,"iast":"tāsām anāditvaṃ cāśiṣo nityatvāt","deva":"तासामनादित्वं चाशिषो नित्यत्वात्","en":"Furthermore the [subconscious-impressions] have no beginning [that we can set in time], since desire is permanent.","jn":"The series of dynamic mind-images is beginningless, because Desire is everlasting.","vv":"Thirst for happiness being eternal, desires are without beginning.","concepts":[]},{"id":"4.11","pada":4,"n":11,"group":31,"iast":"hetuphalāśrayālambanaiḥ saṃgṛhītatvād eṣām abhāve tadabhāvaḥ","deva":"हेतुफलाश्रयालम्बनैः संगृहीतत्वादेषामभावे तदभावः","en":"Since [subconscious-impressions] are associated with cause and motive and mental-substrate and stimulus, if these cease to be, then those [subconscious-impressions] cease to be.","jn":"Since the dynamic mind-images are held together by impulses of desire, by the wish for personal reward, by the substratum of mental habit, by the support of outer things desired; therefore, when these cease, the self reproduction of dynamic mind-images ceases.","vv":"Being held together by cause, effect, support, and objects, in the absence of these is its absence.","concepts":[]},{"id":"4.12","pada":4,"n":12,"group":31,"iast":"atītānāgataṃ svarūpato 'sty adhvabhedād dharmāṇām","deva":"अतीतानागतं स्वरूपतो ऽस्त्यध्वभेदाद्धर्माणाम्","en":"Past and future as such exist; [therefore subconscious-impressions do not cease to be]. For the different time-forms belong to the external-aspects.","jn":"The difference between that which is past and that which is not yet come, according to their natures, depends on the difference of phase of their properties.","vv":"The past and future exist in their own nature, qualities having different ways.","concepts":[]},{"id":"4.13","pada":4,"n":13,"group":31,"iast":"te vyaktasūkṣmā guṇātmānaḥ","deva":"ते व्यक्तसूक्ष्मा गुणात्मानः","en":"These [external-aspects with the three time-forms] are phenomenalized [individuals] or subtile [generic-forms] and their essence is the aspects (guṇa).","jn":"These properties, whether manifest or latent, are of the nature of the Three Potencies.","vv":"They are manifested or fine, being of the nature of the Gunas.","concepts":["guna"]},{"id":"4.14","pada":4,"n":14,"group":32,"iast":"pariṇāmaikatvād vastutattvam","deva":"परिणामैकत्वाद्वस्तुतत्त्वम्","en":"The that-ness of a thing is due to a singleness of mutation.","jn":"The external manifestation of an object takes place when the transformations ore in the same phase.","vv":"The unity in things is from the unity in changes.","concepts":["parinama"]},{"id":"4.15","pada":4,"n":15,"group":32,"iast":"vastusāmye cittabhedāt tayor vibhaktaḥ panthāḥ","deva":"वस्तुसाम्ये चित्तभेदात्तयोर्विभक्तः पन्थाः","en":"Because, while the [physical] thing remains the same, the mind-stuffs are different, [therefore the two are upon] distinct levels-of-existence.","jn":"The paths of material things and of states of consciousness are distinct, as is manifest from the fact that the same object may produce different impressions in different minds.","vv":"Since perception and desire vary with regard to the same object, mind and object are of different nature.","concepts":["citta"]},{"id":"4.16","pada":4,"n":16,"group":32,"iast":"na caikacittatantraṃ vastu tadapramāṇakaṃ tadā kiṃ syāt","deva":"न चैकचित्ततन्त्रं वस्तु तदप्रमाणकं तदा किं स्यात्","en":"And a thing is not dependent upon a single mind-stuff, [for then in certain cases] it could not be proved [by that mind-stuff], [and] then what would it be?","jn":"Nor do material objects depend upon a single mind, for how could they remain objective to others, if that mind ceased to think of them?","concepts":["citta"]},{"id":"4.17","pada":4,"n":17,"group":32,"iast":"taduparāgāpekṣitvāc cittasya vastu jñātājñātam","deva":"तदुपरागापेक्षित्वाच्चित्तस्य वस्तु ज्ञाताज्ञातम्","en":"A thing is known or not known by virtue of its affecting [or not affecting] the mind-stuff.","jn":"An object is perceived, or not perceived, according as the mind is, or is not, tinged with the colour of the object.","vv":"Things are known or unknown to the mind, being dependent on the colouring which they give to the mind.","concepts":["citta"]},{"id":"4.18","pada":4,"n":18,"group":32,"iast":"sadā jñātāś cittavṛttayas tatprabhoḥ puruṣasyāpariṇāmitvāt","deva":"सदा ज्ञाताश्चित्तवृत्तयस्तत्प्रभोः पुरुषस्यापरिणामित्वात्","en":"Unintermittently the Master of that [mind-stuff] knows the fluctuations of mind-stuff [and thus] the Self undergoes-no-mutations.","jn":"The movements of the psychic nature are perpetually objects of perception, since the Spiritual Man, who is the lord of them, remains unchanging.","vv":"The states of the mind are always known, because the lord of the mind, the Purusha, is unchangeable.","concepts":["citta","vrtti","purusa","parinama"]},{"id":"4.19","pada":4,"n":19,"group":32,"iast":"na tat svābhāsaṃ dṛśyatvāt","deva":"न तत्स्वाभासं दृश्यत्वात्","en":"It does not illumine itself, since it is an object-for-sight.","jn":"The Mind is not self-luminous, since it can be seen as an object.","vv":"The mind is not self-luminous, being an object.","concepts":["drsya"]},{"id":"4.20","pada":4,"n":20,"group":32,"iast":"ekasamaye cobhayānavadhāraṇam","deva":"एकसमये चोभयानवधारणम्","en":"And there cannot be a cognition of both [thinking-substance and thing] at the same time.","jn":"Nor could the Mind at the same time know itself and things external to it.","vv":"From its being unable to cognise both at the same time.","concepts":[]},{"id":"4.21","pada":4,"n":21,"group":32,"iast":"cittāntaradṛśye buddhibuddher atiprasaṅgaḥ smṛtisaṃkaraś ca","deva":"चित्तान्तरदृश्ये बुद्धिबुद्धेरतिप्रसङ्गः स्मृतिसंकरश्च","en":"If [one mind-stuff] were the object-for-sight for another, there would be an infinite regress from one thinking-substance to another thinking-substance as well as confusion of memory.","jn":"If the Mind be thought of as seen by another more inward Mind, then there would be an endless series of perceiving Minds, and a confusion of memories.","vv":"Another cognising mind being assumed, there will be no end to such assumptions, and confusion of memory will be the result.","concepts":["citta","drsya","smrti"]},{"id":"4.22","pada":4,"n":22,"group":32,"iast":"citer apratisaṃkramāyās tadākārāpattau svabuddhisaṃvedanam","deva":"चितेरप्रतिसंक्रमायास्तदाकारापत्तौ स्वबुद्धिसंवेदनम्","en":"The Intellect (citi) which unites not [with objects] is conscious of its own thinking-substance when [the mind-stuff] takes the form of that [thinking-substance by reflecting it].","jn":"When the psychical nature takes on the form of the spiritual intelligence, by reflecting it, then the Self becomes conscious of its own spiritual intelligence.","vv":"The essence of knowledge (the Purusha) being unchangeable, when the mind takes its form, it becomes conscious.","concepts":[]},{"id":"4.23","pada":4,"n":23,"group":32,"iast":"draṣṭṛdṛśyoparaktaṃ cittaṃ sarvārtham","deva":"द्रष्टृदृश्योपरक्तं चित्तं सर्वार्थम्","en":"Mind-stuff affected by the Seer and by the object-for-sight [leads to the perception of] all intended-objects.","jn":"The psychic nature, taking on the colour of the Seer and of things seen, leads to the perception of all objects.","vv":"Coloured by the seer and the seen the mind is able to understand everything.","concepts":["citta","drastr","drsya"]},{"id":"4.24","pada":4,"n":24,"group":33,"iast":"tad asaṃkhyeyavāsanābhiś citram api parārthaṃ saṃhatyakāritvāt","deva":"तदसंख्येयवासनाभिश्चित्रमपि परार्थं संहत्यकारित्वात्","en":"This [mind-stuff], although diversified by countless subconscious-impressions, exists for the sake of another, because its nature is to produce [things as] combinations.","jn":"The psychic nature, which has been printed with mind-images of innumerable material things, exists now for the Spiritual Man, building for him.","vv":"The mind, though variegated by innumerable desires, acts for another (the Purusha), because it acts in combination.","concepts":["vasana"]},{"id":"4.25","pada":4,"n":25,"group":33,"iast":"viśeṣadarśina ātmabhāvabhāvanānivṛttiḥ","deva":"विशेषदर्शिन आत्मभावभावनानिवृत्तिः","en":"For him who sees the distinction, pondering upon his own states-of-being ceases.","jn":"For him who discerns between the Mind and the Spiritual Man, there comes perfect fruition of the longing after the real being of the Self.","vv":"For the discriminating, the perception of the mind as Atman ceases.","concepts":[]},{"id":"4.26","pada":4,"n":26,"group":33,"iast":"tadā vivekanimnaṃ kaivalyaprāgbhāraṃ cittam","deva":"तदा विवेकनिम्नं कैवल्यप्राग्भारं चित्तम्","en":"Then the mind-stuff is borne down to discrimination, onward towards Isolation.","jn":"Thereafter, the whole personal being bends toward illumination, toward Eternal Life.","vv":"Then, bent on discriminating, the mind attains the previous state of Kaivalya (isolation). (There is another reading — कैवल्यप्राग्भारं।  The meaning then would be: \"Then the mind becomes deep in discrimination and gravitates towards Kaivalya.\" — Ed.)","concepts":["citta","viveka","kaivalya"]},{"id":"4.27","pada":4,"n":27,"group":33,"iast":"tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ","deva":"तच्छिद्रेषु प्रत्ययान्तराणि संस्कारेभ्यः","en":"In the intervals of this [mind-stuff] there are other presented-ideas [coming] from subliminal-impressions.","jn":"In the internals of the batik, other thoughts will arise, through the impressions of the dynamic mind-images.","vv":"The thoughts that arise as obstructions to that are from impressions.","concepts":["samskara","pratyaya"]},{"id":"4.28","pada":4,"n":28,"group":33,"iast":"hānam eṣāṃ kleśavad uktam","deva":"हानमेषां क्लेशवदुक्तम्","en":"The escape from these [subliminal-impressions] is described as being like [the escape from] the hindrances.","jn":"These are to be overcome as it was taught that hindrances should be overcome.","vv":"Their destruction is in the same manner as of ignorance, egoism, etc., as said before (II. 10).","concepts":["klesa"]},{"id":"4.29","pada":4,"n":29,"group":33,"iast":"prasaṃkhyāne 'py akusīdasya sarvathā vivekakhyāter dharmameghaḥ samādhiḥ","deva":"प्रसंख्याने ऽप्यकुसीदस्य सर्वथा विवेकख्यातेर्धर्ममेघः समाधिः","en":"For one who is not usurious even in respect of Elevation, there follows in every case as a result of discriminative discernment the concentration [called] Rain-cloud of [knowable] things.","jn":"He who, after he has attained, is wholly free from self, reaches the essence of all that can be known, gathered together like a cloud. This is the true spiritual consciousness.","vv":"Even when arriving at the right discriminating knowledge of the essences, he who gives up the fruits, unto him comes, as the result of perfect domination, the Samadhi called the cloud of virtue.","concepts":["viveka","samadhi"]},{"id":"4.30","pada":4,"n":30,"group":33,"iast":"tataḥ kleśakarmanivṛttiḥ","deva":"ततः क्लेशकर्मनिवृत्तिः","en":"Then follows the cessation of the hindrances and of karma.","jn":"Thereon comes surcease from sorrow and the burden of toil.","vv":"From that comes cessation of pain and works.","concepts":["klesa","karma"]},{"id":"4.31","pada":4,"n":31,"group":33,"iast":"tadā sarvāvaraṇamalāpetasya jñānasyānantyāj jñeyam alpam","deva":"तदा सर्वावरणमलापेतस्य ज्ञानस्यानन्त्याज्ज्ञेयमल्पम्","en":"Then, because of the endlessness of knowledge from which all obscuring defilements have passed away, what is yet to be known amounts to little.","jn":"When all veils are rent, all stains washed away, his knowledge becomes infinite; little remains for him to know.","vv":"The knowledge, bereft of covering and impurities, becoming infinite, the knowable becomes small.","concepts":[]},{"id":"4.32","pada":4,"n":32,"group":33,"iast":"tataḥ kṛtārthānāṃ pariṇāmakramasamāptir guṇānām","deva":"ततः कृतार्थानां परिणामक्रमसमाप्तिर्गुणानाम्","en":"When as a result of this the aspects (guṇa) have fulfilled their purpose, they attain to the limit of the sequence of mutations.","jn":"Thereafter comes the completion of the series of transformations of the three nature potencies, since their purpose is attained.","vv":"Then are finished the successive transformations of the qualities, they having attained the end.","concepts":["guna","parinama"]},{"id":"4.33","pada":4,"n":33,"group":33,"iast":"kṣaṇapratiyogī pariṇāmāparāntanirgrāhyaḥ kramaḥ","deva":"क्षणप्रतियोगी परिणामापरान्तनिर्ग्राह्यः क्रमः","en":"The positive correlate to the moment, recognized as such at the final limit of the mutation, is a sequence.","jn":"The series of transformations is divided into moments. When the series is completed, time gives place to duration.","vv":"The changes that exist in relation to moments and which are perceived at the other end (at the end of a series) are succession.","concepts":["parinama"]},{"id":"4.34","pada":4,"n":34,"group":33,"iast":"puruṣārthaśūnyānāṃ guṇānāṃ pratiprasavaḥ kaivalyaṃ svarūpapratiṣṭhā vā citiśaktir iti","deva":"पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः कैवल्यं स्वरूपप्रतिष्ठा वा चितिशक्तिरिति","en":"Isolation is the inverse generation of the aspects, no longer provided with a purpose by the Self, or it is the Energy of Intellect grounded in itself.","jn":"Pure spiritual life is, therefore, the inverse resolution of the potencies of Nature, which have emptied themselves of their value for the Spiritual man; or it is the return of the power of pure Consciousness to its essential form.","vv":"The resolution in the inverse order of the qualities, bereft of any motive of action for the Purusha, is Kaivalya, or it is the establishment of the power of knowledge in its own nature.","concepts":["purusa","guna","kaivalya"]}],"concepts":[{"id":"citta","iast":"citta","deva":"चित्त","en":"mind","woods":"mind-stuff","kind":"mind","pattern":"citt","gloss":"The field of awareness that takes the shape of whatever it attends to; what yoga sets out to still.","sutras":["1.2","1.30","1.33","1.37","2.54","3.1","3.9","3.11","3.12","3.19","3.34","3.38","4.4","4.5","4.15","4.16","4.17","4.18","4.21","4.23","4.26"]},{"id":"vrtti","iast":"vṛtti","deva":"वृत्ति","en":"fluctuation","woods":"fluctuation","kind":"mind","pattern":"(?<!pra)(?<!ni)vṛtt(i|ay|er)","gloss":"A movement or modification of the mind. The text names five kinds.","sutras":["1.2","1.4","1.5","1.10","1.41","2.11","2.15","2.50","3.43","4.18"]},{"id":"nirodha","iast":"nirodha","deva":"निरोध","en":"stilling","woods":"restriction","kind":"practice","pattern":"nirodh","gloss":"The restraint or settling of the mind's fluctuations; the text's own definition of yoga (1.2).","sutras":["1.2","1.12","1.51","3.9"]},{"id":"abhyasa","iast":"abhyāsa","deva":"अभ्यास","en":"practice","woods":"practice","kind":"practice","pattern":"bhyās","gloss":"Sustained, repeated effort toward steadiness; one of the two means paired in 1.12.","sutras":["1.12","1.13","1.18","1.32"]},{"id":"vairagya","iast":"vairāgya","deva":"वैराग्य","en":"non-attachment","woods":"passionlessness","kind":"practice","pattern":"vairāgy","gloss":"Freedom from craving for what is seen or heard of; the partner of practice.","sutras":["1.12","1.15","3.50"]},{"id":"isvara","iast":"īśvara","deva":"ईश्वर","en":"the Lord","woods":"Içvara","kind":"being","pattern":"[īe]śvar","gloss":"A special Self untouched by hindrance or karma; devotion to it is one path to concentration.","sutras":["1.23","1.24","2.1","2.32","2.45"]},{"id":"pranava","iast":"praṇava","deva":"प्रणव","en":"Om","woods":"Mystic-syllable","kind":"being","pattern":"praṇav","gloss":"The sacred syllable that expresses Īśvara (1.27).","sutras":["1.27"]},{"id":"klesa","iast":"kleśa","deva":"क्लेश","en":"affliction","woods":"hindrance","kind":"affliction","pattern":"kleś","gloss":"The five root troubles of the mind, listed in 2.3.","sutras":["1.24","2.2","2.3","2.12","4.28","4.30"]},{"id":"avidya","iast":"avidyā","deva":"अविद्या","en":"ignorance","woods":"undifferentiated-consciousness","kind":"affliction","pattern":"avidy","gloss":"Taking the impermanent, impure, painful and not-self for their opposites (2.5); the root of the other afflictions.","sutras":["2.3","2.4","2.5","2.24"]},{"id":"asmita","iast":"asmitā","deva":"अस्मिता","en":"I-am-ness","woods":"feeling-of-personality","kind":"affliction","pattern":"smit","gloss":"Mistaking the power of seeing for the instrument of seeing as one self (2.6).","sutras":["1.17","2.3","2.6","3.47","4.4"]},{"id":"duhkha","iast":"duḥkha","deva":"दुःख","en":"suffering","woods":"pain","kind":"affliction","pattern":"duḥkh","gloss":"Pain and dissatisfaction. Future suffering is what yoga sets out to avoid (2.16).","sutras":["1.31","1.33","2.5","2.8","2.15","2.16","2.34"]},{"id":"karma","iast":"karma","deva":"कर्म","en":"action","woods":"karma","kind":"cause","pattern":"karm","gloss":"Action and the residue it leaves, ripening as birth, lifespan and experience.","sutras":["1.24","2.12","3.22","4.7","4.30"]},{"id":"samskara","iast":"saṃskāra","deva":"संस्कार","en":"impression","woods":"subliminal-impression","kind":"cause","pattern":"saṃskār","gloss":"A latent trace left in the mind by experience, which shapes later activity.","sutras":["1.18","1.50","2.15","3.9","3.10","3.18","4.9","4.27"]},{"id":"vasana","iast":"vāsanā","deva":"वासना","en":"latent tendency","woods":"subconscious-impression","kind":"cause","pattern":"vāsan","gloss":"A stored tendency waiting for the conditions that will express it.","sutras":["4.8","4.24"]},{"id":"purusa","iast":"puruṣa","deva":"पुरुष","en":"the Self","woods":"Self","kind":"being","pattern":"puruṣ","gloss":"Pure consciousness, the witness, distinct from everything it sees.","sutras":["1.16","1.24","3.35","3.49","3.55","4.18","4.34"]},{"id":"drastr","iast":"draṣṭṛ","deva":"द्रष्टृ","en":"the Seer","woods":"Seer","kind":"being","pattern":"draṣṭ","gloss":"The one who sees; another name for puruṣa.","sutras":["1.3","2.17","2.20","4.23"]},{"id":"drsya","iast":"dṛśya","deva":"दृश्य","en":"the seen","woods":"object-of-sight","kind":"matter","pattern":"dṛśy","gloss":"Everything that can be an object of awareness, made of the three guṇas.","sutras":["2.17","2.18","2.21","4.19","4.21","4.23"]},{"id":"guna","iast":"guṇa","deva":"गुण","en":"quality","woods":"aspect","kind":"matter","pattern":"(?<!anu)guṇ","gloss":"The three strands of nature: brightness, activity and inertia.","sutras":["1.16","2.15","2.19","4.8","4.13","4.32","4.34"]},{"id":"prakrti","iast":"prakṛti","deva":"प्रकृति","en":"nature","woods":"primary-matter","kind":"matter","pattern":"prakṛt","gloss":"Primary matter, the source from which the seen world evolves.","sutras":["1.19","4.2","4.3"]},{"id":"pratyaya","iast":"pratyaya","deva":"प्रत्यय","en":"presented idea","woods":"presented-idea","kind":"mind","pattern":"pratyay","gloss":"The content held in the mind at a given moment.","sutras":["1.10","1.18","1.19","2.20","3.2","3.12","3.17","3.19","3.35","4.27"]},{"id":"smrti","iast":"smṛti","deva":"स्मृति","en":"memory","woods":"memory","kind":"mind","pattern":"smṛt","gloss":"Memory, one of the five fluctuations; also mindfulness in 1.20.","sutras":["1.6","1.11","1.20","1.43","4.9","4.21"]},{"id":"vikalpa","iast":"vikalpa","deva":"विकल्प","en":"conceptualizing","woods":"predicate-relation","kind":"mind","pattern":"vikalp","gloss":"Knowledge carried by words with no real object behind it (1.9).","sutras":["1.6","1.9","1.42"]},{"id":"manas","iast":"manas","deva":"मनस्","en":"mind (organ)","woods":"central-organ","kind":"mind","pattern":"(?<![ru])mana[sḥ]|manoj","gloss":"The mind as the organ that coordinates the senses.","sutras":["1.35","2.53","3.48"]},{"id":"ekagrata","iast":"ekāgratā","deva":"एकाग्रता","en":"one-pointedness","woods":"singleness-of-intent","kind":"practice","pattern":"kāgr","gloss":"The mind resting on a single object.","sutras":["2.41","3.11","3.12"]},{"id":"prajna","iast":"prajñā","deva":"प्रज्ञा","en":"insight","woods":"insight","kind":"attainment","pattern":"prajñ","gloss":"Direct wisdom arising from concentration.","sutras":["1.17","1.20","1.48","1.49","2.27","3.5"]},{"id":"viveka","iast":"viveka","deva":"विवेक","en":"discernment","woods":"discrimination","kind":"attainment","pattern":"vivek","gloss":"Discriminating the seer from the seen; the means of release (2.26).","sutras":["2.15","2.26","2.28","3.52","3.54","4.26","4.29"]},{"id":"samapatti","iast":"samāpatti","deva":"समापत्ति","en":"absorption","woods":"balanced-state","kind":"attainment","pattern":"samāpatt","gloss":"The mind taking on the colour of its object, like a clear jewel (1.41).","sutras":["1.41","1.42","2.47","3.42"]},{"id":"bija","iast":"bīja","deva":"बीज","en":"seed","woods":"seed","kind":"attainment","pattern":"bīj","gloss":"Seed: concentration with a seed has an object; seedless concentration has none.","sutras":["1.25","1.46","1.51","3.8","3.50"]},{"id":"samadhi","iast":"samādhi","deva":"समाधि","en":"concentration","woods":"concentration","kind":"limb","pattern":"samādh","gloss":"Complete absorption in the object; the eighth limb and the subject of the first pāda.","sutras":["1.20","1.46","1.51","2.2","2.29","2.45","3.3","3.11","3.37","4.1","4.29"]},{"id":"siddhi","iast":"siddhi","deva":"सिद्धि","en":"attainment","woods":"perfection","kind":"attainment","pattern":"siddh(?!ad)","gloss":"Extraordinary powers, called obstacles to concentration in 3.37.","sutras":["2.43","2.45","3.37","4.1"]},{"id":"kaivalya","iast":"kaivalya","deva":"कैवल्य","en":"liberation","woods":"Isolation","kind":"attainment","pattern":"kaivaly","gloss":"Aloneness: the Self standing in its own nature, free of the seen.","sutras":["2.25","3.50","3.55","4.26","4.34"]},{"id":"parinama","iast":"pariṇāma","deva":"परिणाम","en":"transformation","woods":"mutation","kind":"matter","pattern":"pariṇām","gloss":"Change of form, state or time in the mind and in things.","sutras":["2.15","3.9","3.11","3.12","3.13","3.15","3.16","4.2","4.14","4.18","4.32","4.33"]},{"id":"yama","iast":"yama","deva":"यम","en":"restraints","woods":"abstentions","kind":"limb","pattern":"(^|\\s)yam","gloss":"The first limb: non-harming, truthfulness, non-stealing, continence, non-grasping.","sutras":["2.29","2.30"]},{"id":"niyama","iast":"niyama","deva":"नियम","en":"observances","woods":"observances","kind":"limb","pattern":"niyam","gloss":"The second limb: cleanliness, /* ---------- The thread ---------- */
function thread({here=null, on=null, capId}={}){
  const onSet = new Set(on || []);
  const strands = D.padas.map(p => {
    const ks = S.filter(s => s.pada === p.n).map(s =>
      `<a class="knot${s.id===here?" here":""}${onSet.has(s.id)?" on":""}" href="${sHref(s.id)}" data-id="${s.id}" style="--k:${Math.min(s.concepts.length,5)}" aria-label="Sūtra ${s.id}"><i></i></a>`).join("");
    return `<div class="strand"><div class="strand-label"><b>${p.name}</b>${p.n} · ${S.filter(s=>s.pada===p.n).length} sūtras</div><div class="knots">${ks}</div></div>`;
  }).join("");
  return `<div class="thread" data-thread>${strands}</div><p class="thread-cap" id="${capId||"cap"}" aria-live="polite">Hover or tap a knot to read it. Taller knots carry more of the indexed terms.</p>`;
}
function wireThread(root=view){
  root.querySelectorAll("[data-thread]").forEach(th => {
    const cap = th.nextElementSibling;
    const show = id => { const s = byId[id]; cap.innerHTML = `<span class="mono">${s.id}</span> <span class="iast">${esc(s.iast)}</span><br>${woodsHTML(s.en)}`; };
    th.addEventListener("pointerover", e => { const k = e.target.closest(".knot"); if (k) show(k.dataset.id); });
    th.addEventListener("focusin", e => { const k = e.target.closest(".knot"); if (k) show(k.dataset.id); });
  });
}

    <div><div class="sec-h"><p class="eyebrow">Where it sits</p></div>${thread({here:s.id, capId:"cap-s"})}
      <p style="margin-top:var(--s-4)"><a class="btn ghost" href="#ask" data-askabout="${s.id}">Ask about ${s.id}</a></p></div>
  </div>
  ${platesFor(s.id)}
  ${gitaFor(s.id)}
  <div class="pager">${prev?`<a href="${sHref(prev.id)}">← ${prev.id}</a>`:"<span></span>"}${next?`<a href="${sHref(next.id)}">${next.id} →</a>`:"<span></span>"}</div>`;
}

function concepts(){
  const kinds = Object.entries(D.kinds).map(([k,label]) => {
    const list = C.filter(c => c.kind === k).sort((a,b) => b.sutras.length - a.sutras.length);
    return `<div class="kind"><h3>${label}</h3><div class="clist">${list.map(c => `<a href="#c-${c.id}"><span><span class="iast" style="font-size:var(--s-4)">${esc(c.iast)}</span></span><span class="en">${esc(c.en)} · Woods: ${esc(c.woods)}</span><span class="bar"><i style="width:${c.sutras.length*3}px"></i>${c.sutras.length}</span></a>`).join("")}</div></div>`;
  }).join("");
  return `<div class="sec-h"><p class="eyebrow">Concepts</p><h2>${C.length} terms, followed through the text</h2>
  <p>Each term is found by matching its stem in the Sanskrit, so a count means “the word is there”, not “the idea is discussed”. Numbers are sūtras containing the term.</p></div>${kinds}`;
}
function concept(cid){
  const c = cById[cid]; if (!c) return notFound();
  const co = D.links.filter(l => l.a === c.id || l.b === c.id).map(l => ({o: l.a===c.id?l.b:l.a, n:l.n, s:l.sutras})).sort((a,b)=>b.n-a.n);
  return `
  <div class="crumbs"><a href="#concepts">Concepts</a><span>/</span><span>${esc(D.kinds[c.kind])}</span></div>
  <div class="c-title"><span class="deva">${esc(c.deva)}</span><span class="iast">${esc(c.iast)}</span></div>
  <div class="layers">
    <div class="layer"><div class="lh"><span>Gloss</span>${grade("editorial")}</div><div>${esc(c.gloss)}<p class="prov">Written for this edition. Common English: ${esc(c.en)}. Woods' rendering: “${esc(c.woods)}”.</p></div></div>
    <div class="layer"><div class="lh"><span>Occurrences</span>${grade("derived")}</div><div><span class="mono">${c.sutras.length}</span> sūtras match <span class="pattern">${esc(c.pattern)}</span>
      <p class="prov">A regular expression run over the IAST of every sūtra. Lookbehinds exclude look-alike words, such as <i>nivṛtti</i> (cessation) for <i>vṛtti</i>.</p></div></div>
  </div>
  <section style="margin-top:var(--s-6)">${thread({on:c.sutras, capId:"cap-c"})}</section>
  <div class="two" style="margin-top:var(--s-6)">
    <div><div class="sec-h"><p class="eyebrow">Sūtras containing ${esc(c.iast)}</p></div><div class="mini">
      ${c.sutras.map(id => `<a href="${sHref(id)}"><span class="mono">${id}</span><span>${woodsHTML(byId[id].en)}</span></a>`).join("")}</div></div>
    <div><div class="sec-h"><p class="eyebrow">Shares a sūtra with</p></div>
      ${co.length?`<div class="mini">${co.map(x => `<a href="#c-${x.o}"><span class="mono">${x.n}×</span><span><span class="iast">${esc(cById[x.o].iast)}</span> <span class="muted" style="font-family:var(--f-ui);font-size:var(--s-1)">${esc(cById[x.o].en)}</span><span class="why">${x.s.join(", ")}</span></span></a>`).join("")}</div>`
      :`<p class="muted">This term never shares a sūtra with another indexed term.</p>`}</div>
  </div>`;
}

function graph(){
  return `<div class="sec-h"><p class="eyebrow">Graph</p><h2>Which ideas stand in the same sūtra</h2>
  <p>Each circle is a term; its size is the number of sūtras that contain it. A line joins two terms that occur together, and its weight counts how often. Tap a term to light up its neighbours; tap again to open it.</p></div>
  <div class="graph-box" id="gbox"><svg id="gsvg" viewBox="0 0 900 620" role="img" aria-label="Co-occurrence graph of ${C.length} terms"></svg></div>
  <div class="legend"><span>${grade("derived")}</span><span>${C.length} terms · ${D.links.length} links · drawn from the Sanskrit, not from commentary</span></div>
  <p class="graph-side" id="gside" aria-live="polite" style="margin-top:var(--s-4)">Strongest link: ${(() => { const l = D.links[0]; return `<a href="#c-${l.a}">${cById[l.a].iast}</a> and <a href="#c-${l.b}">${cById[l.b].iast}</a>, together in ${l.n} sūtras (${l.sutras.join(", ")}).`; })()}</p>`;
}
function drawGraph(){
  if (!window.d3){ const b = document.getElementById("gbox"); if (b) b.innerHTML = `<p class="note-box" style="margin:var(--s-4)">The graph couldn't load its drawing library. Reload the page to try again; every term and link is also listed on the <a href="#concepts">Concepts</a> page.</p>`; return; }
  const svg = d3.select("#gsvg"); if (svg.empty()) return;
  const W = 900, H = 620;
  const nodes = C.map(c => ({id:c.id, c, r: 5 + Math.sqrt(c.sutras.length) * 3.2}));
  const links = D.links.map(l => ({source:l.a, target:l.b, n:l.n}));
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => 90 - l.n * 8).strength(.5))
    .force("charge", d3.forceManyBody().strength(-210))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide(d => d.r + 4))
    .force("x", d3.forceX(W/2).strength(.06)).force("y", d3.forceY(H/2).strength(.09))
    .stop();
  for (let i = 0; i < 320; i++) sim.tick();
  nodes.forEach(n => { n.x = Math.max(n.r+40, Math.min(W-n.r-40, n.x)); n.y = Math.max(n.r+16, Math.min(H-n.r-16, n.y)); });
  const g = svg.append("g");
  const E = g.selectAll("line").data(links).join("line").attr("class","edge")
    .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y)
    .attr("stroke-width", d => .8 + d.n * .9);
  const N = g.selectAll("circle").data(nodes).join("circle").attr("class","node").attr("r",d=>d.r).attr("cx",d=>d.x).attr("cy",d=>d.y)
    .attr("tabindex",0).attr("role","button").attr("aria-label",d=>`${d.c.iast}, ${d.c.sutras.length} sūtras`);
  const L = g.selectAll("text").data(nodes).join("text").attr("class","nlabel").attr("x",d=>d.x + d.r + 4).attr("y",d=>d.y + 4).text(d=>d.c.iast);
  const nb = id => new Set(links.filter(l => l.source.id===id || l.target.id===id).flatMap(l => [l.source.id, l.target.id]));
  let sel = null;
  const side = document.getElementById("gside");
  function focus(d){
    sel = d ? d.id : null;
    if (!d){ N.classed("hot",false).classed("dim",false); L.classed("dim",false); E.classed("hot",false); return; }
    const set = nb(d.id); set.add(d.id);
    N.classed("hot", n => n.id === d.id).classed("dim", n => !set.has(n.id));
    L.classed("dim", n => !set.has(n.id));
    E.classed("hot", l => l.source.id===d.id || l.target.id===d.id);
    const co = D.links.filter(l => l.a===d.id||l.b===d.id).sort((a,b)=>b.n-a.n);
    side.innerHTML = `<a href="#c-${d.id}"><span class="iast">${esc(d.c.iast)}</span></a> (${esc(d.c.en)}) appears in ${d.c.sutras.length} sūtras and shares a sūtra with ${co.length} other terms` +
      (co.length ? `: ${co.slice(0,6).map(l => { const o = l.a===d.id?l.b:l.a; return `<a href="#c-${o}">${cById[o].iast}</a> ${l.n}×`; }).join(", ")}.` : ".") + ` Tap it again to open its page.`;
  }
  N.on("click", (e,d) => { if (sel === d.id) location.hash = "c-" + d.id; else focus(d); })
   .on("keydown", (e,d) => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); if (sel===d.id) location.hash="c-"+d.id; else focus(d); }});
  svg.on("click", e => { if (e.target.tagName === "svg") focus(null); });
}

/* ---------- Diagrams ---------- */
const HREF = id => "#s-" + id.replace(".", "-");
function defs(k){ return `<defs><marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahk-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-key" d="M0,0 L10,5 L0,10 z"/></marker></defs>`; }
function box(x,y,w,h,{iast,en,en2,id,key}){
  const cx = x + w/2, lines = [iast&&["t1",iast], en&&["",en], en2&&["",en2], id&&["t3",id]].filter(Boolean);
  const step = 17, y0 = y + h/2 - (lines.length-1)*step/2 + 4;
  const tx = lines.map(([c,s],i) => `<text class="${c}" x="${cx}" y="${y0 + i*step}" text-anchor="middle">${esc(s)}</text>`).join("");
  const inner = `<rect class="${key?"bx-key":"bx"}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>${tx}`;
  return id ? `<a href="${HREF(id.split(/[–,\s]/)[0])}" aria-label="${esc((iast||"")+" "+(en||"")+", sūtra "+id)}">${inner}</a>` : inner;
}
const arrow = (k,x1,y1,x2,y2,label,key,lx,ly) => `<line class="${key?"ln-key":"ln"}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${key?"ahk":"ah"}-${k})"/>${label?`<text class="lab" x="${lx??(x1+x2)/2}" y="${ly??((y1+y2)/2-6)}" text-anchor="middle">${esc(label)}</text>`:""}`;
const bracket = (x1,x2,y,label,cls="ln") => `<path class="${cls}" d="M${x1},${y-8} L${x1},${y} L${x2},${y} L${x2},${y-8}"/><text class="lab" x="${(x1+x2)/2}" y="${y+18}" text-anchor="middle">${esc(label)}</text>`;
const svg = (k,w,h,label,body) => `<div class="dg-wrap"><svg class="dg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${defs(k)}${body}</svg></div>`;

function plate(k, compact){
  const P = PLATES[k];
  return `<figure class="plate" id="plate-${k}" style="margin-inline:0">
    <div class="plate-h"><h3>${P.title}</h3><span class="mono muted" style="font-size:var(--s-2)">${P.cites}</span>${grade("editorial")}</div>
    ${P.draw()}
    <figcaption class="dg-cap">${esc(P.claim)} ${compact?`<a href="#visuals">All diagrams</a>`:`Every box opens its sūtra. The words come from the text; the arrangement is a reading of it.`}</figcaption></figure>`;
}
function inRange(id, a, b){ const v = s => { const [p,n] = s.split(".").map(Number); return p*100+n; }; return v(id) >= v(a) && v(id) <= v(b); }
function platesFor(id){
  const ks = Object.keys(PLATES).filter(k => { const c = PLATES[k].covers; for (let i=0;i<c.length;i+=2) if (inRange(id,c[i],c[i+1])) return true; return false; });
  return ks.length ? `<section style="margin-top:var(--s-7)"><p class="eyebrow">In a diagram</p>${ks.map(k => plate(k,true)).join("")}</section>` : "";
}
function heatmap(){
  const per = c => [1,2,3,4].map(p => c.sutras.filter(id => id.startsWith(p+".")).length);
  const max = Math.max(...C.flatMap(per));
  const cell = (c,p,n) => { const pct = n ? Math.round(12 + 78*n/max) : 0; const strong = n/max > .55;
    return `<td class="c" style="background:${n?`color-mix(in oklab, var(--indigo) ${pct}%, var(--card))`:"transparent"};color:${strong?"var(--paper)":"var(--ink)"}" title="${esc(c.iast)} in pāda ${p}: ${n} sūtra${n===1?"":"s"}">${n?`<a href="#c-${c.id}">${n}</a>`:'<span style="color:var(--ink-3)">·</span>'}</td>`; };
  const rows = Object.entries(D.kinds).map(([k,label]) => `<tr><th class="k" colspan="5">${label}</th></tr>` +
    C.filter(c => c.kind===k).map(c => `<tr><td class="term"><a href="#c-${c.id}" class="iast">${esc(c.iast)}</a> <span class="muted" style="font-family:var(--f-ui);font-size:var(--s-1)">${esc(c.en)}</span></td>${per(c).map((n,i)=>cell(c,i+1,n)).join("")}</tr>`).join("")).join("");
  return `<figure class="plate" style="margin-inline:0"><div class="plate-h"><h3>Where each term lives</h3>${grade("derived")}</div>
    <div class="tbl-wrap"><table class="heat"><thead><tr><th></th>${D.padas.map(p => `<th style="text-align:center">${p.n}<br><span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">${p.name.replace("-pāda","")}</span></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <figcaption class="dg-cap">Number of sūtras in each pāda whose Sanskrit contains the term; darker means more. Pādas differ in length (51, 55, 55, 34), so compare within a row.</figcaption></figure>`;
}
function visuals(){
  return `<div class="sec-h"><p class="eyebrow">Visualize</p><h2>The structure of the text, drawn</h2>
  <p>Each diagram is built from sūtras the text gives in sequence, and every box opens the sūtra it rests on. They are graded Editorial: the words are Patañjali's, the arrangement is a reading. The grid at the end is computed from the term index.</p>
  <p style="margin-top:.4rem"><a href="#graph">Open the term graph</a>, which shows which ideas share a sūtra.</p></div>
  ${["limbs","vrtti","klesa","pain","ladder"].map(k => plate(k,false)).join("")}
  ${heatmap()}`;
}

const G = D.gita;
const KIND_LABEL = {teaching:"Same teaching", list:"Shared list", wording:"Shared wording"};
function linkCard(l, showYs){
