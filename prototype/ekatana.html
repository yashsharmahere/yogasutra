<title>Ekatāna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<style>
/* Layout: a reading instrument. One header, a 68ch reading column, and a "thread" strip
   (one strand per pāda, one knot per sūtra) that recurs as the map of the whole text. */
:root{
  --paper:#ECEEE8; --paper-2:#E2E5DE; --card:#F6F7F3; --ink:#1B211F; --ink-2:#4B5450; --ink-3:#737B76; --rule:#C8CDC5;
  --indigo:#2C3A8E; --indigo-soft:#DADEF0; --lac:#9A2E28; --lac-soft:#F0DCD8;
  --g-source:#2C3A8E; --g-derived:#36684A; --g-editorial:#85621A; --g-model:#7A3B8C;
  --f-deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  --f-iast:"Tiro Devanagari Sanskrit","Literata",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s-1:.75rem; --s-2:.875rem; --s-3:1rem; --s-4:1.125rem; --s-5:1.375rem; --s-6:1.75rem; --s-7:2.5rem; --s-8:3.5rem;
  --radius:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12141B; --paper-2:#191C25; --card:#1C1F29; --ink:#E7E5DD; --ink-2:#AEB0B6; --ink-3:#7F828C; --rule:#2D313D;
  --indigo:#A5B0F4; --indigo-soft:#262C4E; --lac:#EC9086; --lac-soft:#3B2323;
  --g-source:#A5B0F4; --g-derived:#8CC9A2; --g-editorial:#E0BE70; --g-model:#D3A1E2; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12141B; --paper-2:#191C25; --card:#1C1F29; --ink:#E7E5DD; --ink-2:#AEB0B6; --ink-3:#7F828C; --rule:#2D313D;
  --indigo:#A5B0F4; --indigo-soft:#262C4E; --lac:#EC9086; --lac-soft:#3B2323;
  --g-source:#A5B0F4; --g-derived:#8CC9A2; --g-editorial:#E0BE70; --g-model:#D3A1E2; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--s-3);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--indigo);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
h1,h2,h3{text-wrap:balance;font-weight:500;line-height:1.2;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto}
.col{max-width:68ch}
.eyebrow{font-family:var(--f-ui);font-size:var(--s-1);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.deva{font-family:var(--f-deva)}
.iast{font-family:var(--f-iast);font-style:italic}
.muted{color:var(--ink-2)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:var(--s-5);padding-block:.75rem;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:.5rem;text-decoration:none;color:var(--ink)}
.mark .deva{font-size:1.5rem;line-height:1}
.mark .en{font-family:var(--f-ui);font-weight:600;font-size:var(--s-3);letter-spacing:.01em}
nav.main{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:auto;font-family:var(--f-ui);font-size:var(--s-2)}
nav.main a{color:var(--ink-2);text-decoration:none;padding:.35rem .6rem;border-radius:var(--radius)}
nav.main a:hover{color:var(--ink);background:var(--paper-2)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--paper-2);font-weight:500}

main{padding-block:var(--s-7) var(--s-8)}
section+section{margin-top:var(--s-8)}

/* Grade badges */
.grade{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--f-ui);font-size:.6875rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.grade::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.g-source{color:var(--g-source)} .g-derived{color:var(--g-derived)} .g-editorial{color:var(--g-editorial)} .g-model{color:var(--g-model)}

/* The thread */
.thread{display:grid;gap:.9rem}
.strand{display:grid;grid-template-columns:7.5rem 1fr;align-items:center;gap:var(--s-3)}
.strand-label{font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-2);line-height:1.3}
.strand-label b{display:block;color:var(--ink);font-weight:500;font-size:var(--s-2)}
.knots{position:relative;display:flex;justify-content:space-between;align-items:center;height:34px;min-width:0}
.knots::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-3)}
.knot{position:relative;flex:1 1 0;display:flex;justify-content:center;align-items:center;height:100%;text-decoration:none;min-width:0}
.knot i{display:block;width:3px;height:calc(6px + var(--k) * 4px);background:var(--ink-2);border-radius:2px;transition:background .15s,transform .15s}
.knot:hover i,.knot:focus-visible i{background:var(--indigo);transform:scaleY(1.25)}
.knot.on i{background:var(--lac);width:4px}
.knot.here i{background:var(--indigo);width:5px}
.thread-cap{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2);min-height:2.6em;margin-top:.25rem;padding-left:calc(7.5rem + var(--s-3))}
.thread-cap .mono{color:var(--ink)}
@media (max-width:600px){
  .strand{grid-template-columns:1fr;gap:.2rem}
  .thread-cap{padding-left:0}
}

/* Home */
.hero{display:grid;gap:var(--s-5)}
.hero h1{font-family:var(--f-body);font-size:clamp(2rem,5vw,3.25rem);font-weight:400;letter-spacing:-.01em;max-width:20ch}
.hero h1 em{font-family:var(--f-iast)}
.hero .lede{font-size:var(--s-4);color:var(--ink-2);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-6);font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2)}
.facts b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:var(--s-5);display:block;line-height:1.1}
.def{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s-7);align-items:start}
@media (max-width:820px){.def{grid-template-columns:1fr;gap:var(--s-6)}}
.big-deva{font-family:var(--f-deva);font-size:clamp(2rem,6vw,3.4rem);line-height:1.35;color:var(--ink)}
.big-iast{font-family:var(--f-iast);font-style:italic;font-size:var(--s-5);color:var(--ink-2);margin-top:.4rem}
.woods{font-family:var(--f-body);font-size:var(--s-4);line-height:1.55}
.woods .br{color:var(--ink-3)}
.jn{font-family:var(--f-body);color:var(--ink-2)}
.who{font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3);letter-spacing:.02em;margin-right:.35rem}
.flag{display:block;font-family:var(--f-ui);font-size:var(--s-1);color:var(--lac);margin-top:.35rem}
.shelf{display:grid;gap:0;max-width:68ch}
.shelf div{display:grid;gap:.2rem;padding-block:.8rem;border-bottom:1px solid var(--rule)}
.shelf b{font-weight:500}
.shelf span{font-size:var(--s-2);color:var(--ink-2)}
.rules{counter-reset:r;display:grid;gap:var(--s-3);padding:0;margin:0;list-style:none;max-width:68ch}
.rules li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.25rem}
.rules li::before{counter-increment:r;content:counter(r);font-family:var(--f-mono);color:var(--indigo)}
.cite{font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3);margin-top:.5rem}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.starts a{display:grid;gap:.35rem;background:var(--paper);padding:var(--s-4);text-decoration:none;color:var(--ink);align-content:start}
.starts a:hover{background:var(--card)}
.starts .t{font-family:var(--f-ui);font-weight:500;font-size:var(--s-3);color:var(--indigo)}
.starts .d{font-size:var(--s-2);color:var(--ink-2);line-height:1.5}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:var(--s-5)}
.grades div{display:grid;gap:.4rem;align-content:start}
.grades p{font-size:var(--s-2);color:var(--ink-2)}
.sec-h{display:grid;gap:.5rem;margin-bottom:var(--s-5)}
.sec-h h2{font-size:var(--s-6)}
.sec-h p{color:var(--ink-2);max-width:62ch}

/* Read */
.tabs{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:var(--s-5)}
.tabs a{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2);text-decoration:none;padding:.6rem .8rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--indigo);font-weight:500}
.tabs .deva{font-size:1rem;margin-right:.35rem}
.prefs{display:flex;gap:var(--s-4);flex-wrap:wrap;font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2);margin-bottom:var(--s-6);align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.seg button{font:inherit;background:transparent;color:var(--ink-2);border:0;padding:.3rem .65rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.group{margin-top:var(--s-7)}
.group-h{display:grid;gap:.3rem;padding-bottom:var(--s-3);border-bottom:1px solid var(--rule);max-width:68ch}
.group-h h3{font-size:var(--s-5)}
.group-h p{font-size:var(--s-2);color:var(--ink-2)}
.row{display:grid;grid-template-columns:3.5rem minmax(0,1fr);gap:var(--s-3);padding-block:var(--s-4);border-bottom:1px solid var(--rule);max-width:68ch;text-decoration:none;color:var(--ink)}
.row:hover{background:var(--card)}
.row .num{font-family:var(--f-mono);font-size:var(--s-2);color:var(--ink-3);padding-top:.35rem}
.row .r-deva{font-family:var(--f-deva);font-size:1.3rem;line-height:1.5}
.row .r-iast{font-family:var(--f-iast);font-style:italic;color:var(--ink-2)}
.row .r-en{font-size:var(--s-3);margin-top:.35rem}
.row .r-en .br{color:var(--ink-3)}

/* Sutra page */
.crumbs{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-3);display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:var(--s-5)}
.crumbs a{color:var(--ink-2)}
.s-head{display:grid;gap:var(--s-3)}
.s-num{font-family:var(--f-mono);font-size:var(--s-6);color:var(--indigo);font-weight:500}
.layers{border-top:1px solid var(--rule);margin-top:var(--s-6)}
.layer{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:var(--s-4);padding-block:var(--s-4);border-bottom:1px solid var(--rule)}
.layer .lh{display:grid;gap:.3rem;align-content:start}
.layer .lh span:first-child{font-family:var(--f-ui);font-size:var(--s-2);font-weight:500}
.layer .prov{font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3);margin-top:.45rem;line-height:1.5}
@media (max-width:640px){.layer{grid-template-columns:1fr;gap:.5rem}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;gap:.4rem;align-items:baseline;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:.2rem .7rem;text-decoration:none;color:var(--ink);font-size:var(--s-2)}
.chip:hover{border-color:var(--indigo)}
.chip .iast{color:var(--ink)}
.chip small{font-family:var(--f-ui);color:var(--ink-3);font-size:var(--s-1)}
.pager{display:flex;justify-content:space-between;gap:var(--s-4);margin-top:var(--s-6);font-family:var(--f-ui);font-size:var(--s-2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-7)}
@media (max-width:820px){.two{grid-template-columns:1fr;gap:var(--s-6)}}
.mini{display:grid;gap:0}
.mini a{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:var(--s-2);padding-block:.6rem;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:var(--s-2)}
.mini a:hover{background:var(--card)}
.mini .mono{color:var(--ink-3)}
.mini .why{display:block;font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3);margin-top:.15rem}
.btn{font-family:var(--f-ui);font-size:var(--s-2);font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:var(--radius);cursor:pointer;text-decoration:none;display:inline-flex;gap:.4rem;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.5;cursor:default}

/* Concepts */
.kind{margin-top:var(--s-6)}
.kind h3{font-family:var(--f-ui);font-size:var(--s-1);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:.4rem}
.clist a{display:grid;grid-template-columns:minmax(7rem,10rem) minmax(0,1fr) 5.5rem;gap:var(--s-3);align-items:center;padding-block:.55rem;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.clist a:hover{background:var(--card)}
.clist .en{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2)}
.bar{display:flex;align-items:center;gap:.5rem;font-family:var(--f-mono);font-size:var(--s-1);color:var(--ink-3)}
.bar i{display:block;height:6px;background:var(--indigo);border-radius:1px;opacity:.75}
@media (max-width:520px){.clist a{grid-template-columns:minmax(0,1fr) 4.5rem}.clist .en{grid-column:1;grid-row:2;margin-top:-.4rem}}
.c-title{display:flex;align-items:baseline;gap:var(--s-4);flex-wrap:wrap}
.c-title .deva{font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.2}
.c-title .iast{font-size:var(--s-6);color:var(--ink-2)}
.pattern{font-family:var(--f-mono);font-size:var(--s-1);background:var(--paper-2);padding:.1rem .35rem;border-radius:2px;color:var(--ink-2);word-break:break-all}

/* Graph */
.graph-box{position:relative;border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);overflow:hidden}
.graph-box svg{display:block;width:100%;height:auto;touch-action:none}
.graph-box .nlabel{font-family:var(--f-iast);font-style:italic;font-size:13px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.graph-box .edge{stroke:var(--ink-3);stroke-opacity:.35}
.graph-box .edge.hot{stroke:var(--lac);stroke-opacity:.9}
.graph-box .node{fill:var(--indigo);stroke:var(--card);stroke-width:1.5px;cursor:pointer}
.graph-box .node.hot{fill:var(--lac)}
.graph-box .node.dim,.graph-box .nlabel.dim{opacity:.25}
.graph-side{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2)}
.legend{display:flex;gap:var(--s-5);flex-wrap:wrap;font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3);margin-top:.6rem}

/* Ask */
.ask-form{display:grid;gap:var(--s-3)}
.ask-form textarea{font:inherit;font-size:var(--s-4);width:100%;min-height:4.5rem;resize:vertical;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:.75rem .9rem}
.ask-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.examples{display:flex;flex-wrap:wrap;gap:.4rem}
.examples button{font-family:var(--f-ui);font-size:var(--s-2);background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:.3rem .7rem;border-radius:999px;cursor:pointer;text-align:left}
.examples button:hover{border-color:var(--indigo);color:var(--ink)}
.answer{margin-top:var(--s-6);display:grid;gap:var(--s-4)}
.answer .meta{display:flex;gap:var(--s-4);flex-wrap:wrap;align-items:center;font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3)}
.sent{font-size:var(--s-4);line-height:1.6}
.sent.reading .stext{font-style:italic}
.sent .tag{font-family:var(--f-ui);font-size:.6875rem;letter-spacing:.07em;text-transform:uppercase;color:var(--g-editorial);margin-left:.35rem;font-style:normal;font-weight:600}
.sent.bad .stext{text-decoration:line-through;color:var(--ink-3)}
.sent.bad .tag{color:var(--lac)}
.cbtn{font-family:var(--f-mono);font-size:var(--s-1);border:1px solid var(--rule);background:var(--card);color:var(--indigo);border-radius:2px;padding:.05rem .35rem;margin-left:.3rem;cursor:pointer;vertical-align:.1em}
.cbtn[aria-expanded="true"]{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}
.evid{margin-top:.6rem;border-left:2px solid var(--indigo);padding:.5rem 0 .5rem var(--s-4);font-size:var(--s-3)}
.evid .deva{font-size:1.15rem}
.note-box{border:1px solid var(--rule);background:var(--card);padding:var(--s-4);border-radius:var(--radius);font-size:var(--s-3)}
.note-box.warn{border-color:var(--lac);background:var(--lac-soft)}
.thinking{font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2)}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* Search */
.search-in{font:inherit;font-size:var(--s-5);width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:.4rem 0}
.search-in::placeholder{color:var(--ink-3)}
mark{background:var(--indigo-soft);color:inherit;padding:0 .1em;border-radius:2px}

/* Method */
.tbl-wrap{overflow-x:auto}
#view{overflow-wrap:break-word}
.iast,.deva,.big-deva,.big-iast,.r-iast,.r-deva,.pair,.pair *,.link-card,.link-card *{overflow-wrap:anywhere}
.s-head{min-width:0}
@media (max-width:520px){.seg{flex-wrap:wrap}.seg button{padding:.3rem .5rem}.prefs{gap:var(--s-2)}}
table{border-collapse:collapse;width:100%;font-size:var(--s-2);min-width:34rem}
th,td{text-align:left;padding:.65rem .75rem .65rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-ui);font-weight:500;font-size:var(--s-1);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.prose{display:grid;gap:var(--s-4);max-width:68ch}
.prose h3{font-size:var(--s-5);margin-top:var(--s-4)}
.prose ul{margin:0;padding-left:1.2rem;display:grid;gap:.4rem}

.link-card{display:grid;gap:.5rem;padding-block:var(--s-4);border-bottom:1px solid var(--rule);max-width:68ch}
.link-card .lk{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:baseline;font-family:var(--f-ui);font-size:var(--s-1);color:var(--ink-3)}
.kind-pill{font-family:var(--f-ui);font-size:.6875rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--indigo);border:1px solid var(--indigo);border-radius:2px;padding:.05rem .4rem}
.link-card .bgd{font-family:var(--f-deva);font-size:1.15rem;line-height:1.5}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-5);max-width:none}
@media (max-width:720px){.pair{grid-template-columns:1fr;gap:var(--s-3)}}
.stats{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-6);font-family:var(--f-ui);font-size:var(--s-2);color:var(--ink-2);margin-bottom:var(--s-5)}

const D = {"vvExtra":{"extra":{"after":"3.21","vv_number":"3.22","text":"By this the disappearance or concealment of words which are being spoken and such other things are also explained.","note":"In Vivekananda's edition, not in this one: the 196th sūtra (etena śabdādy antardhānam uktam)."},"gap":{"ours":"4.16","note":"Vivekananda's edition has no counterpart for 4.16 (na caikacittatantraṃ vastu...); his Book 4 has 33 aphorisms, so from 4.17 his numbers run one lower than this edition's."}},"johnstonSha":"6ee8015ff5cdee37ee942fdef7d06be6228b0a166d49f595a1ecda76f3c152f4","gita":{"links":[{"ys":"1.12","bg":"6.35","kind":"teaching","origin":"search","note":"Both name practice (abhyāsa) and non-attachment (vairāgya) as the way to master a restless mind."},{"ys":"1.15","bg":"13.9","kind":"wording","origin":"search","note":"Vairāgya appears in the Gītā's list of the marks of knowledge, directed at the objects of the senses."},{"ys":"1.20","bg":"2.54","kind":"wording","origin":"search","note":"Both join insight (prajñā) to samādhi: the Gītā's person 'steady in wisdom' is 'established in samādhi'."},{"ys":"1.24","bg":"15.17","kind":"teaching","origin":"search","note":"Both describe a supreme Self distinct from all others, which the Gītā also calls īśvara."},{"ys":"1.27","bg":"7.8","kind":"wording","origin":"search","note":"Both use praṇava for the syllable Om; the Gītā calls it what is supreme in all the Vedas."},{"ys":"1.28","bg":"8.13","kind":"teaching","origin":"review","note":"Both teach repeating Om while holding its meaning, or the Lord, in mind."},{"ys":"1.30","bg":"14.8","kind":"wording","origin":"search","note":"The same compound pramāda-ālasya (heedlessness and sloth): obstacles in the Yoga Sūtra, marks of tamas in the Gītā."},{"ys":"1.33","bg":"12.13","kind":"teaching","origin":"search","note":"Friendliness (maitrī) and compassion (karuṇā), here as attitudes that calm the mind, in the Gītā as marks of the devotee."},{"ys":"2.1","bg":"17.15","kind":"list","origin":"search","note":"The Gītā counts study (svādhyāya) as an austerity (tapas) of speech; the Yoga Sūtra pairs the two in kriyā-yoga."},{"ys":"2.15","bg":"14.18","kind":"wording","origin":"search","note":"The same compound guṇa-vṛtti, the working of the three qualities."},{"ys":"2.20","bg":"14.19","kind":"teaching","origin":"search","note":"Both speak of the seer (draṣṭṛ) who looks on (anupaś-); in the Gītā, the one who sees that only the guṇas act."},{"ys":"2.29","bg":"4.29","kind":"wording","origin":"search","note":"Prāṇāyāma: a limb of yoga here, a form of inner offering in the Gītā."},{"ys":"2.30","bg":"17.14","kind":"list","origin":"search","note":"Non-harming (ahiṃsā) and continence (brahmacarya) appear in the Gītā's austerity of the body and among the five yamas here."},{"ys":"2.32","bg":"17.14","kind":"list","origin":"search","note":"Cleanliness (śauca) and austerity (tapas) appear in both lists."},{"ys":"2.39","bg":"6.10","kind":"wording","origin":"search","note":"Aparigraha (non-grasping): a yama here, a condition of the solitary yogin in the Gītā."},{"ys":"2.46","bg":"6.11","kind":"teaching","origin":"review","note":"Both ask for a steady seat, sthiram āsanam."},{"ys":"2.49","bg":"4.29","kind":"wording","origin":"search","note":"Prāṇāyāma as the stopping of in- and out-breath here; in the Gītā, the restraint of prāṇa and apāna."},{"ys":"3.1","bg":"8.12","kind":"wording","origin":"search","note":"Dhāraṇā: binding the mind to a place here; in the Gītā, yoga-dhāraṇā, the mind held in the heart and the breath at the crown."},{"ys":"3.11","bg":"6.12","kind":"wording","origin":"search","note":"One-pointed mind (ekāgra): an outcome of samādhi here, the yogin's starting point on the seat in the Gītā."}],"kinds":{"teaching":"Same teaching: the two passages say substantially the same thing.","list":"Shared list: both enumerate overlapping items.","wording":"Shared wording: the same word or compound; its sense may differ."},"rejected":[{"ys":"3.22","bg":"3.6","why":"Both use saṃyama, but in the Gītā it is the ordinary verb 'restraining' (the senses), not Patañjali's technical term."},{"ys":"1.41","bg":"16.3","why":"Both use abhijāta, but in the Gītā it means 'born to' (a divine nature), not 'flawless' as of a jewel."},{"ys":"1.8","bg":"2.70","why":"A shared string (pratiṣṭh-) with no shared meaning."}],"candidates":295,"reviewedTop":70,"verseCount":701,"verses":{"12.13":{"deva":"अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च निर्ममो निरहङ्कारः समदुःखसुखः क्षमी","iast":"adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī"},"13.9":{"deva":"इन्द्रियार्थेषु वैराग्यमनहङ्कार एव च जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम्","iast":"indriyārtheṣu vairāgyamanahaṅkāra eva ca janmamṛtyujarāvyādhiduḥkhadoṣānudarśanam"},"14.18":{"deva":"ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः जघन्यगुणवृत्तिस्था अधो गच्छन्ति तामसाः","iast":"ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ jaghanyaguṇavṛttisthā adho gacchanti tāmasāḥ"},"14.19":{"deva":"नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति","iast":"nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati guṇebhyaśca paraṃ vetti madbhāvaṃ so'dhigacchati"},"14.8":{"deva":"तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत","iast":"tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām pramādālasyanidrābhistannibadhnāti bhārata"},"15.17":{"deva":"उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः","iast":"uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ yo lokatrayamāviśya bibhartyavyaya īśvaraḥ"},"17.14":{"deva":"देवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम् ब्रह्मचर्यमहिंसा च शारीरं तप उच्यते","iast":"devadvijaguruprājñapūjanaṃ śaucamārjavam brahmacaryamahiṃsā ca śārīraṃ tapa ucyate"},"17.15":{"deva":"अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत् स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते","iast":"anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat svādhyāyābhyasanaṃ caiva vāṅmayaṃ tapa ucyate"},"2.54":{"deva":"स्थितप्र ":["4.29"]},{"id":"t26","type":"partial","q":"Does the Yoga Sūtra mention chakras?","gold":["3.29"],"forbid":["seven chakra","seven cakra","kundalini","sahasrara","muladhara","anahata","ajna"]},{"id":"t27","type":"partial","q":"Which postures does Patañjali recommend, such as headstand or lotus?","gold":["2.46","2.47","2.48"],"forbid":["padmasana","sirsasana","siddhasana","sarvangasana"]},{"id":"t28","type":"absent","q":"What does the text say about diet?","forbid":["vegetarian","sattvic food","sattvic diet"]},{"id":"t29","type":"absent","q":"What does the Yoga Sūtra say about kuṇḍalinī?","forbid":["serpent power"]},{"id":"t30","type":"absent","q":"What does Patañjali teach about Krishna?","forbid":[]}],"padas":[{"n":1,"name":"Samādhi-pāda","deva":"समाधिपादः","woods":"Concentration"},{"n":2,"name":"Sādhana-pāda","deva":"साधनपादः","woods":"Means of attainment"},{"n":3,"name":"Vibhūti-pāda","deva":"विभूतिपादः","woods":"Supernormal powers"},{"n":4,"name":"Kaivalya-pāda","deva":"कैवल्यपादः","woods":"Isolation"}],"groups":[{"id":0,"pada":1,"range":"1.1–4","heading":"Goal of Concentration","summary":"Yoga is the concentration which restricts the fluctuations. Freed from them, the Self attains to self-expression.","sutras":["1.1","1.2","1.3","1.4"]},{"id":1,"pada":1,"range":"1.5–11","heading":"Forms of the mind-stuff","summary":"The fluctuations are all exposed to attack from the hindrances and are five in number: sources-of-valid-ideas, misconceptions, predicate-relations, sleep, memory.","sutras":["1.5","1.6","1.7","1.8","1.9","1.10","1.11"]},{"id":2,"pada":1,"range":"1.12–16","heading":"Methods of restricting fluctuations","summary":"An orientation of the whole life with reference to one idea; an emotional transformation corresponding to this focused state.","sutras":["1.12","1.13","1.14","1.15","1.16"]},{"id":3,"pada":1,"range":"1.17–18","heading":"Kinds of concentration","summary":"Four kinds of conscious concentration, and the concentration of subliminal-impressions alone.","sutras":["1.17","1.18"]},{"id":4,"pada":1,"range":"1.19–23","heading":"Degrees of approach to concentration","summary":"The worldly approach; the spiritual approach; the combinations of methods and intensities; and the devotion to the highest Self.","sutras":["1.19","1.20","1.21","1.22","1.23"]},{"id":5,"pada":1,"range":"1.24–28","heading":"Analysis of the highest Self","summary":"Unique quality of the highest Self; proof of His existence; His temporal priority; His symbolical realization.","sutras":["1.24","1.25","1.26","1.27","1.28"]},{"id":6,"pada":1,"range":"1.29–34","heading":"Obstacles to the calming of the mind-stuff","summary":"The inner sense is exposed to distractions which may be overcome by focusing the mind; by the cultivation of sentiments; one may also practise breathings.","sutras":["1.29","1.30","1.31","1.32","1.33","1.34"]},{"id":7,"pada":1,"range":"1.35–39","heading":"Attainment of Stability","summary":"Suitable objects for fixed-attention and contemplation.","sutras":["1.35","1.36","1.37","1.38","1.39"]},{"id":8,"pada":1,"range":"1.40–47","heading":"Mastery and concentration","summary":"Classification of concentration with reference to different single objects or absence of objects, or to the mental act, or to a fusion of object and knower.","sutras":["1.40","1.41","1.42","1.43","1.44","1.45","1.46","1.47"]},{"id":9,"pada":1,"range":"1.48–51","heading":"Normative insight","summary":"After-effects of concentrated insight efface after-effects of concentration upon objects.","sutras":["1.48","1.49","1.50","1.51"]},{"id":10,"pada":2,"range":"2.1–11","heading":"Devices for weakening hindrances","summary":"Aids serviceable to the beginner who is on the path to concentration.","sutras":["2.1","2.2","2.3","2.4","2.5","2.6","2.7","2.8","2.9","2.10","2.11"]},{"id":11,"pada":2,"range":"2.12–14","heading":"Karma","summary":"Origin of karma in hindrances; result of karma in state-of-existence, length of life, and pleasure or pain.","sutras":["2.12","2.13","2.14"]},{"id":12,"pada":2,"range":"2.15","heading":"All is pain","summary":"Present and future and past correlations with objects result unavoidably in pain.","sutras":["2.15"]},{"id":13,"pada":2,"range":"2.16","heading":"There is an escape","summary":"Only yogins are sensitive to future pain. This may be avoided in that it has not expressed itself in actual suffering.","sutras":["2.16"]},{"id":14,"pada":2,"range":"2.17–24","heading":"Cause of pain","summary":"The Seer-sight relation: stresses between the aspects, the power of the undefiled Seer, and their correlation until the Seer's purpose is complete.","sutras":["2.17","2.18","2.19","2.20","2.21","2.22","2.23","2.24"]},{"id":15,"pada":2,"range":"2.25","heading":"The escape","summary":"Positive state of Isolation follows the ending of the correlation.","sutras":["2.25"]},{"id":16,"pada":2,"range":"2.26–27","heading":"Means of escape","summary":"The act of discrimination leading up to the act of insight.","sutras":["2.26","2.27"]},{"id":17,"pada":2,"range":"2.28–29","heading":"Eight aids to yoga","summary":"To purify the aspects and to intensify intuitive thinking there are five indirect aids and three direct aids.","sutras":["2.28","2.29"]},{"id":18,"pada":2,"range":"2.30–31","heading":"First indirect aid: five abstentions","summary":"The elements and degrees of morality in the form of prohibitions.","sutras":["2.30","2.31"]},{"id":19,"pada":2,"range":"2.32","heading":"Second indirect aid: five observances","summary":"Advances in morality in the form of voluntary action.","sutras":["2.32"]},{"id":20,"pada":2,"range":"2.33–45","heading":"Results of the abstentions and observances","summary":"Persistent inhibitions of certain kinds reorganize an increase of activity of the opposite kind.","sutras":["2.33","2.34","2.35","2.36","2.37","2.38","2.39","2.40","2.41","2.42","2.43","2.44","2.45"]},{"id":21,"pada":2,"range":"2.46–48","heading":"Third indirect aid: postures","summary":"Bodily conditions favourable to concentration.","sutras":["2.46","2.47","2.48"]},{"id":22,"pada":2,"range":"2.49–52","heading":"Fourth indirect aid: restraint of the breath","summary":"Calming of affective states is favourable to concentration.","sutras":["2.49","2.50","2.51","2.52"]},{"id":23,"pada":2,"range":"2.53–55","heading":"Fifth indirect aid: withdrawal of the senses","summary":"The span of attention is confined to an inner object.","sutras":["2.53","2.54","2.55"]},{"id":24,"pada":3,"range":"3.1","heading":"First direct aid: fixed-attention","summary":"The knower focuses the process of knowing upon the object to be known.","sutras":["3.1"]},{"id":25,"pada":3,"range":"3.2","heading":"Second direct aid: contemplation","summary":"A two-term relation between the process of knowing and the object to be known.","sutras":["3.2"]},{"id":26,"pada":3,"range":"3.3","heading":"Third direct aid: concentration","summary":"A fusion of the knower and the process of knowing with the object to be known.","sutras":["3.3"]},{"id":27,"pada":3,"range":"3.4–10","heading":"Transition to seedless concentration","summary":"The direct aids in combination result in insight and restricted subliminal-impressions and the calm flow of the mind-stuff.","sutras":["3.4","3.5","3.6","3.7","3.8","3.9","3.10"]},{"id":28,"pada":3,"range":"3.11–15","heading":"Mutations of substances","summary":"In the focused state the concentration holds two time-forms within the span of attention. Mutations are in fixed orders of subliminal-impressions in the restricted state.","sutras":["3.11","3.12","3.13","3.14","3.15"]},{"id":29,"pada":3,"range":"3.16–52","heading":"Constraint applied to different orders of mutation","summary":"Given a single mutation of external-aspect or time-form or intensity, the whole sequence comes under control of the concentrated insight.","sutras":["3.16","3.17","3.18","3.19","3.20","3.21","3.22","3.23","3.24","3.25","3.26","3.27","3.28","3.29","3.30","3.31","3.32","3.33","3.34","3.35","3.36","3.37","3.38","3.39","3.40","3.41","3.42","3.43","3.44","3.45","3.46","3.47","3.48","3.49","3.50","3.51","3.52"]},{"id":30,"pada":3,"range":"3.53–55","heading":"Culmination of concentration","summary":"The particular which is indiscernible in class or term or point-in-space is intuitively discerned. This is the attainment of Isolation.","sutras":["3.53","3.54","3.55"]},{"id":31,"pada":4,"range":"4.1–13","heading":"Substances and subconsciousness","summary":"Correspondence between imperceptible forms of substance and latent-impressions of concentrated states.","sutras":["4.1","4.2","4.3","4.4","4.5","4.6","4.7","4.8","4.9","4.10","4.11","4.12","4.13"]},{"id":32,"pada":4,"range":"4.14–23","heading":"Polemic against Idealism","summary":"Knowledge of the stream of consciousness is impossible unless it be a permanent order as contrasted with a succession of transient appearances.","sutras":["4.14","4.15","4.16","4.17","4.18","4.19","4.20","4.21","4.22","4.23"]},{"id":33,"pada":4,"range":"4.24–34","heading":"Complete Self-realization of the Self","summary":"All hindrances subside; all acts of the Self are spontaneous and free.","sutras":["4.24","4.25","4.26","4.27","4.28","4.29","4.30","4.31","4.32","4.33","4.34"]}],"sutras":[{"id":"1.1","pada":1,"n":1,"group":0,"iast":"atha yogānuśāsanam","deva":"अथ योगानुशासनम्","en":"Now the exposition of yoga [is to be made].","jn":"OM: Here follows Instruction in Union.","vv":"Now concentration is explained.","concepts":[]},{"id":"1.2","pada":1,"n":2,"group":0,"iast":"yogaś cittavṛttinirodhaḥ","deva":"योगश्चित्तवृत्तिनिरोधः","en":"Yoga is the restriction of the fluctuations of mind-stuff.","jn":"Union, spiritual consciousness, is gained through control of the versatile psychic nature.","vv":"Yoga is restraining the mind-stuff (Chitta) from taking various forms (Vrittis).","concepts":["citta","vrtti","nirodha"]},{"id":"1.3","pada":1,"n":3,"group":0,"iast":"tadā draṣṭuḥ svarūpe 'vasthānam","deva":"तदा द्रष्टुः स्वरूपे ऽवस्थानम्","en":"Then the Seer [that is, the Self] abides in himself.","jn":"Then the Seer comes to consciousness in his proper nature.","vv":"At that time (the time of concentration) the seer (Purusha) rests in his own (unmodified) state.","concepts":["drastr"]},{"id":"1.4","pada":1,"n":4,"group":0,"iast":"vṛttisārūpyam itaratra","deva":"वृत्तिसारूप्यमितरत्र","en":"At other times it [the Self] takes the same form as the fluctuations [of mind-stuff].","jn":"Heretofore the Seer has been enmeshed in the activities of the psychic nature.","vv":"At other times (other than that of concentration) the seer is identified with the modifications.","concepts":["vrtti"]},{"id":"1.5","pada":1,"n":5,"group":1,"iast":"vṛttayaḥ pañcatayyaḥ kliṣṭākliṣṭāḥ","deva":"वृत्तयः पञ्चतय्यः क्लिष्टाक्लिष्टाः","en":"The fluctuations are of five kinds and are hindered or unhindered.","jn":"The psychic activities are five; they are either subject or not subject to the five hindrances (Book II, 3).","vv":"There are five classes of modifications, (some) painful and (others) not painful.","concepts":["vrtti"]},{"id":"1.6","pada":1,"n":6,"group":1,"iast":"pramāṇaviparyayavikalpanidrāsmṛtayaḥ","deva":"प्रमाणविपर्ययविकल्पनिद्रास्मृतयः","en":"Sources-of-valid-ideas and misconceptions and predicate-relations and sleep and memory.","jn":"These activities are: Sound intellection, unsound intellection, predication, sleep, memory.","vv":"(These are) right knowledge, indiscrimination, verbal delusion, sleep, and memory.","concepts":["smrti","vikalpa"]},{"id":"1.7","pada":1,"n":7,"group":1,"iast":"pratyakṣānumānāgamāḥ pramāṇāni","deva":"प्रत्यक्षानुमानागमाः प्रमाणानि","en":"Sources-of-valid-ideas are perception and inference and verbal-communication.","jn":"The elements of sound intellection are: direct observation, inductive reason, and trustworthy testimony.","vv":"Direct perception, inference, and competent evidence are proofs.","concepts":[]},{"id":"1.8","pada":1,"n":8,"group":1,"iast":"viparyayo mithyājñānam atadrūpapratiṣṭham","deva":"विपर्ययो मिथ्याज्ञानमतद्रूपप्रतिष्ठम्","en":"Misconception is an erroneous idea not based on that form [in respect of which the misconception is entertained].","jn":"Unsound intellection is false understanding, not resting on a perception of the true nature of things.","vv":"Indiscrimination is false knowledge not established in real nature.","concepts":[]},{"id":"1.9","pada":1,"n":9,"group":1,"iast":"śabdajñānānupātī vastuśūnyo vikalpaḥ","deva":"शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः","en":"The predicate-relation (vikalpa) is without any [corresponding perceptible] object and follows as a result of perception or of words.","jn":"Predication is carried on through words or thoughts not resting on an object perceived.","vv":"Verbal delusion follows from words having no (corresponding) reality.","concepts":["vikalpa"]},{"id":"1.10","pada":1,"n":10,"group":1,"iast":"abhāvapratyayālambanā vṛttir nidrā","deva":"अभावप्रत्ययालम्बना वृत्तिर्निद्रा","en":"Sleep is a fluctuation of [mind-stuff] supported by the cause of the [transient] negation [of the waking and the dreaming fluctuations].","jn":"Sleep is the psychic condition which rests on mind states, all material things being absent.","vv":"Sleep is a Vritti which embraces the feeling of voidness.","concepts":["vrtti","pratyaya"]},{"id":"1.11","pada":1,"n":11,"group":1,"iast":"anubhūtaviṣayāsaṃpramoṣaḥ smṛtiḥ","deva":"अनुभूतविषयासंप्रमोषः स्मृतिः","en":"Memory is not-adding-surreptitiously to a once experienced object.","jn":"Memory is holding to mind-images of things perceived, without modifying them.","vv":"Memory is when the (Vrittis of) perceived subjects do not slip away (and through impressions come back to consciousness).","concepts":["smrti"]},{"id":"1.12","pada":1,"n":12,"group":2,"iast":"abhyāsavairāgyābhyāṃ tannirodhaḥ","deva":"अभ्यासवैराग्याभ्यां तन्निरोधः","en":"The restriction of them is by [means] of practice and passionlessness.","jn":"The control of these psychic activities comes through the right use of the will, and through ceasing from self-indulgence.","vv":"Their control is by practice and nonattachment.","concepts":["nirodha","abhyasa","vairagya"]},{"id":"1.13","pada":1,"n":13,"group":2,"iast":"tatra sthitau yatno 'bhyāsaḥ","deva":"तत्र स्थितौ यत्नो ऽभ्यासः","en":"Practice is [repeated] exertion to the end that [the mind-stuff] shall have permanence in this [restricted state].","jn":"The right use of the will is the steady, effort to stand in spiritual being.","vv":"Continuous struggle to keep them (the Vrittis) perfectly restrained is practice.","concepts":["abhyasa"]},{"id":"1.14","pada":1,"n":14,"group":2,"iast":"sa tu dīrghakālanairantaryasatkārāsevito dṛḍhabhūmiḥ","deva":"स तु दीर्घकालनैरन्तर्यसत्कारासेवितो दृढभूमिः","en":"But this [practice] becomes confirmed when it has been cultivated for a long time and uninterruptedly and with earnest attention.","jn":"This becomes a firm resting-place, when followed long, persistently, with earnestness.","vv":"It becomes firmly grounded by long constant efforts with great love (for the end to be attained).","concepts":[]},{"id":"1.15","pada":1,"n":15,"group":2,"iast":"dṛṣṭānuśravikaviṣayavitṛṣṇasya vaśīkārasaṃjñā vairāgyam","deva":"दृष्टानुश्रविकविषयवितृष्णस्य वशीकारसंज्ञा वैराग्यम्","en":"Passionlessness is the consciousness of being master on the part of one who has rid himself of thirst for either seen or revealed objects.","jn":"Ceasing from self-indulgence is conscious mastery over the thirst for sensuous pleasure here or hereafter.","vv":"That effect which comes to these who have given up their thirst after objects, either seen or heard, and which wills to control the objects, is non-attachment.","concepts":["vairagya"]},{"id":"1.16","pada":1,"n":16,"group":2,"iast":"tat paraṃ puruṣakhyāter guṇavaitṛṣṇyam","deva":"तत्परं पुरुषख्यातेर्गुणवैतृष्ण्यम्","en":"This [passionlessness] is highest when discernment of the Self results in thirstlessness for qualities [and not merely for objects].","jn":"The consummation of this is freedom from thirst for any mode of psychical activity, through the establishment of the spiritual man.","vv":"That is extreme non-attachment which gives up even the qualities, and comes from the knowledge of (the real nature of) the Purusha.","concepts":["purusa","guna"]},{"id":"1.17","pada":1,"n":17,"group":3,"iast":"vitarkavicārānandāsmitārūpānugamāt saṃprajñātaḥ","deva":"वितर्कविचारानन्दास्मितारूपानुगमात्संप्रज्ञातः","en":"[Concentration becomes] conscious [of its object] by assuming forms either of deliberation [upon coarse objects] or of reflection upon subtile objects or of joy or of the feeling-of-personality.","jn":"Meditation with an object follows these stages: first, exterior examining, then interior judicial action, then joy, then realization of individual being.","vv":"The concentration called right knowledge is that which is followed by reasoning, discrimination bliss, unqualified egoism.","concepts":["asmita","prajna"]},{"id":"1.18","pada":1,"n":18,"group":3,"iast":"virāmapratyayābhyāsapūrvaḥ saṃskāraśeṣo 'nyaḥ","deva":"विरामप्रत्ययाभ्यासपूर्वः संस्कारशेषो ऽन्यः","en":"The other [concentration which is not conscious of objects] consists of subliminal-impressions only [after objects have merged], and follows upon that practice which effects the cessation [of fluctuations].","jn":"After the exercise of the will has stilled the psychic activities, meditation rests only on the fruit of former meditations.","vv":"There is another Samadhi which is attained by the constant practice of cessation of all mental activity, in which the Chitta retains only the unmanifested impressions.","concepts":["abhyasa","samskara","pratyaya"]},{"id":"1.19","pada":1,"n":19,"group":4,"iast":"bhavapratyayo videhaprakṛtilayānām","deva":"भवप्रत्ययो विदेहप्रकृतिलयानाम्","en":"[Concentration not conscious of objects] caused by worldly [means] is the one to which the discarnate attain and to which those [whose bodies] are resolved into primary-matter attain.","jn":"Subjective consciousness arising from a natural cause is possessed by those who have laid aside their bodies and been absorbed into subjective nature.","vv":"(This Samadhi when not followed by extreme non-attachment) becomes the cause of the re-manifestation of the gods and of those that become merged in nature.","concepts":["prakrti","pratyaya"]},{"id":"1.20","pada":1,"n":20,"group":4,"iast":"śraddhāvīryasmṛtisamādhiprajñāpūrvaka itareṣām","deva":"श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम्","en":"[Concentration not conscious of objects,] which follows upon belief [and] energy [and] mindfulness [and] concentration [and] insight, is that to which the others [the yogins] attain.","jn":"For the others, there is spiritual consciousness, led up to by faith, valour, right mindfulness, one-pointedness, perception.","vv":"To others (this Samadhi) comes through faith, energy, memory, concentration, and discrimination of the real.","concepts":["smrti","prajna","samadhi"]},{"id":"1.21","pada":1,"n":21,"group":4,"iast":"tīvrasaṃvegānām āsannaḥ","deva":"तीव्रसंवेगानामासन्नः","en":"For the keenly intense, [concentration] is near.","jn":"Spiritual consciousness is nearest to those of keen, intense will.","vv":"Success is speedy for the extremely energetic.","concepts":[]},{"id":"1.22","pada":1,"n":22,"group":4,"iast":"mṛdumadhyādhimātratvāt tato 'pi viśeṣaḥ","deva":"मृदुमध्याधिमात्रत्वात्ततो ऽपि विशेषः","en":"Because [this keenness] is gentle or moderate or keen, there is a [concentration] superior even to this [near kind].","jn":"The will may be weak, or of middle strength, or intense.","vv":"The success of Yogis differs according as the means they adopt are mild, medium, or intense.","concepts":[]},{"id":"1.23","pada":1,"n":23,"group":4,"iast":"īśvarapraṇidhānād vā","deva":"ईश्वरप्रणिधानाद्वा","en":"Or [concentration] is attained by devotion to the Içvara.","jn":"Or spiritual consciousness may be gained by ardent service of the Master.","vv":"Or by devotion to Ishvara.","concepts":["isvara"]},{"id":"1.24","pada":1,"n":24,"group":5,"iast":"kleśakarmavipākāśayair aparāmṛṣṭaḥ puruṣaviśeṣa īśvaraḥ","deva":"क्लेशकर्मविपाकाशयैरपरामृष्टः पुरुषविशेष ईश्वरः","en":"Untouched by hindrances or karmas or fruition or by latent-deposits, the Içvara is a special kind of Self.","jn":"The Master is the spiritual man, who is free from hindrances, bondage to works, and the fruition and seed of works.","vv":"Ishvara (the Supreme Ruler) is a special Purusha, untouched by misery, actions, their results, and desires.","concepts":["isvara","klesa","karma","purusa"]},{"id":"1.25","pada":1,"n":25,"group":5,"iast":"tatra niratiśayaṃ sarvajñabījam","deva":"तत्र निरतिशयं सर्वज्ञबीजम्","en":"In this [Içvara] the germ of the omniscient is at its utmost excellence.","jn":"In the Master is the perfect seed of Omniscience.","vv":"In Him becomes infinite that all-knowingness which in others is (only) a germ.","concepts":["bija"]},{"id":"1.26","pada":1,"n":26,"group":5,"iast":"pūrveṣām api guruḥ kālenānavacchedāt","deva":"पूर्वेषामपि गुरुः कालेनानवच्छेदात्","en":"Teacher of the Primal [Sages] also, forasmuch as [with Him] there is no limitation by time.","jn":"He is the Teacher of all who have gone before, since he is not limited by Time.","vv":"He is the Teacher of even the ancient teachers, being not limited by time.","concepts":[]},{"id":"1.27","pada":1,"n":27,"group":5,"iast":"tasya vācakaḥ praṇavaḥ","deva":"तस्य वाचकः प्रणवः","en":"The word-expressing Him is the Mystic-syllable.","jn":"His word is OM.","vv":"His manifesting word is Om.","concepts":["pranava"]},{"id":"1.28","pada":1,"n":28,"group":5,"iast":"tajjapas tadarthabhāvanam","deva":"तज्जपस्तदर्थभावनम्","en":"Repetition of it and reflection upon its meaning [should be made].","jn":"Let there be soundless repetition of OM and meditation thereon.","vv":"The repetition of this (Om) and meditating on its meaning (is the way).","concepts":[]},{"id":"1.29","pada":1,"n":29,"group":6,"iast":"tataḥ pratyakcetanādhigamo 'py antarāyābhāvaś ca","deva":"ततः प्रत्यक्चेतनाधिगमो ऽप्यन्तरायाभावश्च","en":"Thereafter comes the right-knowledge of him who thinks in an inverse way, and the removal of obstacles.","jn":"Thence come the awakening of interior consciousness, and the removal of barriers.","vv":"From that is gained (the knowledge of) introspection, and the destruction of obstacles.","concepts":[]},{"id":"1.30","pada":1,"n":30,"group":6,"iast":"vyādhistyānasaṃśayapramādālasyāviratibhrāntidarśanālabdhabhūmikatvānavasthitatvāni cittavikṣepās te 'ntarāyāḥ","deva":"व्याधिस्त्यानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालब्धभूमिकत्वानवस्थितत्वानि चित्तविक्षेपास्ते ऽन्तरायाः","en":"Sickness and languor and doubt and heedlessness and worldliness and erroneous perception and failure to attain any stage [of concentration] and instability in the state [when attained] — these distractions of the mind-stuff are the obstacles.","jn":"The barriers to interior consciousness, which drive the psychic nature this way and that, are these: sickness, inertia, doubt, lightmindedness, laziness, intemperance, false notions, inability to reach a stage of meditation, or to hold it when reached.","vv":"Disease, mental laziness, doubt, lack of enthusiasm, lethargy, clinging to sense-enjoyments, false perception, non-attaining concentration, and falling away from the state when obtained, are the obstructing distractions.","concepts":["citta"]},{"id":"1.31","pada":1,"n":31,"group":6,"iast":"duḥkhadaurmanasyāṅgamejayatvaśvāsapraśvāsā vikṣepasahabhuvaḥ","deva":"दुःखदौर्मनस्याङ्गमेजयत्वश्वासप्रश्वासा विक्षेपसहभुवः","en":"Pain and despondency and unsteadiness of the body and inspiration and expiration are the accompaniments of the distractions.","jn":"Grieving, despondency, bodily restlessness, the drawing in and sending forth of the life-breath also contribute to drive the psychic nature to and fro.","vv":"Grief, mental distress, tremor of the body, irregular breathing, accompany non-retention of concentration.","concepts":["duhkha"]},{"id":"1.32","pada":1,"n":32,"group":6,"iast":"tatpratiṣedhārtham ekatattvābhyāsaḥ","deva":"तत्प्रतिषेधार्थमेकतत्त्वाभ्यासः","en":"To check them [let there be] practice upon a single entity.","jn":"Steady application to a principle is the way to put a stop to these.","vv":"To remedy this, the practice of one subject (should be made).","concepts":["abhyasa"]},{"id":"1.33","pada":1,"n":33,"group":6,"iast":"maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś cittaprasādanam","deva":"मैत्रीकरुणामुदितोपेक्षाणां सुखदुःखपुण्यापुण्यविषयाणां भावनातश्चित्तप्रसादनम्","en":"By the cultivation of friendliness towards happiness, and compassion towards pain, and joy towards merit, and indifference towards demerit.","jn":"By sympathy with the happy, compassion for the sorrowful, delight in the holy, disregard of the unholy, the psychic nature moves to gracious peace.","vv":"Friendship, mercy, gladness, and indifference, being thought of in regard to subjects, happy, unhappy, good, and evil respectively, pacify the Chitta.","concepts":["citta","duhkha","maitri"]},{"id":"1.34","pada":1,"n":34,"group":6,"iast":"pracchardanavidhāraṇābhyāṃ vā prāṇasya","deva":"प्रच्छर्दनविधारणाभ्यां वा प्राणस्य","en":"Or [the yogin attains the undisturbed calm of the mind-stuff] by expulsion and retention of breath.","jn":"Or peace may be reached by the even sending forth and control of the life-breath.","vv":"By throwing out and restraining the Breath.","concepts":["prana"]},{"id":"1.35","pada":1,"n":35,"group":7,"iast":"viṣayavatī vā pravṛttir utpannā manasaḥ sthitinibandhanī","deva":"विषयवती वा प्रवृत्तिरुत्पन्ना मनसः स्थितिनिबन्धनी","en":"Or [he gains stability when] a sense-activity arises connected with an object [and] bringing the central-organ into a relation of stability.","jn":"Faithful, persistent application to any object, if completely attained, will bind the mind to steadiness.","vv":"Those forms of concentration that bring extraordinary sense-perceptions cause perseverance of the mind.","concepts":["manas"]},{"id":"1.36","pada":1,"n":36,"group":7,"iast":"viśokā vā jyotiṣmatī","deva":"विशोका वा ज्योतिष्मती","en":"Or an undistressed [and] luminous [sense-activity when arisen brings the central-organ into a relation of stability].","jn":"As also will a joyful, radiant spirit.","vv":"Or (by the meditation on) the Effulgent Light, which is beyond all sorrow.","concepts":[]},{"id":"1.37","pada":1,"n":37,"group":7,"iast":"vītarāgaviṣayaṃ vā cittam","deva":"वीतरागविषयं वा चित्तम्","en":"Or the mind-stuff [reaches the stable state] by having as its object [a mind-stuff] freed from passion.","jn":"Or the purging of self-indulgence from the psychic nature.","vv":"Or (by meditation on) the heart that has given up all attachment to sense-objects.","concepts":["citta"]},{"id":"1.38","pada":1,"n":38,"group":7,"iast":"svapnanidrājñānālambanaṃ vā","deva":"स्वप्ननिद्राज्ञानालम्बनं वा","en":"Or [the mind-stuff reaches the stable state] by having as the supporting-object a perception in dream or in sleep.","jn":"Or a pondering on the perceptions gained in dreams and dreamless sleep.","vv":"Or by meditating on the knowledge that comes in sleep.","concepts":[]},{"id":"1.39","pada":1,"n":39,"group":7,"iast":"yathābhimatadhyānād vā","deva":"यथाभिमतध्यानाद्वा","en":"Or [the mind-stuff reaches the stable state] by contemplation upon any such an object as is desired.","jn":"Or meditative brooding on what is dearest to the heart.","vv":"Or by the meditation on anything that appeals to one as good.","concepts":["dhyana"]},{"id":"1.40","pada":1,"n":40,"group":8,"iast":"paramāṇuparamamahattvānto 'sya vaśīkāraḥ","deva":"परमाणुपरममहत्त्वान्तो ऽस्य वशीकारः","en":"His mastery extends from the smallest atom to the greatest magnitude.","jn":"Thus he masters all, from the atom to the Infinite.","vv":"The Yogi's mind thus meditating, becomes unobstructed from the atomic to the infinite.","concepts":[]},{"id":"1.41","pada":1,"n":41,"group":8,"iast":"kṣīṇavṛtter abhijātasyeva maṇer grahītṛgrahaṇagrāhyeṣu tatsthatadañjanatā samāpattiḥ","deva":"क्षीणवृत्तेरभिजातस्येव मणेर्ग्रहीतृग्रहणग्राह्येषु तत्स्थतदञ्जनता समापत्तिः","en":"[The mind-stuff] from which, as from a precious gem, fluctuations have dwindled away, reaches the balanced-state, which, in the case of the knower or of the process-of-knowing or of the object-to-be-known, is in the state of resting upon [one] of these [three] and in the state of being tinged by [one] of these [three].","jn":"When the perturbations of the psychic nature have all been stilled, then the consciousness, like a pure crystal, takes the colour of what it rests on, whether that be the perceiver, perceiving, or the thing perceived.","vv":"The Yogi whose Vrittis have thus become powerless (controlled) obtains in the receiver, (the instrument of) receiving, and the received (the Self, the mind, and external objects), concentratedness arid sameness like the crystal (before different coloured objects).","vvnote":"Printed 'concentratedness arid sameness'; 'arid' is a misprint for 'and' in the source text.","concepts":["vrtti","samapatti"]},{"id":"1.42","pada":1,"n":42,"group":8,"iast":"tatra śabdārthajñānavikalpaiḥ saṃkīrṇā savitarkā samāpattiḥ","deva":"तत्र शब्दार्थज्ञानविकल्पैः संकीर्णा सवितर्का समापत्तिः","en":"Of [these balanced-states] the state-balanced with deliberation is confused by reason of predicate-relations between words and intended-objects and ideas.","jn":"When the consciousness, poised in perceiving, blends together the name, the object dwelt on and the idea, this is perception with exterior consideration.","vv":"Sound, meaning, and resulting knowledge, being mixed up, is (called) Samadhi with question.","concepts":["vikalpa","samapatti"]},{"id":"1.43","pada":1,"n":43,"group":8,"iast":"smṛtipariśuddhau svarūpaśūnyevārthamātranirbhāsā nirvitarkā","deva":"स्मृतिपरिशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निर्वितर्का","en":"When the memory is quite purified, [that balanced-state] — which is, as it were, empty of itself and which brightens [into conscious knowledge] as the intended-object and nothing more — is super-deliberative.","jn":"When the object dwells in the mind, clear of memory-pictures, uncoloured by the mind, as a pure luminous idea, this is perception without exterior or consideration.","vv":"The Samadhi called \"without question\" (comes) when the memory is purified, or devoid of qualities, expressing only the meaning (of the meditated object).","concepts":["smrti"]},{"id":"1.44","pada":1,"n":44,"group":8,"iast":"etayaiva savicārā nirvicārā ca sūkṣmaviṣayā vyākhyātā","deva":"एतयैव सविचारा निर्विचारा च सूक्ष्मविषया व्याख्याता","en":"By this same [balanced-state] the reflective and the super-reflective [balanced-states] are also explained.","jn":"The same two steps, when referring to things of finer substance, are said to be with, or without, judicial action of the mind.","vv":"By this process (the concentrations) with discrimination and without discrimination, whose objects are finer, are (also) explained.","concepts":[]},{"id":"1.45","pada":1,"n":45,"group":8,"iast":"sūkṣmaviṣayatvaṃ cāliṅgaparyavasānam","deva":"सूक्ष्मविषयत्वं चालिङ्गपर्यवसानम्","en":"The subtile object also terminates in unresoluble-primary-matter (aliṅga).","jn":"Subtle substance rises in ascending degrees, to that pure nature which has no distinguishing mark.","vv":"The finer objects end with the Pradhâna.","concepts":[]},{"id":"1.46","pada":1,"n":46,"group":8,"iast":"tā eva sabījaḥ samādhiḥ","deva":"ता एव सबीजः समाधिः","en":"These same [balanced-states] are the seeded concentration.","jn":"The above are the degrees of limited and conditioned spiritual consciousness, still containing the seed of separateness.","vv":"These concentrations are with seed.","concepts":["bija","samadhi"]},{"id":"1.47","pada":1,"n":47,"group":8,"iast":"nirvicāravaiśāradye 'dhyātmaprasādaḥ","deva":"निर्विचारवैशारद्ये ऽध्यात्मप्रसादः","en":"When there is the clearness of the super-reflective [balanced-state, the yogin gains] internal undisturbed calm.","jn":"When pure perception without judicial action of the mind is reached, there follows the gracious peace of the inner self.","vv":"The concentration \"without discrimination\" being purified, the Chitta becomes firmly fixed.","concepts":[]},{"id":"1.48","pada":1,"n":48,"group":9,"iast":"ṛtaṃbharā tatra prajñā","deva":"ऋतंभरा तत्र प्रज्ञा","en":"In this [concentrated mind-stuff] the insight is truth-bearing.","jn":"In that peace, perception is unfailingly true.","vv":"The knowledge in that is called \"filled with Truth\".","concepts":["prajna"]},{"id":"1.49","pada":1,"n":49,"group":9,"iast":"śrutānumānaprajñābhyām anyaviṣayā viśeṣārthatvāt","deva":"श्रुतानुमानप्रज्ञाभ्यामन्यविषया विशेषार्थत्वात्","en":"Has another object than the insight resulting from things heard or from inferences, inasmuch as its intended-object is a particular.","jn":"The object of this perception is other than what is learned from the sacred books, or by sound inference, since this perception is particular.","vv":"The knowledge that is gained from testimony and inference is about common objects. That from the Samadhi just mentioned is of a much higher order, being able to penetrate where inference and testimony cannot go.","concepts":["prajna"]},{"id":"1.50","pada":1,"n":50,"group":9,"iast":"tajjaḥ saṃskāro 'nyasaṃskārapratibandhī","deva":"तज्जः संस्कारो ऽन्यसंस्कारप्रतिबन्धी","en":"The subliminal-impression produced by this [super-reflective balanced-state] is hostile to other subliminal-impressions.","jn":"The impress on the consciousness springing from this perception supersedes all previous impressions.","vv":"The resulting impression from this Samadhi obstructs all other impressions.","concepts":["samskara"]},{"id":"1.51","pada":1,"n":51,"group":9,"iast":"tasyāpi nirodhe sarvanirodhān nirbījaḥ samādhiḥ","deva":"तस्यापि निरोधे सर्वनिरोधान्निर्बीजः समाधिः","en":"When this [subliminal-impression] also is restricted, since all is restricted, [the yogin gains] seedless concentration.","jn":"When this impression ceases, then, since all impressions have ceased, there arises pure spiritual consciousness, with no seed of separateness left.","vv":"By the restraint of even this (impression, which obstructs all other impressions), all being restrained, comes the \"seedless\" Samadhi.","concepts":["nirodha","bija","samadhi"]},{"id":"2.1","pada":2,"n":1,"group":10,"iast":"tapaḥsvādhyāyeśvarapraṇidhānāni kriyāyogaḥ","deva":"तपःस्वाध्यायेश्वरप्रणिधानानि क्रियायोगः","en":"Self-castigation and study and devotion to the Içvara are the Yoga of action.","jn":"The practices which make for union with the Soul are: fervent aspiration, spiritual reading, and complete obedience to the Master.","vv":"Mortification, study, and surrendering fruits of work to God are called Kriyâ-yoga.","concepts":["isvara","tapas","svadhyaya"]},{"id":"2.2","pada":2,"n":2,"group":10,"iast":"samādhibhāvanārthaḥ kleśatanūkaraṇārthaś ca","deva":"समाधिभावनार्थः क्लेशतनूकरणार्थश्च","en":"For the cultivation of concentration and for the attenuation of the hindrances.","jn":"Their aim is, to bring soul-vision, and to wear away hindrances.","vv":"(It is for) the practice of Samadhi and minimising the pain-bearing obstructions.","concepts":["klesa","samadhi"]},{"id":"2.3","pada":2,"n":3,"group":10,"iast":"avidyāsmitārāgadveṣābhiniveśāḥ kleśāḥ","deva":"अविद्यास्मितारागद्वेषाभिनिवेशाः क्लेशाः","en":"Undifferentiated-consciousness (avidyā) and the feeling-of-personality and passion and aversion and the will-to-live are the five hindrances.","jn":"These are the hindrances: the darkness of unwisdom, self-assertion, lust hate, attachment.","vv":"The pain-bearing obstructions are — ignorance, egoism, attachment, aversion and clinging to life.","concepts":["klesa","avidya","asmita"]},{"id":"2.4","pada":2,"n":4,"group":10,"iast":"avidyā kṣetram uttareṣāṃ prasuptatanuvicchinnodārāṇām","deva":"अविद्या क्षेत्रमुत्तरेषां प्रसुप्ततनुविच्छिन्नोदाराणाम्","en":"Undifferentiated-consciousness is the field for the others whether they be dormant or attenuated or intercepted or sustained.","jn":"The darkness of unwisdom is the field of the others. These hindrances may be dormant, or worn thin, or suspended, or expanded.","vv":"Ignorance is the productive field of all these that follow, whether they are dormant, attenuated, overpowered, or expanded.","concepts":["avidya"]},{"id":"2.5","pada":2,"n":5,"group":10,"iast":"anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā","deva":"अनित्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मख्यातिरविद्या","en":"The recognition of the permanent, of the pure, of pleasure, and of a self in what is impermanent, impure, pain, and not-self is undifferentiated-consciousness (avidyā).","jn":"The darkness of ignorance is: holding that which is unenduring, impure, full of pain, not the Soul, to be eternal, pure, full of joy, the Soul.","vv":"Ignorance is taking the non-eternal, the impure, the painful, and the non-Self for the eternal, the pure, the happy, and the Âtman or Self (respectively).","concepts":["avidya","duhkha"]},{"id":"2.6","pada":2,"n":6,"group":10,"iast":"dṛgdarśanaśaktyor ekātmatevāsmitā","deva":"दृग्दर्शनशक्त्योरेकात्मतेवास्मिता","en":"When the power of seeing and the power by which one sees have the appearance of being a single self, [this is] the feeling-of-personality.","jn":"Self-assertion comes from thinking of the Seer and the instrument of vision as forming one self.","vv":"Egoism is the identification of the seer with the instrument of seeing.","concepts":["asmita"]},{"id":"2.7","pada":2,"n":7,"group":10,"iast":"sukhānuśayī rāgaḥ","deva":"सुखानुशयी रागः","en":"Passion is that which dwells upon pleasure.","jn":"Lust is the resting in the sense of enjoyment.","vv":"Attachment is that which dwells on pleasure.","concepts":[]},{"id":"2.8","pada":2,"n":8,"group":10,"iast":"duḥkhānuśayī dveṣaḥ","deva":"दुःखानुशयी द्वेषः","en":"Aversion is that which dwells upon pain.","jn":"Hate is the resting in the sense of pain.","vv":"Aversion is that which dwells on pain.","concepts":["duhkha"]},{"id":"2.9","pada":2,"n":9,"group":10,"iast":"svarasavāhī viduṣo 'pi tathā rūḍho 'bhiniveśaḥ","deva":"स्वरसवाही विदुषो ऽपि तथा रूढो ऽभिनिवेशः","en":"The will-to-live sweeping on [by the force of] its own nature exists in this form even in the wise.","jn":"Attachment is the desire toward life, even in the wise, carried forward by its own energy.","vv":"Flowing through its own nature, and established even in the learned, is the clinging to life.","concepts":[]},{"id":"2.10","pada":2,"n":10,"group":10,"iast":"te pratiprasavaheyāḥ sūkṣmāḥ","deva":"ते प्रतिप्रसवहेयाः सूक्ष्माः","en":"These [hindrances when they have become subtile] are to be escaped by the inverse-propagation.","jn":"These hindrances, when they have become subtle, are to be removed by a countercurrent.","vv":"The fine Samskaras are to be conquered by resolving them into their causal state.","concepts":[]},{"id":"2.11","pada":2,"n":11,"group":10,"iast":"dhyānaheyās tadvṛttayaḥ","deva":"ध्यानहेयास्तद्वृत्तयः","en":"The fluctuations of these should be escaped by means of contemplation.","jn":"Their active turnings are to be removed by meditation.","vv":"By meditation, their (gross) modifications are to be rejected.","concepts":["vrtti","dhyana"]},{"id":"2.12","pada":2,"n":12,"group":11,"iast":"kleśamūlaḥ karmāśayo dṛṣṭādṛṣṭajanmavedanīyaḥ","deva":"क्लेशमूलः कर्माशयो दृष्टादृष्टजन्मवेदनीयः","en":"The latent-deposit of karma has its root in the hindrances and may be felt in a birth seen or in a birth unseen.","jn":"The burden of bondage to sorrow has its root in these hindrances. It will be felt in this life, or in a life not yet manifested.","vv":"The \"receptacle of works\" has its root in these pain-bearing obstructions, and their experience is in this visible life, or in the unseen life.","concepts":["klesa","karma"]},{"id":"2.13","pada":2,"n":13,"group":11,"iast":"sati mūle tadvipāko jātyāyurbhogāḥ","deva":"सति मूले तद्विपाको जात्यायुर्भोगाः","en":"So long as the root exists, there will be fruition from it [that is] birth [and] length-of-life [and] kind-of-experience.","jn":"From this root there grow and ripen the fruits of birth, of the life-span, of all that is tasted in life.","vv":"The root being there, the fruition comes (in the form of) species, life, and experience of pleasure and pain.","concepts":[]},{"id":"2.14","pada":2,"n":14,"group":11,"iast":"te hlādaparitāpaphalāḥ puṇyāpuṇyahetutvāt","deva":"ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात्","en":"These [fruitions] have joy or extreme anguish as results in accordance with the quality of their causes whether merit or demerit.","jn":"These bear fruits of rejoicing, or of affliction, as they are sprung from holy or unholy works.","vv":"They bear fruit as pleasure or pain, caused by virtue or vice.","concepts":[]},{"id":"2.15","pada":2,"n":15,"group":12,"iast":"pariṇāmatāpasaṃskāraduḥkhair guṇavṛttivirodhāc ca duḥkham eva sarvaṃ vivekinaḥ","deva":"परिणामतापसंस्कारदुःखैर्गुणवृत्तिविरोधाच्च दुःखमेव सर्वं विवेकिनः","en":"As being the pains which are mutations and anxieties and subliminal-impressions, and by reason of the opposition of the fluctuations of the aspects (guṇa), — to the discriminating all is nothing but pain.","jn":"To him who possesses discernment, all personal life is misery, because it ever waxes and wanes, is ever afflicted with restlessness, makes ever new dynamic impresses in the mind; and because all its activities war with each other.","vv":"To the discriminating, all is, as it were, painful on account of everything bringing pain either as consequence, or as anticipation of loss of happiness, or as fresh craving arising from impressions of happiness, and also as counteraction of qualities.","concepts":["vrtti","duhkha","samskara","guna","viveka","parinama"]},{"id":"2.16","pada":2,"n":16,"group":13,"iast":"heyaṃ duḥkham anāgatam","deva":"हेयं दुःखमनागतम्","en":"That which is to be escaped is pain yet to come.","jn":"This pain is to be warded off, before it has come.","vv":"The misery which is not yet come is to be avoided.","concepts":["duhkha"]},{"id":"2.17","pada":2,"n":17,"group":14,"iast":"draṣṭṛdṛśyayoḥ saṃyogo heyahetuḥ","deva":"द्रष्टृदृश्ययोः संयोगो हेयहेतुः","en":"The correlation of the Seer and the object-of-sight is the cause of that which is to be escaped.","jn":"The cause of what is to be warded off, is the absorption of the Seer in things seen.","vv":"The cause of that which is to be avoided is the junction of the seer and the seen.","concepts":["drastr","drsya"]},{"id":"2.18","pada":2,"n":18,"group":14,"iast":"prakāśakriyāsthitiśīlaṃ bhūtendriyātmakaṃ bhogāpavargārthaṃ dṛśyam","deva":"प्रकाशक्रियास्थितिशीलं भूतेन्द्रियात्मकं भोगापवर्गार्थं दृश्यम्","en":"With a disposition to brightness and to activity and to inertia, and with the elements and the organs as its essence, and with its purpose the experience and the liberation [of the Self], — this is the object-of-sight.","jn":"Things seen have as their property manifestation, action, inertia. They form the basis of the elements and the sense-powers. They make for experience and for liberation.","vv":"The experienced is composed of elements and organs, is of the nature of illumination, action, and inertia, and is for the purpose of experience and release (of the experiencer).","concepts":["drsya"]},{"id":"2.19","pada":2,"n":19,"group":14,"iast":"viśeṣāviśeṣaliṅgamātrāliṅgāni guṇaparvāṇi","deva":"विशेषाविशेषलिङ्गमात्रालिङ्गानि गुणपर्वाणि","en":"The particularized and the unparticularized [forms] and the resoluble only [into primary matter] and irresoluble-primary-matter — are the divisions of the aspects (guṇa).","jn":"The grades or layers of the Three Potencies are the defined, the undefined, that with distinctive mark, that without distinctive mark.","vv":"The states of the qualities are the defined, the undefined, the indicated only, and the signless.","concepts":["guna"]},{"id":"2.20","pada":2,"n":20,"group":14,"iast":"draṣṭā dṛśimātraḥ śuddho 'pi pratyayānupaśyaḥ","deva":"द्रष्टा दृशिमात्रः शुद्धो ऽपि प्रत्ययानुपश्यः","en":"The Seer who is nothing but [the power of seeing], although undefiled (çuddha), looks upon the presented idea.","jn":"The Seer is pure vision. Though pure, he looks out through the vesture of the mind.","vv":"The seer is intelligence only, and though pure, sees through the colouring of the intellect.","concepts":["drastr","pratyaya"]},{"id":"2.21","pada":2,"n":21,"group":14,"iast":"tadartha eva dṛśyasyātmā","deva":"तदर्थ एव दृश्यस्यात्मा","en":"The object-of-sight is only for the sake of it [the Self].","jn":"The very essence of things seen is, that they exist for the Seer.","vv":"The nature of the experienced is for him.","concepts":["drsya"]},{"id":"2.22","pada":2,"n":22,"group":14,"iast":"kṛtārthaṃ prati naṣṭam apy anaṣṭaṃ tadanyasādhāraṇatvāt","deva":"कृतार्थं प्रति नष्टमप्यनष्टं तदन्यसाधारणत्वात्","en":"Though it has ceased [to be seen] in the case of one whose purpose is accomplished, it has not ceased to be, since it is common to others [besides himself].","jn":"Though fallen away from him who has reached the goal, things seen have not alto fallen away, since they still exist for others.","vv":"Though destroyed for him whose goal has been gained, yet it is not destroyed, being common to others.","concepts":[]},{"id":"2.23","pada":2,"n":23,"group":14,"iast":"svasvāmiśaktyoḥ svarūpopalabdhihetuḥ saṃyogaḥ","deva":"स्वस्वामिशक्त्योः स्वरूपोपलब्धिहेतुः संयोगः","en":"The reason for the apperception of what the power of the property and of what the power of the proprietor are, is correlation.","jn":"The association of the Seer with things seen is the cause of the realizing of the nature of things seen, and also of the realizing of the nature of the Seer.","vv":"Junction is the cause of the realization of the nature of both the powers, the experienced and its Lord.","concepts":[]},{"id":"2.24","pada":2,"n":24,"group":14,"iast":"tasya hetur avidyā","deva":"तस्य हेतुरविद्या","en":"The reason for this [correlation] is undifferentiated-consciousness (avidyā).","jn":"The cause of this association is the darkness of unwisdom.","vv":"Ignorance is its cause.","concepts":["avidya"]},{"id":"2.25","pada":2,"n":25,"group":15,"iast":"tadabhāvāt saṃyogābhāvo hānaṃ taddṛśeḥ kaivalyam","deva":"तदभावात्संयोगाभावो हानं तद्दृशेः कैवल्यम्","en":"Since this [non-sight] does not exist, there is no correlation. This is the escape, the Isolation of the Seer.","jn":"The bringing of this association to an end, by bringing the darkness of unwisdom to an end, is the great liberation; this is the Seer’s attainment of his own pure being.","vv":"There being absence of that (ignorance) there is absence of junction, which is the thing-to-be avoided; that is the independence of the seer.","concepts":["kaivalya"]},{"id":"2.26","pada":2,"n":26,"group":16,"iast":"vivekakhyātir aviplavā hānopāyaḥ","deva":"विवेकख्यातिरविप्लवा हानोपायः","en":"The means of attaining escape is unwavering discriminative discernment.","jn":"A discerning which is carried on without wavering is the means of liberation.","vv":"The means of destruction of ignorance is unbroken practice of discrimination.","concepts":["viveka"]},{"id":"2.27","pada":2,"n":27,"group":16,"iast":"tasya saptadhā prāntabhūmiḥ prajñā","deva":"तस्य सप्तधा प्रान्तभूमिः प्रज्ञा","en":"For him [there is] insight sevenfold and advancing in stages to the highest.","jn":"His illuminations is sevenfold, rising In successive stages.","vv":"His knowledge is of the sevenfold highest ground.","concepts":["prajna"]},{"id":"2.28","pada":2,"n":28,"group":17,"iast":"yogāṅgānuṣṭhānād aśuddhikṣaye jñānadīptir ā vivekakhyāteḥ","deva":"योगाङ्गानुष्ठानादशुद्धिक्षये ज्ञानदीप्तिरा विवेकख्यातेः","en":"After the aids to yoga have been followed up, when the impurity has dwindled, there is an enlightenment of perception reaching up to the discriminative discernment.","jn":"From steadfastly following after the means of Yoga, until impurity is worn away, there comes the illumination of thought up to full discernment.","vv":"By the practice of the different parts of Yoga the impurities being destroyed, knowledge becomes effulgent up to discrimination.","concepts":["viveka"]},{"id":"2.29","pada":2,"n":29,"group":17,"iast":"yamaniyamāsanaprāṇāyāmapratyāhāradhāraṇādhyānasamādhayo 'ṣṭāv aṅgāni","deva":"यमनियमासनप्राणायामप्रत्याहारधारणाध्यानसमाधयो ऽष्टावङ्गानि","en":"Abstentions and observances and postures and regulations-of-the-breath and withdrawal-of-the-senses and fixed-attention and contemplation and concentration.","jn":"The eight means of Yoga are: the Commandments, the Rules, right Poise, right Control of the life-force, Withdrawal, Attention, Meditation, Contemplation.","vv":"Yama, Niyama, Âsana, Prânâyâama, Pratyâhâra, Dhâranâ, Dhyâna, and Samâdhi are the eight limbs of Yoga.","concepts":["samadhi","yama","niyama","asana","prana","pratyahara","dharana","dhyana"]},{"id":"2.30","pada":2,"n":30,"group":18,"iast":"ahiṃsāsatyāsteyabrahmacaryāparigrahā yamāḥ","deva":"अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः","en":"Abstinence from injury and from falsehood and from theft and from incontinence and from acceptance of gifts are the abstentions.","jn":"The Commandments are these: nom injury, truthfulness, abstaining from stealing, from impurity, from covetousness.","vv":"Non-killing, truthfulness, non-stealing, continence, and nor-receiving are called Yamas.","vvnote":"Printed 'nor-receiving'; presumably 'non-receiving' (aparigraha), kept as printed.","jnote":"Gutenberg prints “nom injury”; read “non-injury”.","concepts":["yama","ahimsa"]},{"id":"2.31","pada":2,"n":31,"group":18,"iast":"jātideśakālasamayānavacchinnāḥ sārvabhaumā mahāvratam","deva":"जातिदेशकालसमयानवच्छिन्नाः सार्वभौमा महाव्रतम्","en":"When they are unqualified by species or place or time or exigency and when [covering] all [these] classes — there is the Great Course-of-conduct.","jn":"The Commandments, not limited to any race, place, time or occasion, universal, are the great obligation.","vv":"These, unbroken by time, place, purpose, and caste-rules, are (universal) great vows.","concepts":[]},{"id":"2.32","pada":2,"n":32,"group":19,"iast":"śaucasaṃtoṣatapaḥsvādhyāyeśvarapraṇidhānāni niyamāḥ","deva":"शौचसंतोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः","en":"Cleanliness and contentment and self-castigation and study and devotion to the Içvara are the observances.","jn":"The Rules are these: purity, serenity fervent aspiration, spiritual reading, and per feet obedience to the Master.","vv":"Internal and external purification, contentment, mortification, study, and worship of God are the Niyamas.","concepts":["isvara","niyama","tapas","svadhyaya"]},{"id":"2.33","pada":2,"n":33,"group":20,"iast":"vitarkabādhane pratipakṣabhāvanam","deva":"वितर्कबाधने प्रतिपक्षभावनम्","en":"If there be inhibition by perverse-considerations, there should be cultivation of the opposites.","jn":"When transgressions hinder, the weight of the imagination should be thrown’ on the opposite side.","vv":"To obstruct thoughts which are inimical to Yoga, contrary thoughts should be brought.","concepts":[]},{"id":"2.34","pada":2,"n":34,"group":20,"iast":"vitarkā hiṃsādayaḥ kṛtakāritānumoditā lobhakrodhamohapūrvakā mṛdumadhyādhimātrā duḥkhājñānānantaphalā iti pratipakṣabhāvanam","deva":"वितर्का हिंसादयः कृतकारितानुमोदिता लोभक्रोधमोहपूर्वका मृदुमध्याधिमात्रा दुःखाज्ञानानन्तफला इति प्रतिपक्षभावनम्","en":"Since perverse-considerations such as injuries, whether done or caused to be done or approved, whether ensuing upon greed or anger or infatuation, whether mild or moderate or vehement, find their unending consequences in pain and lack of thinking, there should be the cultivation of their opposites.","jn":"Transgressions are injury, falsehood, theft, incontinence, envy; whether committed, or caused, or assented to, through greed, wrath, or infatuation; whether faint, or middling, or excessive; bearing endless, fruit of ignorance and pain. Therefore must the weight be cast on the other side.","vv":"The obstructions to Yoga are killing, falsehood, etc., whether committed, caused, or approved; either through avarice, or anger, or ignorance; whether slight, middling, or great; and they result in infinite ignorance and misery. This is (the method of) thinking the contrary.","concepts":["duhkha","ahimsa"]},{"id":"2.35","pada":2,"n":35,"group":20,"iast":"ahiṃsāpratiṣṭhāyāṃ tatsaṃnidhau vairatyāgaḥ","deva":"अहिंसाप्रतिष्ठायां तत्संनिधौ वैरत्यागः","en":"As soon as he is grounded in abstinence from injury, his presence begets a suspension of enmity.","jn":"Where non-injury is perfected, all enmity ceases in the presence of him who possesses it.","vv":"Non-killing being established, in his presence all enmities cease (in others).","concepts":["ahimsa"]},{"id":"2.36","pada":2,"n":36,"group":20,"iast":"satyapratiṣṭhāyāṃ kriyāphalāśrayatvam","deva":"सत्यप्रतिष्ठायां क्रियाफलाश्रयत्वम्","en":"As soon as he is grounded in abstinence from falsehood, actions and consequences depend upon him.","jn":"When he is perfected in truth, all acts and their fruits depend on him.","vv":"By the establishment of truthfulness the Yogi gets the power of attaining for himself and others the fruits of work without the works.","concepts":[]},{"id":"2.37","pada":2,"n":37,"group":20,"iast":"asteyapratiṣṭhāyāṃ sarvaratnopasthānam","deva":"अस्तेयप्रतिष्ठायां सर्वरत्नोपस्थानम्","en":"As soon as he is grounded in abstinence from theft, all jewels approach him.","jn":"Where cessation from theft is perfected, all treasures present themselves to him who possesses it.","vv":"By the establishment of non-stealing all wealth comes to the Yogi.","concepts":[]},{"id":"2.38","pada":2,"n":38,"group":20,"iast":"brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ","deva":"ब्रह्मचर्यप्रतिष्ठायां वीर्यलाभः","en":"As soon as he is grounded in abstinence from incontinence, he acquires energy.","jn":"For him who is perfect in continence, the reward is valour a
