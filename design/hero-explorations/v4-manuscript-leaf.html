<head>

<title>Ekatāna hero mock v4</title>
<style>
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-opsz-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-ext-opsz-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;src:url(fonts/literata-latin-opsz-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Tiro Devanagari Sanskrit';font-weight:400;src:url(fonts/tiro-devanagari-sanskrit-devanagari-400-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}

:root{
  --navy:#0b1230; --gold:#dcb257; --paper:#efe8d6; --muted:#d3cdbd; --dim:#a9a593;
  --leaf:#e3c37e; --leaf-d:#c9a35c; --ink:#1d140a; --red:#a3391f; --edge:#4a3214;
  --serif:'Literata',Georgia,serif; --deva:'Tiro Devanagari Sanskrit',serif;
  --gut:clamp(20px,3.8vw,64px);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--navy);color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{overflow-x:clip}
a{color:inherit}

.stage{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#0b1230 url(img/sky2.webp) center/cover no-repeat}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(180deg,rgba(7,11,34,.92) 0,rgba(7,11,34,.5) 11%,rgba(7,11,34,0) 24%),
  linear-gradient(90deg,rgba(7,11,34,.74) 0,rgba(7,11,34,.52) 38%,rgba(7,11,34,0) 64%),
  radial-gradient(120% 90% at 50% 50%,rgba(8,12,38,.15) 45%,rgba(5,8,28,.55) 100%)}

.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:clamp(20px,3.2vw,52px) var(--gut) 0}
.mark{font-size:clamp(24px,2vw,32px);color:var(--gold);text-decoration:none}
.nav{display:flex;gap:clamp(18px,2.2vw,38px);font-size:clamp(13px,.95vw,16px)}
.nav a{text-decoration:none;opacity:.9;padding:.3em 0;background:linear-gradient(var(--gold),var(--gold)) left bottom/0 1px no-repeat;transition:background-size .25s,color .2s}
.nav a:hover{color:var(--gold);background-size:100% 1px}

.lead{position:relative;z-index:5;width:min(50vw,880px);margin:clamp(40px,9vh,110px) 0 0 var(--gut)}
.intro h1{text-wrap:balance;font-weight:400;font-size:clamp(30px,3.1vw,56px);line-height:1.08;letter-spacing:-.01em}
.intro p{margin-top:.9em;font-size:clamp(15px,1.15vw,19px);line-height:1.6;color:var(--muted);max-width:33em}

/* reading card */
.next{margin-top:clamp(40px,7vh,72px);max-width:820px}
.next-h{display:flex;align-items:baseline;justify-content:space-between;gap:1em;margin-bottom:14px;font-size:clamp(13px,.95vw,15px)}
.next-h .k{color:var(--gold)}
.next-h .s{color:var(--dim)}
.card{display:block;text-decoration:none;color:inherit;container-type:inline-size}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:12px}

/* a single pothi leaf: long and narrow, red bounding bands at both ends,
   one stringing hole offset to the left with a red ring and blank space around it */
.leaf{position:relative;display:flex;align-items:center;min-height:72px;width:fit-content;min-width:min(100%,360px);max-width:100%;
  border:1.25px solid var(--edge);border-radius:12px/50%;
  background:
    linear-gradient(180deg,rgba(255,244,210,.16),rgba(255,244,210,0) 22%,rgba(120,80,25,0) 76%,rgba(120,80,25,.14)),
    repeating-linear-gradient(180deg,transparent 0 7px,rgba(110,72,24,.10) 7px 8px),
    var(--leaf);
  box-shadow:0 4px 0 -1.5px #a7803f,0 4px 0 -.25px var(--edge);
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.leaf::before{content:"";position:absolute;inset:0;border-radius:inherit;background:url(img/leaf-fibre.webp) center/100% 100%;opacity:.13;mix-blend-mode:multiply;pointer-events:none}
.card:hover .leaf{transform:translateY(-3px);box-shadow:0 6px 0 -1.5px #a7803f,0 6px 0 -.25px var(--edge)}
.band{flex:none;align-self:center;height:calc(100% - 22px);margin:0;width:12px;border-left:1.25px solid var(--red);border-right:1.25px solid var(--red);background:rgba(163,57,31,.18)}
.band.a{margin-left:24px}
.band.b{margin-right:24px}
.num{position:absolute;left:46px;top:50%;transform:translateY(-50%);font-family:var(--deva);font-size:14px;color:var(--red)}
.holeslot{flex:none;width:clamp(56px,5.4vw,88px);display:grid;place-items:center}
.hole{width:clamp(22px,1.9vw,32px);aspect-ratio:1;border-radius:50%;border:1.25px solid var(--red);display:grid;place-items:center;background:rgba(163,57,31,.08)}
.hole::after{content:"";width:42%;aspect-ratio:1;border-radius:50%;background:var(--navy);box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.line{flex:1;min-width:0;text-align:center;padding:14px 58px}
.sutra{font-family:var(--deva);color:var(--ink);font-size:32px;line-height:1.3;display:block;text-wrap:balance;overflow-wrap:anywhere}

.meta{margin-top:18px;padding-left:2px}
.meta .iast{overflow-wrap:anywhere;font-style:italic;color:var(--gold);font-size:clamp(15px,1.15vw,19px)}
.meta .en{overflow-wrap:break-word;color:var(--paper);font-size:clamp(16px,1.25vw,21px);line-height:1.5;margin-top:.25em;max-width:34em}
.meta .en .sup{color:var(--dim)}
.meta .src{color:var(--dim);font-size:clamp(12px,.85vw,14px);margin-top:.4em}

.act{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px);margin-top:clamp(26px,3.6vh,38px);flex-wrap:wrap}
.btn{font-family:var(--serif);font-size:clamp(14px,1.05vw,18px);padding:.85em 1.7em;border-radius:7px;text-decoration:none;border:1px solid var(--gold);transition:background .2s}
.btn.p{background:rgba(11,18,48,.45);color:var(--gold);font-weight:500}
.btn.p:hover,.card:hover~.act .btn.p{background:rgba(220,178,87,.14)}
.lnk{font-size:clamp(14px,1.02vw,17px);color:var(--muted);text-decoration:underline;text-decoration-color:rgba(220,178,87,.55);text-underline-offset:4px}
.lnk:hover{color:var(--gold)}

.yogi-box{position:absolute;z-index:3;right:0;bottom:0;width:min(42vw,800px)}
.yogi{display:block;width:100%;height:auto;transform:scaleX(-1)}

@container (max-width:460px){ .num{display:none} .line{padding:12px 14px} .sutra{font-size:24px} .band.a{margin-left:16px} .band.b{margin-right:16px} }
@media (min-width:821px) and (max-width:1200px){ .lead{width:64vw} }
@media (max-width:820px){
  .nav a:not(:last-child){display:none}
  .lead{width:auto;margin:36px var(--gut) 0}
  .intro h1{font-size:clamp(28px,7.6vw,40px)}
  .intro p{font-size:15.5px}
  .next-h{flex-direction:column;gap:2px}
  .act .btn{flex:1 1 100%;text-align:center}
  .yogi-box{position:relative;width:auto;height:clamp(200px,58vw,320px);overflow:hidden;margin:30px 0 0;z-index:3}
  .yogi{position:absolute;right:-6%;top:0;width:112%;max-width:none}
  .stage{min-height:0}
}
</style>
</head>
<body>
<main class="stage">
  <header class="top">
    <a class="mark" href="#">Ekatāna</a>
    <nav class="nav"><a href="#">Read</a><a href="#">Concepts</a><a href="#">Gītā</a><a href="#">Visuals</a><a href="#">Patañjali</a><a href="#">Ask</a></nav>
  </header>

  <div class="lead">
    <section class="intro">
      <h1>A connected reader for Patañjali’s Yoga&nbsp;Sūtra.</h1>
      <p>All 195 sūtras in Sanskrit, with three public-domain translations, linked by the words they share.</p>
    </section>

    <section class="next" aria-labelledby="next-k">
      <div class="next-h"><span class="k" id="next-k"></span><span class="s" id="next-s"></span></div>
      <a class="card" id="card" href="#">
        <div class="leaf">
          <span class="band a"></span>
          <span class="num" lang="sa" id="num"></span>
          <span class="line"><span class="sutra" lang="sa" id="deva"></span></span>
          <span class="band b"></span>
        </div>
        <div class="meta">
          <div class="iast" lang="sa-Latn" id="iast"></div>
          <div class="en" id="en"></div>
          <div class="src">J. H. Woods, 1914</div>
        </div>
      </a>
    </section>

    <div class="act">
      <a class="btn p" id="go" href="#"></a>
      <a class="lnk" id="alt" href="#"></a>
      <a class="lnk" href="#">Ask a question</a>
    </div>
  </div>

  <div class="yogi-box"><img class="yogi" id="yogi" src="img/yogi.webp" alt="A seated yogi in profile with a thin gold halo"></div>
</main>

<script>
const SUTRAS = {"1.1": {"pada": "Samādhi-pāda", "deva": "अथ योगानुशासनम्", "iast": "atha yogānuśāsanam", "en": "Now the exposition of yoga [is to be made]."}, "1.2": {"pada": "Samādhi-pāda", "deva": "योगश्चित्तवृत्तिनिरोधः", "iast": "yogaś cittavṛttinirodhaḥ", "en": "Yoga is the restriction of the fluctuations of mind-stuff."}, "1.3": {"pada": "Samādhi-pāda", "deva": "तदा द्रष्टुः स्वरूपे ऽवस्थानम्", "iast": "tadā draṣṭuḥ svarūpe 'vasthānam", "en": "Then the Seer [that is, the Self] abides in himself."}, "1.4": {"pada": "Samādhi-pāda", "deva": "वृत्तिसारूप्यमितरत्र", "iast": "vṛttisārūpyam itaratra", "en": "At other times it [the Self] takes the same form as the fluctuations [of mind-stuff]."}, "1.5": {"pada": "Samādhi-pāda", "deva": "वृत्तयः पञ्चतय्यः क्लिष्टाक्लिष्टाः", "iast": "vṛttayaḥ pañcatayyaḥ kliṣṭākliṣṭāḥ", "en": "The fluctuations are of five kinds and are hindered or unhindered."}, "1.6": {"pada": "Samādhi-pāda", "deva": "प्रमाणविपर्ययविकल्पनिद्रास्मृतयः", "iast": "pramāṇaviparyayavikalpanidrāsmṛtayaḥ", "en": "Sources-of-valid-ideas and misconceptions and predicate-relations and sleep and memory."}, "1.7": {"pada": "Samādhi-pāda", "deva": "प्रत्यक्षानुमानागमाः प्रमाणानि", "iast": "pratyakṣānumānāgamāḥ pramāṇāni", "en": "Sources-of-valid-ideas are perception and inference and verbal-communication."}, "1.8": {"pada": "Samādhi-pāda", "deva": "विपर्ययो मिथ्याज्ञानमतद्रूपप्रतिष्ठम्", "iast": "viparyayo mithyājñānam atadrūpapratiṣṭham", "en": "Misconception is an erroneous idea not based on that form [in respect of which the misconception is entertained]."}, "1.9": {"pada": "Samādhi-pāda", "deva": "शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः", "iast": "śabdajñānānupātī vastuśūnyo vikalpaḥ", "en": "The predicate-relation (vikalpa) is without any [corresponding perceptible] object and follows as a result of perception or of words."}, "1.10": {"pada": "Samādhi-pāda", "deva": "अभावप्रत्ययालम्बना वृत्तिर्निद्रा", "iast": "abhāvapratyayālambanā vṛttir nidrā", "en": "Sleep is a fluctuation of [mind-stuff] supported by the cause of the [transient] negation [of the waking and the dreaming fluctuations]."}, "1.11": {"pada": "Samādhi-pāda", "deva": "अनुभूतविषयासंप्रमोषः स्मृतिः", "iast": "anubhūtaviṣayāsaṃpramoṣaḥ smṛtiḥ", "en": "Memory is not-adding-surreptitiously to a once experienced object."}, "1.12": {"pada": "Samādhi-pāda", "deva": "अभ्यासवैराग्याभ्यां तन्निरोधः", "iast": "abhyāsavairāgyābhyāṃ tannirodhaḥ", "en": "The restriction of them is by [means] of practice and passionlessness."}, "1.13": {"pada": "Samādhi-pāda", "deva": "तत्र स्थितौ यत्नो ऽभ्यासः", "iast": "tatra sthitau yatno 'bhyāsaḥ", "en": "Practice is [repeated] exertion to the end that [the mind-stuff] shall have permanence in this [restricted state]."}, "1.14": {"pada": "Samādhi-pāda", "deva": "स तु दीर्घकालनैरन्तर्यसत्कारासेवितो दृढभूमिः", "iast": "sa tu dīrghakālanairantaryasatkārāsevito dṛḍhabhūmiḥ", "en": "But this [practice] becomes confirmed when it has been cultivated for a long time and uninterruptedly and with earnest attention."}, "1.15": {"pada": "Samādhi-pāda", "deva": "दृष्टानुश्रविकविषयवितृष्णस्य वशीकारसंज्ञा वैराग्यम्", "iast": "dṛṣṭānuśravikaviṣayavitṛṣṇasya vaśīkārasaṃjñā vairāgyam", "en": "Passionlessness is the consciousness of being master on the part of one who has rid himself of thirst for either seen or revealed objects."}, "1.16": {"pada": "Samādhi-pāda", "deva": "तत्परं पुरुषख्यातेर्गुणवैतृष्ण्यम्", "iast": "tat paraṃ puruṣakhyāter guṇavaitṛṣṇyam", "en": "This [passionlessness] is highest when discernment of the Self results in thirstlessness for qualities [and not merely for objects]."}, "1.17": {"pada": "Samādhi-pāda", "deva": "वितर्कविचारानन्दास्मितारूपानुगमात्संप्रज्ञातः", "iast": "vitarkavicārānandāsmitārūpānugamāt saṃprajñātaḥ", "en": "[Concentration becomes] conscious [of its object] by assuming forms either of deliberation [upon coarse objects] or of reflection upon subtile objects or of joy or of the feeling-of-personality."}, "1.18": {"pada": "Samādhi-pāda", "deva": "विरामप्रत्ययाभ्यासपूर्वः संस्कारशेषो ऽन्यः", "iast": "virāmapratyayābhyāsapūrvaḥ saṃskāraśeṣo 'nyaḥ", "en": "The other [concentration which is not conscious of objects] consists of subliminal-impressions only [after objects have merged], and follows upon that practice which effects the cessation [of fluctuations]."}, "1.19": {"pada": "Samādhi-pāda", "deva": "भवप्रत्ययो विदेहप्रकृतिलयानाम्", "iast": "bhavapratyayo videhaprakṛtilayānām", "en": "[Concentration not conscious of objects] caused by worldly [means] is the one to which the discarnate attain and to which those [whose bodies] are resolved into primary-matter attain."}, "1.20": {"pada": "Samādhi-pāda", "deva": "श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम्", "iast": "śraddhāvīryasmṛtisamādhiprajñāpūrvaka itareṣām", "en": "[Concentration not conscious of objects,] which follows upon belief [and] energy [and] mindfulness [and] concentration [and] insight, is that to which the others [the yogins] attain."}, "1.21": {"pada": "Samādhi-pāda", "deva": "तीव्रसंवेगानामासन्नः", "iast": "tīvrasaṃvegānām āsannaḥ", "en": "For the keenly intense, [concentration] is near."}, "1.22": {"pada": "Samādhi-pāda", "deva": "मृदुमध्याधिमात्रत्वात्ततो ऽपि विशेषः", "iast": "mṛdumadhyādhimātratvāt tato 'pi viśeṣaḥ", "en": "Because [this keenness] is gentle or moderate or keen, there is a [concentration] superior even to this [near kind]."}, "1.23": {"pada": "Samādhi-pāda", "deva": "ईश्वरप्रणिधानाद्वा", "iast": "īśvarapraṇidhānād vā", "en": "Or [concentration] is attained by devotion to the Içvara."}, "1.24": {"pada": "Samādhi-pāda", "deva": "क्लेशकर्मविपाकाशयैरपरामृष्टः पुरुषविशेष ईश्वरः", "iast": "kleśakarmavipākāśayair aparāmṛṣṭaḥ puruṣaviśeṣa īśvaraḥ", "en": "Untouched by hindrances or karmas or fruition or by latent-deposits, the Içvara is a special kind of Self."}, "1.25": {"pada": "Samādhi-pāda", "deva": "तत्र निरतिशयं सर्वज्ञबीजम्", "iast": "tatra niratiśayaṃ sarvajñabījam", "en": "In this [Içvara] the germ of the omniscient is at its utmost excellence."}, "1.26": {"pada": "Samādhi-pāda", "deva": "पूर्वेषामपि गुरुः कालेनानवच्छेदात्", "iast": "pūrveṣām api guruḥ kālenānavacchedāt", "en": "Teacher of the Primal [Sages] also, forasmuch as [with Him] there is no limitation by time."}, "1.27": {"pada": "Samādhi-pāda", "deva": "तस्य वाचकः प्रणवः", "iast": "tasya vācakaḥ praṇavaḥ", "en": "The word-expressing Him is the Mystic-syllable."}, "1.28": {"pada": "Samādhi-pāda", "deva": "तज्जपस्तदर्थभावनम्", "iast": "tajjapas tadarthabhāvanam", "en": "Repetition of it and reflection upon its meaning [should be made]."}, "1.29": {"pada": "Samādhi-pāda", "deva": "ततः प्रत्यक्चेतनाधिगमो ऽप्यन्तरायाभावश्च", "iast": "tataḥ pratyakcetanādhigamo 'py antarāyābhāvaś ca", "en": "Thereafter comes the right-knowledge of him who thinks in an inverse way, and the removal of obstacles."}, "1.30": {"pada": "Samādhi-pāda", "deva": "व्याधिस्त्यानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालब्धभूमिकत्वानवस्थितत्वानि चित्तविक्षेपास्ते ऽन्तरायाः", "iast": "vyādhistyānasaṃśayapramādālasyāviratibhrāntidarśanālabdhabhūmikatvānavasthitatvāni cittavikṣepās te 'ntarāyāḥ", "en": "Sickness and languor and doubt and heedlessness and worldliness and erroneous perception and failure to attain any stage [of concentration] and instability in the state [when attained] — these distractions of the mind-stuff are the obstacles."}, "1.31": {"pada": "Samādhi-pāda", "deva": "दुःखदौर्मनस्याङ्गमेजयत्वश्वासप्रश्वासा विक्षेपसहभुवः", "iast": "duḥkhadaurmanasyāṅgamejayatvaśvāsapraśvāsā vikṣepasahabhuvaḥ", "en": "Pain and despondency and unsteadiness of the body and inspiration and expiration are the accompaniments of the distractions."}, "1.32": {"pada": "Samādhi-pāda", "deva": "तत्प्रतिषेधार्थमेकतत्त्वाभ्यासः", "iast": "tatpratiṣedhārtham ekatattvābhyāsaḥ", "en": "To check them [let there be] practice upon a single entity."}, "1.33": {"pada": "Samādhi-pāda", "deva": "मैत्रीकरुणामुदितोपेक्षाणां सुखदुःखपुण्यापुण्यविषयाणां भावनातश्चित्तप्रसादनम्", "iast": "maitrīkaruṇāmuditopekṣāṇāṃ sukhaduḥkhapuṇyāpuṇyaviṣayāṇāṃ bhāvanātaś cittaprasādanam", "en": "By the cultivation of friendliness towards happiness, and compassion towards pain, and joy towards merit, and indifference towards demerit."}, "1.34": {"pada": "Samādhi-pāda", "deva": "प्रच्छर्दनविधारणाभ्यां वा प्राणस्य", "iast": "pracchardanavidhāraṇābhyāṃ vā prāṇasya", "en": "Or [the yogin attains the undisturbed calm of the mind-stuff] by expulsion and retention of breath."}, "1.35": {"pada": "Samādhi-pāda", "deva": "विषयवती वा प्रवृत्तिरुत्पन्ना मनसः स्थितिनिबन्धनी", "iast": "viṣayavatī vā pravṛttir utpannā manasaḥ sthitinibandhanī", "en": "Or [he gains stability when] a sense-activity arises connected with an object [and] bringing the central-organ into a relation of stability."}, "1.36": {"pada": "Samādhi-pāda", "deva": "विशोका वा ज्योतिष्मती", "iast": "viśokā vā jyotiṣmatī", "en": "Or an undistressed [and] luminous [sense-activity when arisen brings the central-organ into a relation of stability]."}, "1.37": {"pada": "Samādhi-pāda", "deva": "वीतरागविषयं वा चित्तम्", "iast": "vītarāgaviṣayaṃ vā cittam", "en": "Or the mind-stuff [reaches the stable state] by having as its object [a mind-stuff] freed from passion."}, "1.38": {"pada": "Samādhi-pāda", "deva": "स्वप्ननिद्राज्ञानालम्बनं वा", "iast": "svapnanidrājñānālambanaṃ vā", "en": "Or [the mind-stuff reaches the stable state] by having as the supporting-object a perception in dream or in sleep."}, "1.39": {"pada": "Samādhi-pāda", "deva": "यथाभिमतध्यानाद्वा", "iast": "yathābhimatadhyānād vā", "en": "Or [the mind-stuff reaches the stable state] by contemplation upon any such an object as is desired."}, "1.40": {"pada": "Samādhi-pāda", "deva": "परमाणुपरममहत्त्वान्तो ऽस्य वशीकारः", "iast": "paramāṇuparamamahattvānto 'sya vaśīkāraḥ", "en": "His mastery extends from the smallest atom to the greatest magnitude."}, "1.41": {"pada": "Samādhi-pāda", "deva": "क्षीणवृत्तेरभिजातस्येव मणेर्ग्रहीतृग्रहणग्राह्येषु तत्स्थतदञ्जनता समापत्तिः", "iast": "kṣīṇavṛtter abhijātasyeva maṇer grahītṛgrahaṇagrāhyeṣu tatsthatadañjanatā samāpattiḥ", "en": "[The mind-stuff] from which, as from a precious gem, fluctuations have dwindled away, reaches the balanced-state, which, in the case of the knower or of the process-of-knowing or of the object-to-be-known, is in the state of resting upon [one] of these [three] and in the state of being tinged by [one] of these [three]."}, "1.42": {"pada": "Samādhi-pāda", "deva": "तत्र शब्दार्थज्ञानविकल्पैः संकीर्णा सवितर्का समापत्तिः", "iast": "tatra śabdārthajñānavikalpaiḥ saṃkīrṇā savitarkā samāpattiḥ", "en": "Of [these balanced-states] the state-balanced with deliberation is confused by reason of predicate-relations between words and intended-objects and ideas."}, "1.43": {"pada": "Samādhi-pāda", "deva": "स्मृतिपरिशुद्धौ स्वरूपशून्येवार्थमात्रनिर्भासा निर्वितर्का", "iast": "smṛtipariśuddhau svarūpaśūnyevārthamātranirbhāsā nirvitarkā", "en": "When the memory is quite purified, [that balanced-state] — which is, as it were, empty of itself and which brightens [into conscious knowledge] as the intended-object and nothing more — is super-deliberative."}, "1.44": {"pada": "Samādhi-pāda", "deva": "एतयैव सविचारा निर्विचारा च सूक्ष्मविषया व्याख्याता", "iast": "etayaiva savicārā nirvicārā ca sūkṣmaviṣayā vyākhyātā", "en": "By this same [balanced-state] the reflective and the super-reflective [balanced-states] are also explained."}, "1.45": {"pada": "Samādhi-pāda", "deva": "सूक्ष्मविषयत्वं चालिङ्गपर्यवसानम्", "iast": "sūkṣmaviṣayatvaṃ cāliṅgaparyavasānam", "en": "The subtile object also terminates in unresoluble-primary-matter (aliṅga)."}, "1.46": {"pada": "Samādhi-pāda", "deva": "ता एव सबीजः समाधिः", "iast": "tā eva sabījaḥ samādhiḥ", "en": "These same [balanced-states] are the seeded concentration."}, "1.47": {"pada": "Samādhi-pāda", "deva": "निर्विचारवैशारद्ये ऽध्यात्मप्रसादः", "iast": "nirvicāravaiśāradye 'dhyātmaprasādaḥ", "en": "When there is the clearness of the super-reflective [balanced-state, the yogin gains] internal undisturbed calm."}, "1.48": {"pada": "Samādhi-pāda", "deva": "ऋतंभरा तत्र प्रज्ञा", "iast": "ṛtaṃbharā tatra prajñā", "en": "In this [concentrated mind-stuff] the insight is truth-bearing."}, "1.49": {"pada": "Samādhi-pāda", "deva": "श्रुतानुमानप्रज्ञाभ्यामन्यविषया विशेषार्थत्वात्", "iast": "śrutānumānaprajñābhyām anyaviṣayā viśeṣārthatvāt", "en": "Has another object than the insight resulting from things heard or from inferences, inasmuch as its intended-object is a particular."}, "1.50": {"pada": "Samādhi-pāda", "deva": "तज्जः संस्कारो ऽन्यसंस्कारप्रतिबन्धी", "iast": "tajjaḥ saṃskāro 'nyasaṃskārapratibandhī", "en": "The subliminal-impression produced by this [super-reflective balanced-state] is hostile to other subliminal-impressions."}, "1.51": {"pada": "Samādhi-pāda", "deva": "तस्यापि निरोधे सर्वनिरोधान्निर्बीजः समाधिः", "iast": "tasyāpi nirodhe sarvanirodhān nirbījaḥ samādhiḥ", "en": "When this [subliminal-impression] also is restricted, since all is restricted, [the yogin gains] seedless concentration."}, "2.1": {"pada": "Sādhana-pāda", "deva": "तपःस्वाध्यायेश्वरप्रणिधानानि क्रियायोगः", "iast": "tapaḥsvādhyāyeśvarapraṇidhānāni kriyāyogaḥ", "en": "Self-castigation and study and devotion to the Içvara are the Yoga of action."}, "2.2": {"pada": "Sādhana-pāda", "deva": "समाधिभावनार्थः क्लेशतनूकरणार्थश्च", "iast": "samādhibhāvanārthaḥ kleśatanūkaraṇārthaś ca", "en": "For the cultivation of concentration and for the attenuation of the hindrances."}, "2.3": {"pada": "Sādhana-pāda", "deva": "अविद्यास्मितारागद्वेषाभिनिवेशाः क्लेशाः", "iast": "avidyāsmitārāgadveṣābhiniveśāḥ kleśāḥ", "en": "Undifferentiated-consciousness (avidyā) and the feeling-of-personality and passion and aversion and the will-to-live are the five hindrances."}, "2.4": {"pada": "Sādhana-pāda", "deva": "अविद्या क्षेत्रमुत्तरेषां प्रसुप्ततनुविच्छिन्नोदाराणाम्", "iast": "avidyā kṣetram uttareṣāṃ prasuptatanuvicchinnodārāṇām", "en": "Undifferentiated-consciousness is the field for the others whether they be dormant or attenuated or intercepted or sustained."}, "2.5": {"pada": "Sādhana-pāda", "deva": "अनित्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मख्यातिरविद्या", "iast": "anityāśuciduḥkhānātmasu nityaśucisukhātmakhyātir avidyā", "en": "The recognition of the permanent, of the pure, of pleasure, and of a self in what is impermanent, impure, pain, and not-self is undifferentiated-consciousness (avidyā)."}, "2.6": {"pada": "Sādhana-pāda", "deva": "दृग्दर्शनशक्त्योरेकात्मतेवास्मिता", "iast": "dṛgdarśanaśaktyor ekātmatevāsmitā", "en": "When the power of seeing and the power by which one sees have the appearance of being a single self, [this is] the feeling-of-personality."}, "2.7": {"pada": "Sādhana-pāda", "deva": "सुखानुशयी रागः", "iast": "sukhānuśayī rāgaḥ", "en": "Passion is that which dwells upon pleasure."}, "2.8": {"pada": "Sādhana-pāda", "deva": "दुःखानुशयी द्वेषः", "iast": "duḥkhānuśayī dveṣaḥ", "en": "Aversion is that which dwells upon pain."}, "2.9": {"pada": "Sādhana-pāda", "deva": "स्वरसवाही विदुषो ऽपि तथा रूढो ऽभिनिवेशः", "iast": "svarasavāhī viduṣo 'pi tathā rūḍho 'bhiniveśaḥ", "en": "The will-to-live sweeping on [by the force of] its own nature exists in this form even in the wise."}, "2.10": {"pada": "Sādhana-pāda", "deva": "ते प्रतिप्रसवहेयाः सूक्ष्माः", "iast": "te pratiprasavaheyāḥ sūkṣmāḥ", "en": "These [hindrances when they have become subtile] are to be escaped by the inverse-propagation."}, "2.11": {"pada": "Sādhana-pāda", "deva": "ध्यानहेयास्तद्वृत्तयः", "iast": "dhyānaheyās tadvṛttayaḥ", "en": "The fluctuations of these should be escaped by means of contemplation."}, "2.12": {"pada": "Sādhana-pāda", "deva": "क्लेशमूलः कर्माशयो दृष्टादृष्टजन्मवेदनीयः", "iast": "kleśamūlaḥ karmāśayo dṛṣṭādṛṣṭajanmavedanīyaḥ", "en": "The latent-deposit of karma has its root in the hindrances and may be felt in a birth seen or in a birth unseen."}, "2.13": {"pada": "Sādhana-pāda", "deva": "सति मूले तद्विपाको जात्यायुर्भोगाः", "iast": "sati mūle tadvipāko jātyāyurbhogāḥ", "en": "So long as the root exists, there will be fruition from it [that is] birth [and] length-of-life [and] kind-of-experience."}, "2.14": {"pada": "Sādhana-pāda", "deva": "ते ह्लादपरितापफलाः पुण्यापुण्यहेतुत्वात्", "iast": "te hlādaparitāpaphalāḥ puṇyāpuṇyahetutvāt", "en": "These [fruitions] have joy or extreme anguish as results in accordance with the quality of their causes whether merit or demerit."}, "2.15": {"pada": "Sādhana-pāda", "deva": "परिणामतापसंस्कारदुःखैर्गुणवृत्तिविरोधाच्च दुःखमेव सर्वं विवेकिनः", "iast": "pariṇāmatāpasaṃskāraduḥkhair guṇavṛttivirodhāc ca duḥkham eva sarvaṃ vivekinaḥ", "en": "As being the pains which are mutations and anxieties and subliminal-impressions, and by reason of the opposition of the fluctuations of the aspects (guṇa), — to the discriminating all is nothing but pain."}, "2.16": {"pada": "Sādhana-pāda", "deva": "हेयं दुःखमनागतम्", "iast": "heyaṃ duḥkham anāgatam", "en": "That which is to be escaped is pain yet to come."}, "2.17": {"pada": "Sādhana-pāda", "deva": "द्रष्टृदृश्ययोः संयोगो हेयहेतुः", "iast": "draṣṭṛdṛśyayoḥ saṃyogo heyahetuḥ", "en": "The correlation of the Seer and the object-of-sight is the cause of that which is to be escaped."}, "2.18": {"pada": "Sādhana-pāda", "deva": "प्रकाशक्रियास्थितिशीलं भूतेन्द्रियात्मकं भोगापवर्गार्थं दृश्यम्", "iast": "prakāśakriyāsthitiśīlaṃ bhūtendriyātmakaṃ bhogāpavargārthaṃ dṛśyam", "en": "With a disposition to brightness and to activity and to inertia, and with the elements and the organs as its essence, and with its purpose the experience and the liberation [of the Self], — this is the object-of-sight."}, "2.19": {"pada": "Sādhana-pāda", "deva": "विशेषाविशेषलिङ्गमात्रालिङ्गानि गुणपर्वाणि", "iast": "viśeṣāviśeṣaliṅgamātrāliṅgāni guṇaparvāṇi", "en": "The particularized and the unparticularized [forms] and the resoluble only [into primary matter] and irresoluble-primary-matter — are the divisions of the aspects (guṇa)."}, "2.20": {"pada": "Sādhana-pāda", "deva": "द्रष्टा दृशिमात्रः शुद्धो ऽपि प्रत्ययानुपश्यः", "iast": "draṣṭā dṛśimātraḥ śuddho 'pi pratyayānupaśyaḥ", "en": "The Seer who is nothing but [the power of seeing], although undefiled (çuddha), looks upon the presented idea."}, "2.21": {"pada": "Sādhana-pāda", "deva": "तदर्थ एव दृश्यस्यात्मा", "iast": "tadartha eva dṛśyasyātmā", "en": "The object-of-sight is only for the sake of it [the Self]."}, "2.22": {"pada": "Sādhana-pāda", "deva": "कृतार्थं प्रति नष्टमप्यनष्टं तदन्यसाधारणत्वात्", "iast": "kṛtārthaṃ prati naṣṭam apy anaṣṭaṃ tadanyasādhāraṇatvāt", "en": "Though it has ceased [to be seen] in the case of one whose purpose is accomplished, it has not ceased to be, since it is common to others [besides himself]."}, "2.23": {"pada": "Sādhana-pāda", "deva": "स्वस्वामिशक्त्योः स्वरूपोपलब्धिहेतुः संयोगः", "iast": "svasvāmiśaktyoḥ svarūpopalabdhihetuḥ saṃyogaḥ", "en": "The reason for the apperception of what the power of the property and of what the power of the proprietor are, is correlation."}, "2.24": {"pada": "Sādhana-pāda", "deva": "तस्य हेतुरविद्या", "iast": "tasya hetur avidyā", "en": "The reason for this [correlation] is undifferentiated-consciousness (avidyā)."}, "2.25": {"pada": "Sādhana-pāda", "deva": "तदभावात्संयोगाभावो हानं तद्दृशेः कैवल्यम्", "iast": "tadabhāvāt saṃyogābhāvo hānaṃ taddṛśeḥ kaivalyam", "en": "Since this [non-sight] does not exist, there is no correlation. This is the escape, the Isolation of the Seer."}, "2.26": {"pada": "Sādhana-pāda", "deva": "विवेकख्यातिरविप्लवा हानोपायः", "iast": "vivekakhyātir aviplavā hānopāyaḥ", "en": "The means of attaining escape is unwavering discriminative discernment."}, "2.27": {"pada": "Sādhana-pāda", "deva": "तस्य सप्तधा प्रान्तभूमिः प्रज्ञा", "iast": "tasya saptadhā prāntabhūmiḥ prajñā", "en": "For him [there is] insight sevenfold and advancing in stages to the highest."}, "2.28": {"pada": "Sādhana-pāda", "deva": "योगाङ्गानुष्ठानादशुद्धिक्षये ज्ञानदीप्तिरा विवेकख्यातेः", "iast": "yogāṅgānuṣṭhānād aśuddhikṣaye jñānadīptir ā vivekakhyāteḥ", "en": "After the aids to yoga have been followed up, when the impurity has dwindled, there is an enlightenment of perception reaching up to the discriminative discernment."}, "2.29": {"pada": "Sādhana-pāda", "deva": "यमनियमासनप्राणायामप्रत्याहारधारणाध्यानसमाधयो ऽष्टावङ्गानि", "iast": "yamaniyamāsanaprāṇāyāmapratyāhāradhāraṇādhyānasamādhayo 'ṣṭāv aṅgāni", "en": "Abstentions and observances and postures and regulations-of-the-breath and withdrawal-of-the-senses and fixed-attention and contemplation and concentration."}, "2.30": {"pada": "Sādhana-pāda", "deva": "अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः", "iast": "ahiṃsāsatyāsteyabrahmacaryāparigrahā yamāḥ", "en": "Abstinence from injury and from falsehood and from theft and from incontinence and from acceptance of gifts are the abstentions."}, "2.31": {"pada": "Sādhana-pāda", "deva": "जातिदेशकालसमयानवच्छिन्नाः सार्वभौमा महाव्रतम्", "iast": "jātideśakālasamayānavacchinnāḥ sārvabhaumā mahāvratam", "en": "When they are unqualified by species or place or time or exigency and when [covering] all [these] classes — there is the Great Course-of-conduct."}, "2.32": {"pada": "Sādhana-pāda", "deva": "शौचसंतोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः", "iast": "śaucasaṃtoṣatapaḥsvādhyāyeśvarapraṇidhānāni niyamāḥ", "en": "Cleanliness and contentment and self-castigation and study and devotion to the Içvara are the observances."}, "2.33": {"pada": "Sādhana-pāda", "deva": "वितर्कबाधने प्रतिपक्षभावनम्", "iast": "vitarkabādhane pratipakṣabhāvanam", "en": "If there be inhibition by perverse-considerations, there should be cultivation of the opposites."}, "2.34": {"pada": "Sādhana-pāda", "deva": "वितर्का हिंसादयः कृतकारितानुमोदिता लोभक्रोधमोहपूर्वका मृदुमध्याधिमात्रा दुःखाज्ञानानन्तफला इति प्रतिपक्षभावनम्", "iast": "vitarkā hiṃsādayaḥ kṛtakāritānumoditā lobhakrodhamohapūrvakā mṛdumadhyādhimātrā duḥkhājñānānantaphalā iti pratipakṣabhāvanam", "en": "Since perverse-considerations such as injuries, whether done or caused to be done or approved, whether ensuing upon greed or anger or infatuation, whether mild or moderate or vehement, find their unending consequences in pain and lack of thinking, there should be the cultivation of their opposites."}, "2.35": {"pada": "Sādhana-pāda", "deva": "अहिंसाप्रतिष्ठायां तत्संनिधौ वैरत्यागः", "iast": "ahiṃsāpratiṣṭhāyāṃ tatsaṃnidhau vairatyāgaḥ", "en": "As soon as he is grounded in abstinence from injury, his presence begets a suspension of enmity."}, "2.36": {"pada": "Sādhana-pāda", "deva": "सत्यप्रतिष्ठायां क्रियाफलाश्रयत्वम्", "iast": "satyapratiṣṭhāyāṃ kriyāphalāśrayatvam", "en": "As soon as he is grounded in abstinence from falsehood, actions and consequences depend upon him."}, "2.37": {"pada": "Sādhana-pāda", "deva": "अस्तेयप्रतिष्ठायां सर्वरत्नोपस्थानम्", "iast": "asteyapratiṣṭhāyāṃ sarvaratnopasthānam", "en": "As soon as he is grounded in abstinence from theft, all jewels approach him."}, "2.38": {"pada": "Sādhana-pāda", "deva": "ब्रह्मचर्यप्रतिष्ठायां वीर्यलाभः", "iast": "brahmacaryapratiṣṭhāyāṃ vīryalābhaḥ", "en": "As soon as he is grounded in abstinence from incontinence, he acquires energy."}, "2.39": {"pada": "Sādhana-pāda", "deva": "अपरिग्रहस्थैर्ये जन्मकथंतासंबोधः", "iast": "aparigrahasthairye janmakathaṃtāsaṃbodhaḥ", "en": "As soon as he is established in abstinence from acceptance of gifts, a thorough illumination upon the conditions of birth."}, "2.40": {"pada": "Sādhana-pāda", "deva": "शौचात्स्वाङ्गजुगुप्सा परैरसंसर्गः", "iast": "śaucāt svāṅgajugupsā parair asaṃsargaḥ", "en": "As a result of cleanliness there is disgust at one's own body and no intercourse with others."}, "2.41": {"pada": "Sādhana-pāda", "deva": "सत्त्वशुद्धिसौमनस्यैकाग्र्येन्द्रियजयात्मदर्शनयोग्यत्वानि च", "iast": "sattvaśuddhisaumanasyaikāgryendriyajayātmadarśanayogyatvāni ca", "en": "Purity of sattva and gentleness and singleness-of-intent and subjugation of the senses and fitness for the sight of the self."}, "2.42": {"pada": "Sādhana-pāda", "deva": "संतोषादनुत्तमः सुखलाभः", "iast": "saṃtoṣād anuttamaḥ sukhalābhaḥ", "en": "As a result of contentment there is an acquisition of superlative pleasure."}, "2.43": {"pada": "Sādhana-pāda", "deva": "कायेन्द्रियसिद्धिरशुद्धिक्षयात्तपसः", "iast": "kāyendriyasiddhir aśuddhikṣayāt tapasaḥ", "en": "Perfection in the body and in the organs after impurity has dwindled as a result of self-castigation."}, "2.44": {"pada": "Sādhana-pāda", "deva": "स्वाध्यायादिष्टदेवतासंप्रयोगः", "iast": "svādhyāyād iṣṭadevatāsaṃprayogaḥ", "en": "As a result of study there is communion with the chosen deity."}, "2.45": {"pada": "Sādhana-pāda", "deva": "समाधिसिद्धिरीश्वरप्रणिधानात्", "iast": "samādhisiddhir īśvarapraṇidhānāt", "en": "Perfection of concentration as a result of devotion to the Içvara."}, "2.46": {"pada": "Sādhana-pāda", "deva": "स्थिरसुखमासनम्", "iast": "sthirasukham āsanam", "en": "Stable-and-easy posture."}, "2.47": {"pada": "Sādhana-pāda", "deva": "प्रयत्नशैथिल्यानन्तसमापत्तिभ्याम्", "iast": "prayatnaśaithilyānantasamāpattibhyām", "en": "By relaxation of effort or by a [mental] state-of-balance with reference to Ananta."}, "2.48": {"pada": "Sādhana-pāda", "deva": "ततो द्वन्द्वानभिघातः", "iast": "tato dvandvānabhighātaḥ", "en": "Thereafter he is unassailed by extremes."}, "2.49": {"pada": "Sādhana-pāda", "deva": "तस्मिन्सति श्वासप्रश्वासयोर्गतिविच्छेदः प्राणायामः", "iast": "tasmin sati śvāsapraśvāsayor gativicchedaḥ prāṇāyāmaḥ", "en": "When there is [stability of posture], the restraint of breath, a cutting off of the flow of inspiration and expiration, follows."}, "2.50": {"pada": "Sādhana-pāda", "deva": "बाह्याभ्यन्तरस्तम्भवृत्तिर्देशकालसंख्याभिः परिदृष्टो दीर्घसूक्ष्मः", "iast": "bāhyābhyantarastambhavṛttir deśakālasaṃkhyābhiḥ paridṛṣṭo dīrghasūkṣmaḥ", "en": "[This is] external or internal or suppressed in fluctuation and is regulated by place and time and number and is protracted and subtile."}, "2.51": {"pada": "Sādhana-pāda", "deva": "बाह्याभ्यन्तरविषयाक्षेपी चतुर्थः", "iast": "bāhyābhyantaraviṣayākṣepī caturthaḥ", "en": "The fourth [restraint of the breath] transcends the external and the internal object."}, "2.52": {"pada": "Sādhana-pāda", "deva": "ततः क्षीयते प्रकाशावरणम्", "iast": "tataḥ kṣīyate prakāśāvaraṇam", "en": "As a result of this the covering of the light dwindles away."}, "2.53": {"pada": "Sādhana-pāda", "deva": "धारणासु च योग्यता मनसः", "iast": "dhāraṇāsu ca yogyatā manasaḥ", "en": "For fixed-attentions also the central organ becomes fit."}, "2.54": {"pada": "Sādhana-pāda", "deva": "स्वविषयासंप्रयोगे चित्तस्वरूपानुकार इवेन्द्रियाणां प्रत्याहारः", "iast": "svaviṣayāsaṃprayoge cittasvarūpānukāra ivendriyāṇāṃ pratyāhāraḥ", "en": "The withdrawal of the senses is as it were the imitation of the mind-stuff as it is in itself on the part of the organs by disjoining themselves from their object."}, "2.55": {"pada": "Sādhana-pāda", "deva": "ततः परमा वश्यतेन्द्रियाणाम्", "iast": "tataḥ paramā vaśyatendriyāṇām", "en": "As a result of this [withdrawal] there is a complete-mastery of the organs."}, "3.1": {"pada": "Vibhūti-pāda", "deva": "देशबन्धश्चित्तस्य धारणा", "iast": "deśabandhaś cittasya dhāraṇā", "en": "Binding the mind-stuff to a place is fixed-attention."}, "3.2": {"pada": "Vibhūti-pāda", "deva": "तत्र प्रत्ययैकतानता ध्यानम्", "iast": "tatra pratyayaikatānatā dhyānam", "en": "Focusedness of the presented idea upon that [place] is contemplation."}, "3.3": {"pada": "Vibhūti-pāda", "deva": "तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः", "iast": "tad evārthamātranirbhāsaṃ svarūpaśūnyam iva samādhiḥ", "en": "This same [contemplation], shining forth [in consciousness] as the intended object and nothing more, and, as it were, emptied of itself, is concentration."}, "3.4": {"pada": "Vibhūti-pāda", "deva": "त्रयमेकत्र संयमः", "iast": "trayam ekatra saṃyamaḥ", "en": "The three in one are constraint."}, "3.5": {"pada": "Vibhūti-pāda", "deva": "तज्जयात्प्रज्ञालोकः", "iast": "tajjayāt prajñālokaḥ", "en": "As a result of mastering this constraint, there follows the shining forth of insight."}, "3.6": {"pada": "Vibhūti-pāda", "deva": "तस्य भूमिषु विनियोगः", "iast": "tasya bhūmiṣu viniyogaḥ", "en": "Its application is by stages."}, "3.7": {"pada": "Vibhūti-pāda", "deva": "त्रयमन्तरङ्गं पूर्वेभ्यः", "iast": "trayam antaraṅgaṃ pūrvebhyaḥ", "en": "The three are direct aids in comparison with the previous [five]."}, "3.8": {"pada": "Vibhūti-pāda", "deva": "तदपि बहिरङ्गं निर्बीजस्य", "iast": "tad api bahiraṅgaṃ nirbījasya", "en": "Even these [three] are indirect aids to seedless [concentration]."}, "3.9": {"pada": "Vibhūti-pāda", "deva": "व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भावौ निरोधक्षणचित्तान्वयो निरोधपरिणामः", "iast": "vyutthānanirodhasaṃskārayor abhibhavaprādurbhāvau nirodhakṣaṇacittānvayo nirodhapariṇāmaḥ", "en": "When there is a becoming invisible of the subliminal-impression of emergence and a becoming visible of the subliminal-impression of restriction, the mutation of restriction is inseparably connected with mind-stuff in its period of restriction."}, "3.10": {"pada": "Vibhūti-pāda", "deva": "तस्य प्रशान्तवाहिता संस्कारात्", "iast": "tasya praśāntavāhitā saṃskārāt", "en": "This [mind-stuff] flows peacefully by reason of the subliminal-impression."}, "3.11": {"pada": "Vibhūti-pāda", "deva": "सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समाधिपरिणामः", "iast": "sarvārthataikāgratayoḥ kṣayodayau cittasya samādhipariṇāmaḥ", "en": "The mutation of concentration is the dwindling of dispersiveness and the uprisal of singleness-of-intent belonging to the mind-stuff."}, "3.12": {"pada": "Vibhūti-pāda", "deva": "ततः पुनः शान्तोदितौ तुल्यप्रत्ययौ चित्तस्यैकाग्रतापरिणामः", "iast": "tataḥ punaḥ śāntoditau tulyapratyayau cittasyaikāgratāpariṇāmaḥ", "en": "Then again when the quiescent and the uprisen presented-ideas are similar [in respect of having a single object], the mind-stuff has a mutation single-in-intent."}, "3.13": {"pada": "Vibhūti-pāda", "deva": "एतेन भूतेन्द्रियेषु धर्मलक्षणावस्थापरिणामा व्याख्याताः", "iast": "etena bhūtendriyeṣu dharmalakṣaṇāvasthāpariṇāmā vyākhyātāḥ", "en": "Thus with regard to elements and to organs, mutations of external-aspect and of time-variation and of intensity have been enumerated."}, "3.14": {"pada": "Vibhūti-pāda", "deva": "शान्तोदिताव्यपदेश्यधर्मानुपाती धर्मी", "iast": "śāntoditāvyapadeśyadharmānupātī dharmī", "en": "A substance conforms itself to quiescent and uprisen and indeterminable external-aspects."}, "3.15": {"pada": "Vibhūti-pāda", "deva": "क्रमान्यत्वं परिणामान्यत्वे हेतुः", "iast": "kramānyatvaṃ pariṇāmānyatve hetuḥ", "en": "The order of the sequence is the reason for the order of the mutations."}, "3.16": {"pada": "Vibhūti-pāda", "deva": "परिणामत्रयसंयमादतीतानागतज्ञानम्", "iast": "pariṇāmatrayasaṃyamād atītānāgatajñānam", "en": "As a result of constraint upon the three mutations [there follows] the knowledge of the past and the future."}, "3.17": {"pada": "Vibhūti-pāda", "deva": "शब्दार्थप्रत्ययानामितरेतराध्यासात्संकरस्तत्प्रविभागसंयमात्सर्वभूतरुतज्ञानम्", "iast": "śabdārthapratyayānām itaretarādhyāsāt saṃkaras tatpravibhāgasaṃyamāt sarvabhūtarutajñānam", "en": "Word and intended-object and presented-idea are confused because they are erroneously identified with each other. By constraint upon the distinctions between them [there arises the intuitive] knowledge of the cries of all living beings."}, "3.18": {"pada": "Vibhūti-pāda", "deva": "संस्कारसाक्षात्करणात्पूर्वजातिज्ञानम्", "iast": "saṃskārasākṣātkaraṇāt pūrvajātijñānam", "en": "As a result of direct perception of subliminal-impressions there is [intuitive] knowledge of previous births."}, "3.19": {"pada": "Vibhūti-pāda", "deva": "प्रत्ययस्य परचित्तज्ञानम्", "iast": "pratyayasya paracittajñānam", "en": "[As a result of constraint] upon a presented-idea [there arises intuitive] knowledge of the mind-stuff of another."}, "3.20": {"pada": "Vibhūti-pāda", "deva": "न च तत्सालम्बनं तस्याविषयीभूतत्वात्", "iast": "na ca tat sālambanaṃ tasyāviṣayībhūtatvāt", "en": "But [the intuitive knowledge of the mind-stuff of another] does not have that [idea] together with that upon which it depends [as its object], since that [upon which it depends] is not-in-the-field [of consciousness]."}, "3.21": {"pada": "Vibhūti-pāda", "deva": "कायरूपसंयमात्तद्ग्राह्यशक्तिस्तम्भे चक्षुःप्रकाशासंप्रयोगे ऽन्तर्धानम्", "iast": "kāyarūpasaṃyamāt tadgrāhyaśaktistambhe cakṣuḥprakāśāsaṃprayoge 'ntardhānam", "en": "As a result of constraint upon the [outer] form of the body, when its power to be known is stopped, then as a consequence of the disjunction of the light and of the eye there follows indiscernibility [of the yogin's body]."}, "3.22": {"pada": "Vibhūti-pāda", "deva": "सोपक्रमं निरुपक्रमं च कर्म तत्संयमादपरान्तज्ञानमरिष्टेभ्यो वा", "iast": "sopakramaṃ nirupakramaṃ ca karma tatsaṃyamād aparāntajñānam ariṣṭebhyo vā", "en": "Advancing and not-advancing is karma; as a result of constraint upon this [twofold karma] or from the signs of death [there arises an intuitive] knowledge of the latter end."}, "3.23": {"pada": "Vibhūti-pāda", "deva": "मैत्र्यादिषु बलानि", "iast": "maitryādiṣu balāni", "en": "[As a result of constraint] upon friendliness and other [sentiments there arise] powers [of friendliness]."}, "3.24": {"pada": "Vibhūti-pāda", "deva": "बलेषु हस्तिबलादीनि", "iast": "baleṣu hastibalādīni", "en": "[As a result of constraint] upon powers [there arise] powers like those of an elephant."}, "3.25": {"pada": "Vibhūti-pāda", "deva": "प्रवृत्त्यालोकन्यासात्सूक्ष्मव्यवहितविप्रकृष्टज्ञानम्", "iast": "pravṛttyālokanyāsāt sūkṣmavyavahitaviprakṛṣṭajñānam", "en": "As a result of casting the light of a sense-activity [there arises the intuitive] knowledge of the subtile and the concealed and the obscure."}, "3.26": {"pada": "Vibhūti-pāda", "deva": "भुवनज्ञानं सूर्ये संयमात्", "iast": "bhuvanajñānaṃ sūrye saṃyamāt", "en": "As a result of constraint upon the sun [there arises the intuitive] knowledge of the cosmic-spaces."}, "3.27": {"pada": "Vibhūti-pāda", "deva": "चन्द्रे ताराव्यूहज्ञानम्", "iast": "candre tārāvyūhajñānam", "en": "[As a result of constraint] upon the moon [there arises the intuitive] knowledge of the arrangement of the stars."}, "3.28": {"pada": "Vibhūti-pāda", "deva": "ध्रुवे तद्गतिज्ञानम्", "iast": "dhruve tadgatijñānam", "en": "[As a result of constraint] upon the pole-star [there arises the intuitive] knowledge of their movements."}, "3.29": {"pada": "Vibhūti-pāda", "deva": "नाभिचक्रे कायव्यूहज्ञानम्", "iast": "nābhicakre kāyavyūhajñānam", "en": "[As a result of constraint] upon the wheel of the navel [there arises the intuitive] knowledge of the arrangement of the body."}, "3.30": {"pada": "Vibhūti-pāda", "deva": "कण्ठकूपे क्षुत्पिपासानिवृत्तिः", "iast": "kaṇṭhakūpe kṣutpipāsānivṛttiḥ", "en": "[As a result of constraint] upon the well of the throat [there follows] the cessation of hunger and thirst."}, "3.31": {"pada": "Vibhūti-pāda", "deva": "कूर्मनाड्यां स्थैर्यम्", "iast": "kūrmanāḍyāṃ sthairyam", "en": "[As a result of constraint] upon the tortoise-tube [there follows] motionlessness of the mind-stuff."}, "3.32": {"pada": "Vibhūti-pāda", "deva": "मूर्धज्योतिषि सिद्धदर्शनम्", "iast": "mūrdhajyotiṣi siddhadarśanam", "en": "[As a result of constraint] upon the radiance in the head [there follows] the sight of the Siddhas."}, "3.33": {"pada": "Vibhūti-pāda", "deva": "प्रातिभाद्वा सर्वम्", "iast": "prātibhād vā sarvam", "en": "Or as a result of vividness the yogin discerns all."}, "3.34": {"pada": "Vibhūti-pāda", "deva": "हृदये चित्तसंवित्", "iast": "hṛdaye cittasaṃvit", "en": "[As a result of constraint] upon the heart [there arises] a consciousness of the mind-stuff."}, "3.35": {"pada": "Vibhūti-pāda", "deva": "सत्त्वपुरुषयोरत्यन्तासंकीर्णयोः प्रत्ययाविशेषो भोगः परार्थात्स्वार्थसंयमात्पुरुषज्ञानम्", "iast": "sattvapuruṣayor atyantāsaṃkīrṇayoḥ pratyayāviśeṣo bhogaḥ parārthāt svārthasaṃyamāt puruṣajñānam", "en": "Experience is a presented-idea which fails to distinguish the sattva and the Self, which are absolutely uncommingled [in the presented-idea]. Since the sattva exists as object for another, the [intuitive] knowledge of the Self arises as the result of constraint upon that which exists for its own sake."}, "3.36": {"pada": "Vibhūti-pāda", "deva": "ततः प्रातिभश्रावणवेदनादर्शास्वादवार्ता जायन्ते", "iast": "tataḥ prātibhaśrāvaṇavedanādarśāsvādavārtā jāyante", "en": "As a result of this [constraint upon that which exists for its own sake], there arise vividness and the organ-of-[supernal]-hearing and the organ-of-[supernal]-touch and the organ-of-[supernal]-sight and the organ-of-[supernal]-taste and the organ-of-[supernal]-smell."}, "3.37": {"pada": "Vibhūti-pāda", "deva": "ते समाधावुपसर्गा व्युत्थाने सिद्धयः", "iast": "te samādhāv upasargā vyutthāne siddhayaḥ", "en": "In concentration these [supernal activities] are obstacles; in the emergent state they are perfections (siddhi)."}, "3.38": {"pada": "Vibhūti-pāda", "deva": "बन्धकारणशैथिल्यात्प्रचारसंवेदनाच्च चित्तस्य परशरीरावेशः", "iast": "bandhakāraṇaśaithilyāt pracārasaṃvedanāc ca cittasya paraśarīrāveśaḥ", "en": "As a result of slackening the causes of bondage and as a result of the knowledge of the procedure [of the mind-stuff], the mind-stuff penetrates into the body of another."}, "3.39": {"pada": "Vibhūti-pāda", "deva": "उदानजयाज्जलपङ्ककण्टकादिष्वसङ्ग उत्क्रान्तिश्च", "iast": "udānajayāj jalapaṅkakaṇṭakādiṣv asaṅga utkrāntiś ca", "en": "As a result of mastering the Udāna there is no adhesion to water or mud or thorns or similar objects, and [at death] the upward flight."}, "3.40": {"pada": "Vibhūti-pāda", "deva": "समानजयाज्ज्वलनम्", "iast": "samānajayāj jvalanam", "en": "As a result of mastering the Samāna [there arises] a radiance."}, "3.41": {"pada": "Vibhūti-pāda", "deva": "श्रोत्राकाशयोः संबन्धसंयमाद्दिव्यं श्रोत्रम्", "iast": "śrotrākāśayoḥ saṃbandhasaṃyamād divyaṃ śrotram", "en": "As a result of constraint upon the relation between the organ-of-hearing and the air, [there arises] the supernal-organ-of-hearing."}, "3.42": {"pada": "Vibhūti-pāda", "deva": "कायाकाशयोः संबन्धसंयमाल्लघुतूलसमापत्तेश्चाकाशगमनम्", "iast": "kāyākāśayoḥ saṃbandhasaṃyamāl laghutūlasamāpatteś cākāśagamanam", "en": "Either as a result of constraint upon the relation between the body and the air, or as a result of the balanced-state of lightness, such as that of cotton-fibre, there follows the passing through air."}, "3.43": {"pada": "Vibhūti-pāda", "deva": "बहिरकल्पिता वृत्तिर्महाविदेहा ततः प्रकाशावरणक्षयः", "iast": "bahir akalpitā vṛttir mahāvidehā tataḥ prakāśāvaraṇakṣayaḥ", "en": "An outwardly unadjusted fluctuation is the Great Discarnate; as a result of this the dwindling of the covering to the brightness."}, "3.44": {"pada": "Vibhūti-pāda", "deva": "स्थूलस्वरूपसूक्ष्मान्वयार्थवत्त्वसंयमाद्भूतजयः", "iast": "sthūlasvarūpasūkṣmānvayārthavattvasaṃyamād bhūtajayaḥ", "en": "As a result of constraint upon the coarse and the essential-attribute and the subtile and the inherence and purposiveness, there is a mastery of the elements."}, "3.45": {"pada": "Vibhūti-pāda", "deva": "ततो ऽणिमादिप्रादुर्भावः कायसंपत्तद्धर्मानभिघातश्च", "iast": "tato 'ṇimādiprādurbhāvaḥ kāyasaṃpat taddharmānabhighātaś ca", "en": "As a result of this, atomization and the other [perfections] come about, [there is] perfection of body; and there is no obstruction by the properties of these [elements]."}, "3.46": {"pada": "Vibhūti-pāda", "deva": "रूपलावण्यबलवज्रसंहननत्वानि कायसंपत्", "iast": "rūpalāvaṇyabalavajrasaṃhananatvāni kāyasaṃpat", "en": "Beauty and grace and power and compactness of the thunderbolt, — [this is] perfection of body."}, "3.47": {"pada": "Vibhūti-pāda", "deva": "ग्रहणस्वरूपास्मितान्वयार्थवत्त्वसंयमादिन्द्रियजयः", "iast": "grahaṇasvarūpāsmitānvayārthavattvasaṃyamād indriyajayaḥ", "en": "As a result of constraint upon the process-of-knowing and the essential-attribute and the feeling-of-personality and the inherence and the purposiveness, [there follows] the subjugation of the organs."}, "3.48": {"pada": "Vibhūti-pāda", "deva": "ततो मनोजवित्वं विकरणभावः प्रधानजयश्च", "iast": "tato manojavitvaṃ vikaraṇabhāvaḥ pradhānajayaś ca", "en": "As a result of this [there follows] speed [great as that] of the central-organ, action of the instruments [of knowledge] disjunct [from the body], and the subjugation of the primary-cause."}, "3.49": {"pada": "Vibhūti-pāda", "deva": "सत्त्वपुरुषान्यताख्यातिमात्रस्य सर्वभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च", "iast": "sattvapuruṣānyatākhyātimātrasya sarvabhāvādhiṣṭhātṛtvaṃ sarvajñātṛtvaṃ ca", "en": "He who has only the full discernment into the difference between the sattva and the Self is one who has authority over all states-of-existence and is one who knows all."}, "3.50": {"pada": "Vibhūti-pāda", "deva": "तद्वैराग्यादपि दोषबीजक्षये कैवल्यम्", "iast": "tadvairāgyād api doṣabījakṣaye kaivalyam", "en": "As a result of passionlessness even with regard to these [perfections] there follows, after the dwindling of the seeds of the defects, Isolation."}, "3.51": {"pada": "Vibhūti-pāda", "deva": "स्थान्युपनिमन्त्रणे सङ्गस्मयाकरणं पुनरनिष्टप्रसङ्गात्", "iast": "sthānyupanimantraṇe saṅgasmayākaraṇaṃ punar aniṣṭaprasaṅgāt", "en": "In case of invitations from those-in-high-places, these should arouse no attachment or pride, for undesired consequences recur."}, "3.52": {"pada": "Vibhūti-pāda", "deva": "क्षणतत्क्रमयोः संयमाद्विवेकजं ज्ञानम्", "iast": "kṣaṇatatkramayoḥ saṃyamād vivekajaṃ jñānam", "en": "As a result of constraint upon moments and their sequence [there arises the intuitive] knowledge proceeding from discrimination."}, "3.53": {"pada": "Vibhūti-pāda", "deva": "जातिलक्षणदेशैरन्यतानवच्छेदात्तुल्ययोस्ततः प्रतिपत्तिः", "iast": "jātilakṣaṇadeśair anyatānavacchedāt tulyayos tataḥ pratipattiḥ", "en": "As a result of this there arises the deeper-knowledge of two equivalent things which cannot be distinctly qualified in species or characteristic-mark or point-of-space."}, "3.54": {"pada": "Vibhūti-pāda", "deva": "तारकं सर्वविषयं सर्वथाविषयमक्रमं चेति विवेकजं ज्ञानम्", "iast": "tārakaṃ sarvaviṣayaṃ sarvathāviṣayam akramaṃ ceti vivekajaṃ jñānam", "en": "The [intuitive] knowledge proceeding from discrimination is a deliverer, has all things as its object, and has all times for its object, and is an [inclusive whole] without sequence."}, "3.55": {"pada": "Vibhūti-pāda", "deva": "सत्त्वपुरुषयोः शुद्धिसाम्ये कैवल्यमिति", "iast": "sattvapuruṣayoḥ śuddhisāmye kaivalyam iti", "en": "When the purity of the sattva and of the Self are equal there is Isolation."}, "4.1": {"pada": "Kaivalya-pāda", "deva": "जन्मौषधिमन्त्रतपःसमाधिजाः सिद्धयः", "iast": "janmauṣadhimantratapaḥsamādhijāḥ siddhayaḥ", "en": "Perfections proceed from birth or from drugs or from spells or from self-castigation or from concentration."}, "4.2": {"pada": "Kaivalya-pāda", "deva": "जात्यन्तरपरिणामः प्रकृत्यापूरात्", "iast": "jātyantarapariṇāmaḥ prakṛtyāpūrāt", "en": "The mutation into another birth is the result of the filling in of the evolving-cause."}, "4.3": {"pada": "Kaivalya-pāda", "deva": "निमित्तमप्रयोजकं प्रकृतीनां वरणभेदस्तु ततः क्षेत्रिकवत्", "iast": "nimittam aprayojakaṃ prakṛtīnāṃ varaṇabhedas tu tataḥ kṣetrikavat", "en": "The efficient cause gives no impulse to the evolving-causes but [the mutation] follows when the barrier [to the evolving-cause] is cut, as happens with the peasant."}, "4.4": {"pada": "Kaivalya-pāda", "deva": "निर्माणचित्तान्यस्मितामात्रात्", "iast": "nirmāṇacittāny asmitāmātrāt", "en": "Created mind-stuffs may result from the sense-of-personality and from this alone."}, "4.5": {"pada": "Kaivalya-pāda", "deva": "प्रवृत्तिभेदे प्रयोजकं चित्तमेकमनेकेषाम्", "iast": "pravṛttibhede prayojakaṃ cittam ekam anekeṣām", "en": "While there is a variety of actions, the mind-stuff which impels the many is one."}, "4.6": {"pada": "Kaivalya-pāda", "deva": "तत्र ध्यानजमनाशयम्", "iast": "tatra dhyānajam anāśayam", "en": "Of these [five perfections] that which proceeds from contemplation leaves no latent-deposit."}, "4.7": {"pada": "Kaivalya-pāda", "deva": "कर्माशुक्लाकृष्णं योगिनस्त्रिविधमितरेषाम्", "iast": "karmāśuklākṛṣṇaṃ yoginas trividham itareṣām", "en": "The yogin's karma is neither-white-nor-black; [the karma] of others is of three kinds."}, "4.8": {"pada": "Kaivalya-pāda", "deva": "ततस्तद्विपाकानुगुणानामेवाभिव्यक्तिर्वासनानाम्", "iast": "tatas tadvipākānuguṇānām evābhivyaktir vāsanānām", "en": "As a result of this there follows the manifestation of those subconscious-impressions only which correspond to the fruition of their [karma]."}, "4.9": {"pada": "Kaivalya-pāda", "deva": "जातिदेशकालव्यवहितानामप्यानन्तर्यं स्मृतिसंस्कारयोरेकरूपत्वात्", "iast": "jātideśakālavyavahitānām apy ānantaryaṃ smṛtisaṃskārayor ekarūpatvāt", "en": "There is an uninterrupted-causal-relation [of subconscious-impressions], although remote in species and point-of-space and moment-of-time, by reason of the correspondence between memory and subliminal-impressions."}, "4.10": {"pada": "Kaivalya-pāda", "deva": "तासामनादित्वं चाशिषो नित्यत्वात्", "iast": "tāsām anāditvaṃ cāśiṣo nityatvāt", "en": "Furthermore the [subconscious-impressions] have no beginning [that we can set in time], since desire is permanent."}, "4.11": {"pada": "Kaivalya-pāda", "deva": "हेतुफलाश्रयालम्बनैः संगृहीतत्वादेषामभावे तदभावः", "iast": "hetuphalāśrayālambanaiḥ saṃgṛhītatvād eṣām abhāve tadabhāvaḥ", "en": "Since [subconscious-impressions] are associated with cause and motive and mental-substrate and stimulus, if these cease to be, then those [subconscious-impressions] cease to be."}, "4.12": {"pada": "Kaivalya-pāda", "deva": "अतीतानागतं स्वरूपतो ऽस्त्यध्वभेदाद्धर्माणाम्", "iast": "atītānāgataṃ svarūpato 'sty adhvabhedād dharmāṇām", "en": "Past and future as such exist; [therefore subconscious-impressions do not cease to be]. For the different time-forms belong to the external-aspects."}, "4.13": {"pada": "Kaivalya-pāda", "deva": "ते व्यक्तसूक्ष्मा गुणात्मानः", "iast": "te vyaktasūkṣmā guṇātmānaḥ", "en": "These [external-aspects with the three time-forms] are phenomenalized [individuals] or subtile [generic-forms] and their essence is the aspects (guṇa)."}, "4.14": {"pada": "Kaivalya-pāda", "deva": "परिणामैकत्वाद्वस्तुतत्त्वम्", "iast": "pariṇāmaikatvād vastutattvam", "en": "The that-ness of a thing is due to a singleness of mutation."}, "4.15": {"pada": "Kaivalya-pāda", "deva": "वस्तुसाम्ये चित्तभेदात्तयोर्विभक्तः पन्थाः", "iast": "vastusāmye cittabhedāt tayor vibhaktaḥ panthāḥ", "en": "Because, while the [physical] thing remains the same, the mind-stuffs are different, [therefore the two are upon] distinct levels-of-existence."}, "4.16": {"pada": "Kaivalya-pāda", "deva": "न चैकचित्ततन्त्रं वस्तु तदप्रमाणकं तदा किं स्यात्", "iast": "na caikacittatantraṃ vastu tadapramāṇakaṃ tadā kiṃ syāt", "en": "And a thing is not dependent upon a single mind-stuff, [for then in certain cases] it could not be proved [by that mind-stuff], [and] then what would it be?"}, "4.17": {"pada": "Kaivalya-pāda", "deva": "तदुपरागापेक्षित्वाच्चित्तस्य वस्तु ज्ञाताज्ञातम्", "iast": "taduparāgāpekṣitvāc cittasya vastu jñātājñātam", "en": "A thing is known or not known by virtue of its affecting [or not affecting] the mind-stuff."}, "4.18": {"pada": "Kaivalya-pāda", "deva": "सदा ज्ञाताश्चित्तवृत्तयस्तत्प्रभोः पुरुषस्यापरिणामित्वात्", "iast": "sadā jñātāś cittavṛttayas tatprabhoḥ puruṣasyāpariṇāmitvāt", "en": "Unintermittently the Master of that [mind-stuff] knows the fluctuations of mind-stuff [and thus] the Self undergoes-no-mutations."}, "4.19": {"pada": "Kaivalya-pāda", "deva": "न तत्स्वाभासं दृश्यत्वात्", "iast": "na tat svābhāsaṃ dṛśyatvāt", "en": "It does not illumine itself, since it is an object-for-sight."}, "4.20": {"pada": "Kaivalya-pāda", "deva": "एकसमये चोभयानवधारणम्", "iast": "ekasamaye cobhayānavadhāraṇam", "en": "And there cannot be a cognition of both [thinking-substance and thing] at the same time."}, "4.21": {"pada": "Kaivalya-pāda", "deva": "चित्तान्तरदृश्ये बुद्धिबुद्धेरतिप्रसङ्गः स्मृतिसंकरश्च", "iast": "cittāntaradṛśye buddhibuddher atiprasaṅgaḥ smṛtisaṃkaraś ca", "en": "If [one mind-stuff] were the object-for-sight for another, there would be an infinite regress from one thinking-substance to another thinking-substance as well as confusion of memory."}, "4.22": {"pada": "Kaivalya-pāda", "deva": "चितेरप्रतिसंक्रमायास्तदाकारापत्तौ स्वबुद्धिसंवेदनम्", "iast": "citer apratisaṃkramāyās tadākārāpattau svabuddhisaṃvedanam", "en": "The Intellect (citi) which unites not [with objects] is conscious of its own thinking-substance when [the mind-stuff] takes the form of that [thinking-substance by reflecting it]."}, "4.23": {"pada": "Kaivalya-pāda", "deva": "द्रष्टृदृश्योपरक्तं चित्तं सर्वार्थम्", "iast": "draṣṭṛdṛśyoparaktaṃ cittaṃ sarvārtham", "en": "Mind-stuff affected by the Seer and by the object-for-sight [leads to the perception of] all intended-objects."}, "4.24": {"pada": "Kaivalya-pāda", "deva": "तदसंख्येयवासनाभिश्चित्रमपि परार्थं संहत्यकारित्वात्", "iast": "tad asaṃkhyeyavāsanābhiś citram api parārthaṃ saṃhatyakāritvāt", "en": "This [mind-stuff], although diversified by countless subconscious-impressions, exists for the sake of another, because its nature is to produce [things as] combinations."}, "4.25": {"pada": "Kaivalya-pāda", "deva": "विशेषदर्शिन आत्मभावभावनानिवृत्तिः", "iast": "viśeṣadarśina ātmabhāvabhāvanānivṛttiḥ", "en": "For him who sees the distinction, pondering upon his own states-of-being ceases."}, "4.26": {"pada": "Kaivalya-pāda", "deva": "तदा विवेकनिम्नं कैवल्यप्राग्भारं चित्तम्", "iast": "tadā vivekanimnaṃ kaivalyaprāgbhāraṃ cittam", "en": "Then the mind-stuff is borne down to discrimination, onward towards Isolation."}, "4.27": {"pada": "Kaivalya-pāda", "deva": "तच्छिद्रेषु प्रत्ययान्तराणि संस्कारेभ्यः", "iast": "tacchidreṣu pratyayāntarāṇi saṃskārebhyaḥ", "en": "In the intervals of this [mind-stuff] there are other presented-ideas [coming] from subliminal-impressions."}, "4.28": {"pada": "Kaivalya-pāda", "deva": "हानमेषां क्लेशवदुक्तम्", "iast": "hānam eṣāṃ kleśavad uktam", "en": "The escape from these [subliminal-impressions] is described as being like [the escape from] the hindrances."}, "4.29": {"pada": "Kaivalya-pāda", "deva": "प्रसंख्याने ऽप्यकुसीदस्य सर्वथा विवेकख्यातेर्धर्ममेघः समाधिः", "iast": "prasaṃkhyāne 'py akusīdasya sarvathā vivekakhyāter dharmameghaḥ samādhiḥ", "en": "For one who is not usurious even in respect of Elevation, there follows in every case as a result of discriminative discernment the concentration [called] Rain-cloud of [knowable] things."}, "4.30": {"pada": "Kaivalya-pāda", "deva": "ततः क्लेशकर्मनिवृत्तिः", "iast": "tataḥ kleśakarmanivṛttiḥ", "en": "Then follows the cessation of the hindrances and of karma."}, "4.31": {"pada": "Kaivalya-pāda", "deva": "तदा सर्वावरणमलापेतस्य ज्ञानस्यानन्त्याज्ज्ञेयमल्पम्", "iast": "tadā sarvāvaraṇamalāpetasya jñānasyānantyāj jñeyam alpam", "en": "Then, because of the endlessness of knowledge from which all obscuring defilements have passed away, what is yet to be known amounts to little."}, "4.32": {"pada": "Kaivalya-pāda", "deva": "ततः कृतार्थानां परिणामक्रमसमाप्तिर्गुणानाम्", "iast": "tataḥ kṛtārthānāṃ pariṇāmakramasamāptir guṇānām", "en": "When as a result of this the aspects (guṇa) have fulfilled their purpose, they attain to the limit of the sequence of mutations."}, "4.33": {"pada": "Kaivalya-pāda", "deva": "क्षणप्रतियोगी परिणामापरान्तनिर्ग्राह्यः क्रमः", "iast": "kṣaṇapratiyogī pariṇāmāparāntanirgrāhyaḥ kramaḥ", "en": "The positive correlate to the moment, recognized as such at the final limit of the mutation, is a sequence."}, "4.34": {"pada": "Kaivalya-pāda", "deva": "पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः कैवल्यं स्वरूपप्रतिष्ठा वा चितिशक्तिरिति", "iast": "puruṣārthaśūnyānāṃ guṇānāṃ pratiprasavaḥ kaivalyaṃ svarūpapratiṣṭhā vā citiśaktir iti", "en": "Isolation is the inverse generation of the aspects, no longer provided with a purpose by the Self, or it is the Energy of Intellect grounded in itself."}};
const DN = s => s.replace(/\d/g, d => "०१२३४५६७८९"[d]);
const q = new URLSearchParams(location.search), last = q.get("last"), next = last ? (q.get("next") || "2.47") : "1.1";
const s = SUTRAS[next], $ = id => document.getElementById(id);
if (last){ $("next-k").textContent = "Up next"; $("next-s").textContent = `You stopped at ${last}  ·  ${s.pada}`;
  $("go").textContent = `Continue at ${next}`; $("alt").textContent = `Reread ${last}`; }
else { $("next-k").textContent = "Begin here"; $("next-s").textContent = "The first sūtra of 195";
  $("go").textContent = "Read 1.1"; $("alt").textContent = "Browse the four chapters"; }
$("num").textContent = DN(next); $("deva").textContent = s.deva; $("iast").textContent = s.iast;
$("en").innerHTML = s.en.replace(/\[([^\]]+)\]/g, '<span class="sup">[$1]</span>');

</script>
