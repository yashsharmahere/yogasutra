<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekatāna hero mock v3</title>
<style>
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-opsz-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-ext-opsz-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;src:url(fonts/literata-latin-opsz-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;src:url(fonts/literata-latin-ext-opsz-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Tiro Devanagari Sanskrit';font-weight:400;src:url(fonts/tiro-devanagari-sanskrit-devanagari-400-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}

:root{
  --navy:#0b1230; --gold:#dcb257; --paper:#efe8d6; --muted:#d3cdbd; --dim:#a9a593;
  --ochre:#e0bd72; --ink:#1d140a; --ink2:#4a3416; --rule:#9a3a20; --edge:#3b2810;
  --serif:'Literata',Georgia,serif; --deva:'Tiro Devanagari Sanskrit',serif;
  --gut:clamp(20px,3.8vw,64px);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--navy);color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{overflow-x:clip}
a{color:inherit}

.stage{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#0b1230 url(img/sky2.webp) center/cover no-repeat}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(180deg,rgba(7,11,34,.92) 0,rgba(7,11,34,.5) 11%,rgba(7,11,34,0) 24%),
  linear-gradient(90deg,rgba(7,11,34,.72) 0,rgba(7,11,34,.5) 36%,rgba(7,11,34,0) 62%),
  radial-gradient(120% 90% at 50% 50%,rgba(8,12,38,.15) 45%,rgba(5,8,28,.55) 100%)}

.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:clamp(20px,3.2vw,52px) var(--gut) 0}
.mark{font-size:clamp(24px,2vw,32px);color:var(--gold);text-decoration:none}
.nav{display:flex;gap:clamp(18px,2.2vw,38px);font-size:clamp(13px,.95vw,16px)}
.nav a{text-decoration:none;opacity:.9;padding:.3em 0;background:linear-gradient(var(--gold),var(--gold)) left bottom/0 1px no-repeat;transition:background-size .25s,color .2s}
.nav a:hover{color:var(--gold);background-size:100% 1px}

.lead{position:relative;z-index:5;width:min(54vw,960px);margin:clamp(40px,8vh,96px) 0 0 var(--gut)}
.intro h1{text-wrap:balance;font-weight:400;font-size:clamp(30px,3.1vw,56px);line-height:1.08;letter-spacing:-.01em}
.intro p{margin-top:.9em;font-size:clamp(15px,1.15vw,19px);line-height:1.6;color:var(--muted);max-width:33em}

/* the leaf is now a reading card: what to read next */
.next{margin-top:clamp(36px,6vh,64px)}
.next-h{display:flex;align-items:baseline;justify-content:space-between;gap:1em;margin-bottom:14px;font-size:clamp(13px,.95vw,16px)}
.next-h .k{color:var(--gold)}
.next-h .s{color:var(--dim)}
.pothi{position:relative;display:block;text-decoration:none;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.pothi:hover{transform:translateY(-3px)}
.pothi:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:24px}
.leaf{position:relative;z-index:1;border:1.5px solid var(--edge);border-radius:22px/50%;background:
  repeating-linear-gradient(180deg,transparent 0 10px,rgba(92,60,20,.15) 10px 11px),var(--ochre);
  display:grid;place-items:center;text-align:center;padding:clamp(18px,2.1vw,34px) 15% clamp(18px,2.1vw,34px) 12%;isolation:isolate;min-height:clamp(120px,11vw,200px)}
.leaf::before{content:"";position:absolute;inset:0;border-radius:inherit;background:url(img/leaf-fibre.webp) center/100% 100%;opacity:.16;mix-blend-mode:multiply;z-index:-1}
.under{position:absolute;left:3%;right:3%;top:0;bottom:0;z-index:0;border:1.5px solid var(--edge);border-radius:22px/50%}
.under.u1{transform:translateY(7px);background:#a98140}
.under.u2{transform:translateY(13px);left:6%;right:6%;background:#7a5a26}
.rule{position:absolute;top:16%;bottom:16%;width:5px;border-left:1.5px solid var(--rule);border-right:1.5px solid var(--rule);opacity:.8}
.rule.a{left:8.5%} .rule.b{right:11%}
.hole{position:absolute;right:5.6%;top:50%;width:clamp(14px,1.3vw,22px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:var(--navy);border:1.5px solid var(--edge)}
.num{position:absolute;left:2.4%;top:50%;transform:translateY(-50%);font-family:var(--deva);font-size:clamp(14px,1.15vw,21px);color:var(--rule)}
.txt{width:100%;min-width:0}
.sutra{font-family:var(--deva);color:var(--ink);font-size:clamp(28px,3.4vw,60px);line-height:1.15;white-space:nowrap}
.iast{font-style:italic;color:var(--ink2);font-size:clamp(13px,1.15vw,20px);margin-top:.1em}
.en{color:var(--ink);font-size:clamp(14px,1.2vw,21px);margin-top:.55em;line-height:1.4}
.en .sup{color:#7c6236}

.act{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px);margin-top:clamp(26px,3.6vh,40px);flex-wrap:wrap}
.btn{font-family:var(--serif);font-size:clamp(14px,1.05vw,18px);padding:.85em 1.7em;border-radius:7px;text-decoration:none;border:1px solid var(--gold);transition:background .2s}
.btn.p{background:var(--gold);color:#17120a;font-weight:600}
.btn.p:hover{background:#ecc775}
.lnk{font-size:clamp(14px,1.02vw,17px);color:var(--muted);text-decoration:underline;text-decoration-color:rgba(220,178,87,.55);text-underline-offset:4px}
.lnk:hover{color:var(--gold)}

.yogi-box{position:absolute;z-index:3;right:0;bottom:0;width:min(42vw,800px)}
.yogi{display:block;width:100%;height:auto;transform:scaleX(-1)}

.thread{position:absolute;inset:0;z-index:7;pointer-events:none;width:100%;height:100%;overflow:visible}
.thread path{fill:none;stroke:#e6bd62;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(220,178,87,.5))}
.thread circle{fill:#e6bd62}
@media (prefers-reduced-motion:no-preference){
  .thread .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .7s cubic-bezier(.5,.1,.2,1) forwards}
  #tt{animation-duration:.45s;animation-delay:2.9s}
  .thread circle{opacity:0;animation:fade .3s 3.3s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
}

@media (max-width:820px){
  .nav a:not(:last-child){display:none}
  .lead{width:auto;margin:36px var(--gut) 0;display:flex;flex-direction:column}
  .intro h1{font-size:clamp(28px,7.6vw,40px)}
  .intro p{font-size:15.5px}
  .leaf{border-radius:16px/50%;padding:20px 15% 20px 11%;min-height:0}
  .under{border-radius:16px/50%}
  .under.u1{transform:translateY(5px)} .under.u2{transform:translateY(9px)}
  .sutra{font-size:clamp(24px,7vw,42px)}
  .en{font-size:14px}
  .next-h{flex-direction:column;gap:2px}
  .yogi-box{position:relative;width:auto;height:clamp(170px,48vw,280px);overflow:hidden;margin:22px calc(-1*var(--gut)) 0;z-index:3;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
  .yogi{position:absolute;right:-8%;top:0;width:118%;max-width:none}
  .act .btn{flex:1 1 100%;text-align:center}
  #tt,#knot{display:none}
  .num{display:none}
  .stage{padding-bottom:40px;min-height:0}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top">
    <a class="mark" href="#">Ekatāna</a>
    <nav class="nav"><a href="#">Read</a><a href="#">Concepts</a><a href="#">Gītā</a><a href="#">Visuals</a><a href="#">Patañjali</a><a href="#">Ask</a></nav>
  </header>

  <div class="lead">
    <section class="intro">
      <h1>A connected reader for Patañjali’s Yoga&nbsp;Sūtra.</h1>
      <p>All 195 sūtras in Sanskrit, with three public-domain translations, linked by the words they share.</p>
    </section>

    <section class="next" aria-labelledby="next-k">
      <div class="next-h"><span class="k" id="next-k"></span><span class="s" id="next-s"></span></div>
      <a class="pothi" id="pothi" href="#">
        <span class="under u2"></span><span class="under u1"></span>
        <div class="leaf">
          <span class="rule a"></span><span class="rule b"></span>
          <span class="num" lang="sa" id="num"></span>
          <span class="hole" id="hole"></span>
          <div class="txt">
            <div class="sutra" lang="sa" id="deva"></div>
            <div class="iast" lang="sa-Latn" id="iast"></div>
            <div class="en" id="en"></div>
          </div>
        </div>
      </a>
    </section>

    <div class="yogi-box" id="ybox-m"></div>

    <div class="act">
      <a class="btn p" id="go" href="#"></a>
      <a class="lnk" id="alt" href="#"></a>
      <a class="lnk" href="#">Ask a question</a>
    </div>
  </div>

  <div class="yogi-box" id="ybox"><img class="yogi" id="yogi" src="img/yogi.webp" alt="A seated yogi in profile with a thin gold halo"></div>
  <svg class="thread" id="thread" aria-hidden="true"><path class="draw" id="tp" pathLength="1"/><path class="draw" id="tt" pathLength="1"/><circle id="knot" r="3.4"/></svg>
</main>

<script>
// Sample data straight from the corpus (Woods 1914). In the real site this comes from data/corpus.json,
// and "last read" is written to localStorage (ek:last) by each sūtra page.
const SUTRAS = {
  "1.1":  {pada:"Samādhi-pāda", deva:"अथ योगानुशासनम्", iast:"atha yogānuśāsanam", en:"Now the exposition of yoga [is to be made]."},
  "1.2":  {pada:"Samādhi-pāda", deva:"योगश्चित्तवृत्तिनिरोधः", iast:"yogaś cittavṛttinirodhaḥ", en:"Yoga is the restriction of the fluctuations of mind-stuff."},
  "2.46": {pada:"Sādhana-pāda", deva:"स्थिरसुखमासनम्", iast:"sthirasukham āsanam", en:"Stable-and-easy posture."},
  "2.47": {pada:"Sādhana-pāda", deva:"प्रयत्नशैथिल्यानन्तसमापत्तिभ्याम्", iast:"prayatnaśaithilyānantasamāpattibhyām", en:"By relaxation of effort or by a [mental] state-of-balance with reference to Ananta."},
};
const DN = s => s.replace(/\d/g, d => "०१२३४५६७८९"[d]);
const q = new URLSearchParams(location.search);
const last = q.get("last");                       // e.g. ?last=2.46 simulates a returning reader
const next = last ? q.get("next") || "2.47" : "1.1";
const s = SUTRAS[next], $ = id => document.getElementById(id);
if (last){
  $("next-k").textContent = "Up next";
  $("next-s").textContent = `You stopped at ${last}  ·  ${s.pada}`;
  $("go").textContent = `Continue at ${next}`;
  $("alt").textContent = `Reread ${last}`;
} else {
  $("next-k").textContent = "Begin here";
  $("next-s").textContent = "The first sūtra of 195";
  $("go").textContent = "Read 1.1";
  $("alt").textContent = "Browse the four chapters";
}
$("num").textContent = DN(next);
$("deva").textContent = s.deva; $("iast").textContent = s.iast;
$("en").innerHTML = s.en.replace(/\[([^\]]+)\]/g, '<span class="sup">[$1]</span>');

function fit(){                                    // long compounds shrink to stay on one line
  const el = $("deva"); el.style.fontSize = "";
  let f = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.parentElement.clientWidth && f > 14){ f -= 1; el.style.fontSize = f + "px"; }
}
const HALO = {x:.363, y:.004};
const ybox = $("ybox");
function place(){
  const m = innerWidth <= 820;
  if (m && !ybox.dataset.moved){ $("ybox-m").replaceWith(ybox); ybox.dataset.moved = 1; }
  if (!m && ybox.dataset.moved){ const d = document.createElement("div"); d.id = "ybox-m"; d.className = "yogi-box";
    ybox.replaceWith(d); $("stage").insertBefore(ybox, $("thread")); delete ybox.dataset.moved; }
}
function draw(){
  place(); fit();
  const st = $("stage").getBoundingClientRect(), h = $("hole").getBoundingClientRect(), y = $("yogi").getBoundingClientRect();
  const hx = h.left + h.width/2 - st.left, hy = h.top + h.height/2 - st.top;
  const sx = y.left + y.width*(1-HALO.x) - st.left, sy = y.top + y.height*HALO.y - st.top;
  const dx = sx - hx, dy = sy - hy;
  const main = `M ${sx} ${sy} C ${sx} ${sy - Math.max(36, Math.abs(dy)*.45)}, ${hx + dx*.45} ${hy + Math.min(50, dy*.3)}, ${hx} ${hy}`;
  const k = innerWidth <= 820 ? 20 : 30, tx = hx - k*.5, ty = hy + k*1.7;
  $("tp").setAttribute("d", main);
  $("tt").setAttribute("d", `M ${hx} ${hy} C ${hx - k*.9} ${hy + k*.2}, ${hx - k*.7} ${hy + k*1.2}, ${tx} ${ty}`);
  $("knot").setAttribute("cx", tx); $("knot").setAttribute("cy", ty);
  $("thread").setAttribute("viewBox", `0 0 ${st.width} ${st.height}`);
}
addEventListener("resize", draw);
document.fonts.ready.then(draw);
$("yogi").addEventListener("load", draw);
draw();
</script>
</body>
</html>
