<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekatāna hero mock v2</title>
<style>
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-opsz-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;src:url(fonts/literata-latin-ext-opsz-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;src:url(fonts/literata-latin-opsz-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;src:url(fonts/literata-latin-ext-opsz-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Tiro Devanagari Sanskrit';font-weight:400;src:url(fonts/tiro-devanagari-sanskrit-devanagari-400-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}

:root{
  --navy:#0b1230; --gold:#dcb257; --paper:#efe8d6; --muted:#d3cdbd;
  --ochre:#e0bd72; --ink:#1d140a; --ink2:#4a3416; --rule:#9a3a20; --edge:#3b2810;
  --serif:'Literata',Georgia,serif; --deva:'Tiro Devanagari Sanskrit',serif;
  --gut:clamp(20px,3.8vw,64px);
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--navy);color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{overflow-x:clip}
a{color:inherit}

.stage{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#0b1230 url(img/sky2.webp) center/cover no-repeat}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(180deg,rgba(7,11,34,.92) 0,rgba(7,11,34,.5) 11%,rgba(7,11,34,0) 24%),
  linear-gradient(90deg,rgba(7,11,34,.7) 0,rgba(7,11,34,.45) 34%,rgba(7,11,34,0) 60%),
  radial-gradient(120% 90% at 50% 50%,rgba(8,12,38,.15) 45%,rgba(5,8,28,.55) 100%)}

/* header: shares the page gutter */
.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:clamp(20px,3.2vw,52px) var(--gut) 0}
.mark{font-size:clamp(24px,2vw,32px);color:var(--gold);text-decoration:none}
.nav{display:flex;gap:clamp(18px,2.2vw,38px);font-size:clamp(13px,.95vw,16px)}
.nav a{text-decoration:none;opacity:.9;padding:.3em 0;background:linear-gradient(var(--gold),var(--gold)) left bottom/0 1px no-repeat;transition:background-size .25s,color .2s}
.nav a:hover{color:var(--gold);background-size:100% 1px}

/* one left column: leaf, then copy, on the same edge as the wordmark */
.lead{position:relative;z-index:5;width:min(56vw,1000px);margin:clamp(48px,9vh,110px) 0 0 var(--gut)}

/* flat gouache leaf, drawn in CSS */
.pothi{position:relative;transform:rotate(-1.5deg);transform-origin:0 50%}
.leaf{position:relative;z-index:1;aspect-ratio:4.7/1;border:1.5px solid var(--edge);border-radius:22px/50%;background:
  repeating-linear-gradient(180deg,transparent 0 10px,rgba(92,60,20,.16) 10px 11px),var(--ochre);
  display:grid;place-items:center;text-align:center;padding:0 15% 0 13%;isolation:isolate}
.leaf::before{content:"";position:absolute;inset:0;border-radius:inherit;background:url(img/leaf-fibre.webp) center/100% 100%;opacity:.16;mix-blend-mode:multiply;z-index:-1}
.under{position:absolute;left:3%;right:3%;height:100%;top:0;z-index:0;border:1.5px solid var(--edge);border-radius:22px/50%}
.under.u1{transform:translateY(7px);background:#a98140}
.under.u2{transform:translateY(13px);left:6%;right:6%;background:#7a5a26}
.rule{position:absolute;top:16%;bottom:16%;width:5px;border-left:1.5px solid var(--rule);border-right:1.5px solid var(--rule);opacity:.8}
.rule.a{left:8%} .rule.b{right:11%}
.hole{position:absolute;right:5.6%;top:50%;width:2.5%;aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:var(--navy);border:1.5px solid var(--edge)}
.num{position:absolute;right:13.2%;top:12%;font-family:var(--deva);font-size:clamp(14px,1.15vw,21px);color:var(--rule)}
.sutra{font-family:var(--deva);color:var(--ink);font-size:clamp(30px,3.9vw,70px);line-height:1.12}
.iast{font-style:italic;color:var(--ink2);font-size:clamp(13px,1.2vw,21px);margin-top:.15em;letter-spacing:.01em}

/* copy */
.copy{margin-top:clamp(40px,6.5vh,72px);max-width:min(44vw,700px)}
.copy h1{text-wrap:balance;font-weight:400;font-size:clamp(30px,3.1vw,56px);line-height:1.08;letter-spacing:-.01em;color:var(--paper)}
.copy .ref{display:block;font-size:clamp(12px,.85vw,14px);letter-spacing:.04em;color:var(--gold);margin-bottom:.9em}
.copy p{margin-top:1em;font-size:clamp(15px,1.15vw,19px);line-height:1.6;color:var(--muted);max-width:33em}
.cta{display:flex;gap:14px;margin-top:2em;flex-wrap:wrap}
.btn{font-family:var(--serif);font-size:clamp(14px,1.05vw,18px);padding:.85em 1.7em;border-radius:7px;text-decoration:none;border:1px solid var(--gold);transition:background .2s,color .2s}
.btn.p{background:var(--gold);color:#17120a;font-weight:600}
.btn.p:hover{background:#ecc775}
.btn.g{color:var(--gold);background:rgba(11,18,48,.35)}
.btn.g:hover{background:rgba(220,178,87,.14)}

/* yogi: bottom-right, turned to face the text */
.yogi-box{position:absolute;z-index:3;right:0;bottom:0;width:min(44vw,820px)}
.yogi{display:block;width:100%;height:auto;transform:scaleX(-1)}

/* thread: rises from the halo to the string-hole */
.thread{position:absolute;inset:0;z-index:7;pointer-events:none;width:100%;height:100%;overflow:visible}
.thread path{fill:none;stroke:#e6bd62;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(220,178,87,.5))}
.thread circle{fill:#e6bd62}
@media (prefers-reduced-motion:no-preference){
  .thread .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .6s cubic-bezier(.5,.1,.2,1) forwards}
  .thread circle{opacity:0;animation:fade .4s 2.9s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #tt{animation-duration:.5s;animation-delay:3s}
  @keyframes fade{to{opacity:1}}
  .lead{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

@media (max-width:820px){
  .nav a:not(:last-child){display:none}
  .lead{width:auto;margin:40px var(--gut) 0;display:flex;flex-direction:column}
  .pothi{transform:rotate(-1deg)}
  .leaf{aspect-ratio:3.5/1;padding:0 15% 0 12%;border-radius:16px/50%}
  .under{border-radius:16px/50%}
  .under.u1{transform:translateY(5px)} .under.u2{transform:translateY(9px)}
  .sutra{font-size:clamp(26px,7.6vw,48px)}
  .iast{font-size:clamp(12px,3.4vw,18px)}
  .yogi-box{position:relative;width:auto;height:clamp(190px,56vw,320px);overflow:hidden;margin:26px calc(-1*var(--gut)) 0;z-index:3;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
  .yogi{position:absolute;right:-8%;top:0;width:118%;max-width:none}
  .copy{margin-top:8px;max-width:none;order:3}
  .copy h1{font-size:clamp(28px,7.6vw,40px)}
  .copy p{font-size:15.5px}
  .cta .btn{flex:1;text-align:center;padding:.9em 1em;font-size:15px}
  .stage{padding-bottom:40px;min-height:0}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top">
    <a class="mark" href="#">Ekatāna</a>
    <nav class="nav"><a href="#">Read</a><a href="#">Concepts</a><a href="#">Gītā</a><a href="#">Visuals</a><a href="#">Patañjali</a><a href="#">Ask</a></nav>
  </header>

  <div class="lead">
    <div class="pothi">
      <span class="under u2"></span><span class="under u1"></span>
      <div class="leaf">
        <span class="rule a"></span><span class="rule b"></span>
        <span class="num" lang="sa">१.१</span>
        <span class="hole" id="hole"></span>
        <div>
          <div class="sutra" lang="sa">अथ योगानुशासनम्</div>
          <div class="iast" lang="sa-Latn">atha yogānuśāsanam</div>
        </div>
      </div>
    </div>

    <div class="yogi-box m-only-slot" id="ybox-m"></div>

    <section class="copy">
      <h1>Now, the teaching of yoga begins.</h1>
      <p>A connected reader for Patañjali’s Yoga Sūtra: all 195 sūtras in Sanskrit, with three public-domain translations, linked by the words they share.</p>
      <div class="cta"><a class="btn p" href="#">Begin at 1.1</a><a class="btn g" href="#">Ask a question</a></div>
    </section>
  </div>

  <div class="yogi-box" id="ybox"><img class="yogi" id="yogi" src="img/yogi.webp" alt="A seated yogi in profile with a thin gold halo"></div>

  <svg class="thread" id="thread" aria-hidden="true"><path class="draw" id="tp" pathLength="1"/><path class="draw" id="tt" pathLength="1"/><circle id="knot" r="3.4"/></svg>
</main>

<script>
// Thread rises from the top of the yogi's halo and passes through the leaf's string-hole.
const HALO = {x:.363, y:.004};                 // halo top in yogi.webp, before mirroring
const ybox = document.getElementById('ybox'), slot = document.getElementById('ybox-m');
function place(){                                // on phones the yogi sits between leaf and copy
  const m = innerWidth <= 820;
  if (m && ybox.parentElement !== slot.parentElement){ slot.replaceWith(ybox); ybox.dataset.moved=1; }
  if (!m && ybox.dataset.moved){ const s=document.createElement('div'); s.id='ybox-m'; s.className='yogi-box m-only-slot';
    ybox.replaceWith(s); document.getElementById('stage').insertBefore(ybox, document.getElementById('thread')); delete ybox.dataset.moved; }
}
function draw(){
  place();
  const st = document.getElementById('stage').getBoundingClientRect();
  const h = document.getElementById('hole').getBoundingClientRect();
  const y = document.getElementById('yogi').getBoundingClientRect();
  const hx = h.left + h.width/2 - st.left, hy = h.top + h.height/2 - st.top;
  const sx = y.left + y.width*(1-HALO.x) - st.left, sy = y.top + y.height*HALO.y - st.top;   // mirrored
  const dy = sy - hy, dx = sx - hx;
  const main = `M ${sx} ${sy} C ${sx} ${sy - dy*.45}, ${hx + dx*.45} ${hy + Math.min(60, dy*.35)}, ${hx} ${hy}`;
  const k = innerWidth <= 820 ? 22 : 34;
  const tx = hx - k*.5, ty = hy + k*1.7;
  const tail = `M ${hx} ${hy} C ${hx - k*.9} ${hy + k*.2}, ${hx - k*.7} ${hy + k*1.2}, ${tx} ${ty}`;
  document.getElementById('tp').setAttribute('d', main);
  document.getElementById('tt').setAttribute('d', tail);
  const kn = document.getElementById('knot'); kn.setAttribute('cx', tx); kn.setAttribute('cy', ty);
  document.getElementById('thread').setAttribute('viewBox', `0 0 ${st.width} ${st.height}`);
}
addEventListener('resize', draw);
document.fonts.ready.then(draw);
document.getElementById('yogi').addEventListener('load', draw);
draw();
</script>
</body>
</html>
